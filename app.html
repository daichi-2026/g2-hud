<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム英語認識・講義翻訳 (v10.1)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #111;
      color: #00FF00;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      height: 100vh;
      gap: 15px;
    }
    .main-container { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .display-box {
      background-color: #000;
      border: 2px solid #00FF00;
      border-radius: 8px;
      padding: 12px;
      display: flex; flex-direction: column; gap: 6px; flex: 1; overflow: hidden;
    }
    .display-box.japanese { border-color: #00FFFF; }
    .section-title { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .display-box.japanese .section-title { color: #00FFFF; }
    .content-area {
      color: #00FF00; font-size: 15px; font-weight: bold; line-height: 1.6;
      overflow-y: auto; flex: 1; white-space: pre-wrap; word-break: break-word;
      background: #050505; padding: 12px; border: 1px solid #222; border-radius: 4px;
    }
    .display-box.japanese .content-area { color: #FFFFFF; font-size: 15px; font-weight: normal; }
    .side-panel {
      width: 360px; display: flex; flex-direction: column; gap: 10px;
      background: #1a1a1a; padding: 12px; border-radius: 8px; border: 1px solid #333;
      overflow-y: auto; color: #ccc; font-size: 12px;
    }
    h2 { color: #00FF00; font-size: 15px; margin: 0 0 6px 0; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #00FF00; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
    input, select, button { background: #222; border: 1px solid #444; color: #fff; padding: 7px; border-radius: 4px; font-size: 12px; width: 100%; }
    button { background: #00aa00; color: #fff; font-weight: bold; cursor: pointer; border: none; padding: 9px; transition: background 0.2s; }
    button:hover { background: #00dd00; color: #000; }
    button.stop-btn { background: #cc3333; }
    button.stop-btn:hover { background: #ff4444; color: #fff; }
    .status { font-size: 11px; color: #aaa; padding: 6px; background: #080808; border: 1px solid #222; border-radius: 4px; }
    .log-box { background: #000; border: 1px solid #333; color: #66ff66; font-family: monospace; font-size: 10px; height: 100px; overflow-y: auto; padding: 6px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="display-box">
      <div class="section-title">【リアルタイム英語文字起こし (WHISPER API)】</div>
      <div id="transcriptDisplay" class="content-area">(音声認識を開始してください...)</div>
    </div>
    <div class="display-box japanese">
      <div class="section-title">【自然な日本語訳 (GEMINI 文脈補正版)】</div>
      <div id="translationDisplay" class="content-area">(翻訳結果がここに表示されます...)</div>
    </div>
  </div>

  <div class="side-panel">
    <h2>
      <span>英語講義翻訳アシスト</span>
      <span class="badge">v10.1</span>
    </h2>

    <div>
      <label style="color:#00FF00; font-weight:bold;">OpenAI API Key (Whisper用):</label>
      <input type="password" id="openaiKey" placeholder="sk-proj-...">
    </div>

    <div>
      <label style="color:#00FF00; font-weight:bold;">Gemini API Key (翻訳用):</label>
      <input type="password" id="geminiKey" placeholder="AIzaSy...">
    </div>

    <div>
      <label style="color:#00FF00; font-weight:bold;">Gemini モデル指定:</label>
      <input type="text" id="modelInput" value="gemini-3.6-flash" placeholder="gemini-3.6-flash">
    </div>

    <div>
      <label style="color:#00FF00; font-weight:bold;">音声送信間隔 (秒):</label>
      <input type="number" id="intervalSec" value="5" min="2" max="15">
    </div>

    <div style="display:flex; gap:8px;">
      <button id="startBtn" onclick="startProcessing()">🎤 認識開始</button>
      <button id="stopBtn" class="stop-btn" onclick="stopProcessing()" disabled>⏹ 停止</button>
    </div>

    <div style="display:flex; gap:8px;">
      <button id="ttsBtn" onclick="toggleContinuousTTS()" style="background:#00aaff; color:#000;">🔊 最新から連続朗読</button>
      <button onclick="stopSpeaking()" style="background:#882222; width:40%;">⏹ 読上停止</button>
    </div>

    <div style="display:flex; gap:8px;">
      <button onclick="downloadTranscript()" style="background:#0088cc;">💾 TXT保存</button>
      <button onclick="clearTranscript()" style="background:#444;">🗑️ 表示クリア</button>
    </div>

    <div style="border-top:1px solid #333; margin:2px 0;"></div>

    <div style="font-weight:bold; color:#00FF00;">【動作ステータス】</div>
    <div id="status" class="status">待機中</div>

    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:bold; color:#00FF00;">【詳細ログ】</span>
      <button onclick="clearLog()" style="padding:2px 6px; font-size:10px; background:#444; width:auto;">クリア</button>
    </div>
    <div id="logBox" class="log-box">[System v10.1] Whisper Filter Ready.</div>
  </div>

  <script>
    let isRunning = false;
    let audioStream = null;
    let mediaRecorder = null;

    let fullTranscript = '';
    let finalJapaneseText = '';

    let ttsQueue = [];
    let isTtsActive = false;
    let isSpeakingNow = false;

    window.addEventListener('DOMContentLoaded', () => {
      const savedOpenaiKey = localStorage.getItem('openai_api_key');
      if (savedOpenaiKey) document.getElementById('openaiKey').value = savedOpenaiKey;

      const savedGeminiKey = localStorage.getItem('gemini_api_key');
      if (savedGeminiKey) document.getElementById('geminiKey').value = savedGeminiKey;

      const savedModel = localStorage.getItem('gemini_model_name');
      if (savedModel) document.getElementById('modelInput').value = savedModel;
    });

    document.getElementById('openaiKey').addEventListener('change', (e) => {
      localStorage.setItem('openai_api_key', e.target.value.trim());
    });

    document.getElementById('geminiKey').addEventListener('change', (e) => {
      localStorage.setItem('gemini_api_key', e.target.value.trim());
    });

    document.getElementById('modelInput').addEventListener('change', (e) => {
      localStorage.setItem('gemini_model_name', e.target.value.trim());
    });

    function log(tag, msg) {
      const timeStr = new Date().toLocaleTimeString();
      const logBox = document.getElementById('logBox');
      if (logBox) {
        logBox.innerText = `[${timeStr}] [${tag}] ${msg}\n` + logBox.innerText;
      }
    }

    function setStatus(msg) {
      const statusEl = document.getElementById('status');
      if (statusEl) statusEl.innerText = msg;
    }

    async function startProcessing() {
      const openaiKey = document.getElementById('openaiKey').value.trim();
      const geminiKey = document.getElementById('geminiKey').value.trim();

      if (!openaiKey || !geminiKey) {
        alert("OpenAI API Key と Gemini API Key の両方を入力してください。");
        return;
      }

      try {
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        isRunning = true;

        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        setStatus("録音・解析中... (マイクON)");
        log("System", "マイク録音を開始しました");

        const intervalMs = parseInt(document.getElementById('intervalSec').value) * 1000;
        recordAndProcessChunk(openaiKey, geminiKey, intervalMs);

      } catch (e) {
        log("Error", `マイク起動エラー: ${e.message}`);
        setStatus("エラー: マイク起動失敗");
      }
    }

    function recordAndProcessChunk(openaiKey, geminiKey, duration) {
      if (!isRunning) return;

      const chunks = [];
      mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

      mediaRecorder.onstop = async () => {
        if (chunks.length > 0 && isRunning) {
          const audioBlob = new Blob(chunks, { type: 'audio/webm' });
          processWhisperAndTranslate(audioBlob, openaiKey, geminiKey);
        }
        if (isRunning) {
          recordAndProcessChunk(openaiKey, geminiKey, duration);
        }
      };

      mediaRecorder.start();
      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          mediaRecorder.stop();
        }
      }, duration);
    }

    async function processWhisperAndTranslate(audioBlob, openaiKey, geminiKey) {
      const formData = new FormData();
      formData.append("file", audioBlob, "audio.webm");
      formData.append("model", "whisper-1");
      formData.append("language", "en");
      // 無音時の「Thank you.」連発を抑止する指示パラメータ
      formData.append("prompt", "Transcribe the spoken English accurately. Do not output anything if there is silence.");

      try {
        const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${openaiKey}` },
          body: formData
        });

        if (!response.ok) {
          const errData = await response.json();
          log("Whisper Error", errData.error?.message || response.statusText);
          return;
        }

        const data = await response.json();
        let englishText = data.text ? data.text.trim() : '';

        // Whisperの無音幻聴パターン（Thank you, Youなど）を除外
        if (/^(thank you|you|\.|\s)+$/i.test(englishText)) {
          englishText = '';
        }

        if (englishText) {
          fullTranscript += (fullTranscript ? ' ' : '') + englishText;
          renderEnglish();
          log("Whisper", `認識成功: "${englishText}"`);

          await translateWithGemini(englishText, geminiKey);
        }
      } catch (e) {
        log("Error", `Whisper 通信エラー: ${e.message}`);
      }
    }

    async function translateWithGemini(englishText, geminiKey) {
      let modelName = document.getElementById('modelInput').value.trim() || 'gemini-3.6-flash';
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${geminiKey}`;

      const prompt = `Translate the following English presentation/lecture segment into clear, natural, and fluent Japanese.
Output ONLY the translated Japanese text. Do NOT include original English, explanations, or quotes.

English:
"${englishText}"`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.1, maxOutputTokens: 300 }
          })
        });

        if (response.ok) {
          const data = await response.json();
          let translatedText = (data.candidates?.[0]?.content?.parts?.[0]?.text || '').trim();

          translatedText = translatedText.replace(/[a-zA-Z]{3,}/g, '');
          translatedText = translatedText.replace(/^[`"'\s\-*:]+|[`"'\s\-*:]+$/g, '');

          if (translatedText.trim()) {
            finalJapaneseText += (finalJapaneseText ? '\n' : '') + translatedText;
            renderJapanese();

            if (isTtsActive) {
              ttsQueue.push(translatedText);
              processTtsQueue();
            }
          }
        } else {
          const errData = await response.json();
          log("Gemini Error", errData.error?.message || response.statusText);
        }
      } catch (e) {
        log("Error", `Gemini 通信エラー: ${e.message}`);
      }
    }

    function renderEnglish() {
      const enDisplay = document.getElementById('transcriptDisplay');
      if (enDisplay) {
        enDisplay.innerText = fullTranscript || '(音声認識を開始してください...)';
        enDisplay.scrollTop = enDisplay.scrollHeight;
      }
    }

    function renderJapanese() {
      const jaDisplay = document.getElementById('translationDisplay');
      if (jaDisplay) {
        jaDisplay.innerText = finalJapaneseText || '(翻訳結果がここに表示されます...)';
        jaDisplay.scrollTop = jaDisplay.scrollHeight;
      }
    }

    function stopProcessing() {
      isRunning = false;
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
      }
      stopSpeaking();
      setStatus("停止中");
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      log("System", "処理を停止しました");
    }

    function toggleContinuousTTS() {
      if (isTtsActive) stopSpeaking();
      else startContinuousTTS();
    }

    function startContinuousTTS() {
      if (!('speechSynthesis' in window)) return;
      isTtsActive = true;
      ttsQueue = [];
      const lines = finalJapaneseText.trim().split('\n').filter(l => l.trim().length > 0);
      if (lines.length > 0) ttsQueue.push(lines[lines.length - 1]);

      const btn = document.getElementById('ttsBtn');
      if (btn) {
        btn.innerText = "🔊 連続朗読中 (タップで停止)";
        btn.style.background = "#ff9900";
      }
      log("TTS", "朗読を開始しました");
      processTtsQueue();
    }

    function processTtsQueue() {
      if (!isTtsActive || isSpeakingNow || ttsQueue.length === 0) return;
      const textToSpeak = ttsQueue.shift();
      isSpeakingNow = true;

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.0;

      utterance.onend = () => {
        isSpeakingNow = false;
        if (isTtsActive) processTtsQueue();
      };
      utterance.onerror = (e) => {
        log("Error", `読上げエラー: ${e.error}`);
        isSpeakingNow = false;
        if (isTtsActive) processTtsQueue();
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeaking() {
      isTtsActive = false;
      isSpeakingNow = false;
      ttsQueue = [];
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      const btn = document.getElementById('ttsBtn');
      if (btn) {
        btn.innerText = "🔊 最新から連続朗読";
        btn.style.background = "#00aaff";
      }
      log("TTS", "朗読を停止しました");
    }

    function clearTranscript() {
      stopSpeaking();
      fullTranscript = '';
      finalJapaneseText = '';
      renderEnglish();
      renderJapanese();
    }

    function clearLog() {
      const logBox = document.getElementById('logBox');
      if (logBox) logBox.innerText = '[Cleared]';
    }

    async function downloadTranscript() {
      if (!fullTranscript && !finalJapaneseText) return;
      const fileContent = `【英文講義テキスト (Whisper)】\n${fullTranscript}\n\n【日本語訳 (Gemini)】\n${finalJapaneseText}`;
      const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `lecture_transcript_${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
