<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム英語音声認識・講義アシスト (Web Speech API版 v7.0)</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #111;
      color: #00FF00;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      height: 100vh;
      gap: 20px;
    }
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .display-box {
      background-color: #000;
      border: 2px solid #00FF00;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }
    .section-title {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .content-area {
      color: #00FF00;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.5;
      overflow-y: auto;
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
      background: #050505;
      padding: 10px;
      border: 1px solid #222;
      border-radius: 4px;
    }
    .side-panel {
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #1a1a1a;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
      overflow-y: auto;
      color: #ccc;
      font-size: 12px;
    }
    h2 {
      color: #00FF00;
      font-size: 16px;
      margin: 0 0 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: #00FF00;
      color: #000;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }
    input, textarea, button, select {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      width: 100%;
    }
    button {
      background: #00aa00;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: none;
      padding: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background: #00dd00;
      color: #000;
    }
    button.stop-btn {
      background: #cc3333;
    }
    button.stop-btn:hover {
      background: #ff4444;
      color: #fff;
    }
    .status {
      font-size: 11px;
      color: #aaa;
      padding: 6px;
      background: #080808;
      border: 1px solid #222;
      border-radius: 4px;
    }
    .log-box {
      background: #000;
      border: 1px solid #333;
      color: #66ff66;
      font-family: monospace;
      font-size: 10px;
      height: 120px;
      overflow-y: auto;
      padding: 6px;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="display-box">
      <div class="section-title">【リアルタイム英語文字起こし (Web Speech API)】</div>
      <div id="transcriptDisplay" class="content-area">(音声認識を開始してください...)</div>
    </div>
  </div>

  <div class="side-panel">
    <h2>
      <span>英文認識アシスト</span>
      <span class="badge">v7.0 WebSpeech</span>
    </h2>

    <div>
      <label style="color:#00FF00; font-weight:bold;">音声認識 言語設定:</label>
      <select id="languageSelect">
        <option value="en-US" selected>英語 (米国 - en-US)</option>
        <option value="en-GB">英語 (英国 - en-GB)</option>
      </select>
    </div>

    <div style="display:flex; gap:8px;">
      <button id="startBtn" onclick="startRecognition()">🎤 認識開始</button>
      <button id="stopBtn" class="stop-btn" onclick="stopRecognition()" disabled>⏹ 停止</button>
    </div>

    <button onclick="clearTranscript()" style="background:#444;">🗑️ 表示表示のクリア</button>

    <div style="border-top:1px solid #333; margin:4px 0;"></div>

    <div style="font-weight:bold; color:#00FF00;">【動作ステータス】</div>
    <div id="status" class="status">待機中</div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
      <span style="font-weight:bold; color:#00FF00;">【詳細ログ・除外フィルタ結果】</span>
      <button onclick="clearLog()" style="padding:2px 6px; font-size:10px; background:#444; width:auto;">クリア</button>
    </div>
    <div id="logBox" class="log-box">[System initialized v7.0] Ready.</div>
  </div>

  <script>
    let recognition = null;
    let isRecognizing = false;
    let finalTranscript = '';

    // 非英語文字（日本語ひらがな・カタカナ・漢字・全角記号等）を完全に除去する正規表現フィルタ
    function cleanEnglishOnly(text) {
      if (!text) return '';
      
      // 1. 英数字、基本記号(ピリオド, カンマ, クエスチョン等), 半角スペース以外を排除
      let cleaned = text.replace(/[^a-zA-Z0-9\s.,?!'\"]/g, '');
      
      // 2. 連続する余分なスペースを1つに統合
      cleaned = cleaned.replace(/\s+/g, ' ').trim();
      
      return cleaned;
    }

    function log(tag, msg) {
      const timeStr = new Date().toLocaleTimeString();
      const logBox = document.getElementById('logBox');
      logBox.innerText = `[${timeStr}] [${tag}] ${msg}\n` + logBox.innerText;
      console.log(`[${tag}] ${msg}`);
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        setStatus("エラー: お使いのブラウザは Web Speech API に非対応です。(Chrome推奨)");
        log("Error", "SpeechRecognition API is not supported in this browser.");
        document.getElementById('startBtn').disabled = true;
        return false;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;       // 連続認識を有効化
      recognition.interimResults = true;   // 途中経過（確定前）も取得
      
      const selectedLang = document.getElementById('languageSelect').value;
      recognition.lang = selectedLang;

      recognition.onstart = () => {
        isRecognizing = true;
        setStatus("音声認識中... (マイクON)");
        log("System", "音声認識サービスが開始されました。");
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const rawText = event.results[i][0].transcript;
          
          // 非英語（日本語等）を完全除去・フィルタリング
          const filteredText = cleanEnglishOnly(rawText);

          if (!filteredText) {
            log("Filter", `非英語または雑音としてスキップ: "${rawText}"`);
            continue;
          }

          if (event.results[i].isFinal) {
            finalTranscript += filteredText + ' ';
            log("Final", filteredText);
          } else {
            interimTranscript += filteredText;
          }
        }

        // 画面描画更新
        const display = document.getElementById('transcriptDisplay');
        display.innerText = finalTranscript + (interimTranscript ? `\n(認識中...: ${interimTranscript})` : '');
        display.scrollTop = display.scrollHeight;
      };

      recognition.onerror = (event) => {
        log("Error", `認識エラーが発生しました: ${event.error}`);
        if (event.error === 'not-allowed') {
          setStatus("エラー: マイクの使用が許可されていません。");
        }
      };

      recognition.onend = () => {
        log("System", "音声認識セッションが終了しました。");
        // 自動再接続（認識が意図せず切れた場合もアクティブ状態なら自動再スタート）
        if (isRecognizing) {
          log("System", "自動再接続中...");
          try {
            recognition.start();
          } catch (e) {
            log("Error", `再接続失敗: ${e.message}`);
          }
        } else {
          setStatus("停止中");
          document.getElementById('startBtn').disabled = false;
          document.getElementById('stopBtn').disabled = true;
        }
      };

      return true;
    }

    function startRecognition() {
      if (!recognition && !initSpeechRecognition()) return;

      isRecognizing = true;
      try {
        const selectedLang = document.getElementById('languageSelect').value;
        recognition.lang = selectedLang;
        recognition.start();
      } catch (e) {
        log("Error", `開始エラー: ${e.message}`);
      }
    }

    function stopRecognition() {
      isRecognizing = false;
      if (recognition) {
        recognition.stop();
      }
      setStatus("停止処理中...");
    }

    function clearTranscript() {
      finalTranscript = '';
      document.getElementById('transcriptDisplay').innerText = '(音声認識を開始してください...)';
      log("System", "テキスト表示をクリアしました。");
    }

    function clearLog() {
      document.getElementById('logBox').innerText = '[Cleared]';
    }

    // 言語設定変更時に認識言語を更新
    document.getElementById('languageSelect').addEventListener('change', (e) => {
      if (recognition) {
        recognition.lang = e.target.value;
        log("Config", `言語設定を変更: ${e.target.value}`);
      }
    });

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      initSpeechRecognition();
    });
  </script>
</body>
</html>
