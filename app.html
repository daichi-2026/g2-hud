<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム英語認識・講義翻訳 (v12.4 Flash-3.6 Optimized)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #111;
      color: #00FF00;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 10px;
    }
    @media (min-width: 768px) {
      body { flex-direction: row; padding: 15px; gap: 15px; }
    }
    .main-container { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
    .display-box {
      background-color: #000;
      border: 2px solid #00FF00;
      border-radius: 8px;
      padding: 10px;
      display: flex; flex-direction: column; gap: 4px; flex: 1; overflow: hidden;
    }
    .display-box.japanese { border-color: #00FFFF; }
    .section-title { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .display-box.japanese .section-title { color: #00FFFF; }
    .content-area {
      color: #00FF00; font-size: 14px; font-weight: bold; line-height: 1.5;
      overflow-y: auto; flex: 1; white-space: pre-wrap; word-break: break-word;
      background: #050505; padding: 10px; border: 1px solid #222; border-radius: 4px;
    }
    .display-box.japanese .content-area { color: #FFFFFF; font-size: 14px; font-weight: normal; }
    .side-panel {
      width: 100%; display: flex; flex-direction: column; gap: 8px;
      background: #1a1a1a; padding: 10px; border-radius: 8px; border: 1px solid #333;
      overflow-y: auto; color: #ccc; font-size: 11px;
    }
    @media (min-width: 768px) {
      .side-panel { width: 340px; }
    }
    h2 { color: #00FF00; font-size: 14px; margin: 0 0 4px 0; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #00FF00; color: #000; font-size: 9px; padding: 2px 5px; border-radius: 8px; font-weight: bold; }
    input, select, button { background: #222; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; font-size: 12px; width: 100%; }
    button { background: #00aa00; color: #fff; font-weight: bold; cursor: pointer; border: none; padding: 10px; transition: background 0.2s; }
    button:hover { background: #00dd00; color: #000; }
    button.stop-btn { background: #cc3333; }
    button.stop-btn:hover { background: #ff4444; color: #fff; }
    .status { font-size: 10px; color: #aaa; padding: 5px; background: #080808; border: 1px solid #222; border-radius: 4px; }
    .log-box { background: #000; border: 1px solid #333; color: #66ff66; font-family: monospace; font-size: 9px; height: 80px; overflow-y: auto; padding: 5px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
    
    .meter-container { background: #000; border: 1px solid #333; height: 10px; border-radius: 5px; overflow: hidden; position: relative; }
    .meter-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00ff00 60%, #ffff00 85%, #ff0000 100%); transition: width 0.05s ease; }
    .metric-info { display: flex; justify-content: space-between; font-size: 9px; color: #888; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="display-box">
      <div class="section-title">【リアルタイム英語文字起こし (WHISPER API)】</div>
      <div id="transcriptDisplay" class="content-area">(マイク入力を開始してください...)</div>
    </div>
    <div class="display-box japanese">
      <div class="section-title">【自然な日本語訳 (GEMINI 文脈補正版)】</div>
      <div id="translationDisplay" class="content-area">(文章の一区切りごとに翻訳が表示されます...)</div>
    </div>
  </div>

  <div class="side-panel">
    <h2>
      <span>英語講義翻訳アシスト</span>
      <span class="badge">v12.4 Optimized</span>
    </h2>

    <div>
      <label style="color:#00FF00; font-weight:bold;">OpenAI API Key (Whisper用):</label>
      <input type="password" id="openaiKey" placeholder="sk-proj-...">
    </div>

    <div>
      <label style="color:#00FF00; font-weight:bold;">Gemini API Key (翻訳用):</label>
      <input type="password" id="geminiKey" placeholder="AIzaSy..." onchange="fetchAvailableModels()">
    </div>

    <div>
      <label style="color:#00FF00; font-weight:bold;">Gemini モデル選択 (自動取得):</label>
      <select id="modelSelect">
        <option value="">API Key入力後に自動読み込み...</option>
      </select>
    </div>

    <div style="background:#111; padding:6px; border-radius:6px; border:1px solid #222;">
      <div class="meter-container">
        <div id="meterBar" class="meter-bar"></div>
      </div>
      <div class="metric-info">
        <span>マイク感度（音量）</span>
        <span id="speechState" style="color:#00FFFF;">静寂</span>
      </div>
    </div>

    <div style="display:flex; gap:6px;">
      <button id="startBtn" onclick="startProcessing()">🎤 マイク音声認識を開始</button>
      <button id="stopBtn" class="stop-btn" onclick="stopProcessing()" disabled>⏹ 停止</button>
    </div>

    <div style="display:flex; gap:6px;">
      <button onclick="downloadTranscript()" style="background:#0088cc;">💾 TXT保存</button>
      <button onclick="clearTranscript()" style="background:#444;">🗑️ 表示クリア</button>
    </div>

    <div style="border-top:1px solid #333; margin:2px 0;"></div>

    <div style="font-weight:bold; color:#00FF00;">【動作ステータス】</div>
    <div id="status" class="status">待機中</div>

    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:bold; color:#00FF00;">【詳細ログ】</span>
      <button onclick="clearLog()" style="padding:2px 6px; font-size:9px; background:#444; width:auto;">クリア</button>
    </div>
    <div id="logBox" class="log-box">[System v12.4] Gemini 3.6 Flash thinking suppression and cleansing activated.</div>
  </div>

  <script>
    let isRunning = false;
    let audioStream = null;
    let audioContext = null;
    let analyser = null;
    let animFrameId = null;

    let mediaRecorder = null;
    let recordedChunks = [];
    let isSpeaking = false;
    let silenceStart = null;
    let speechStartTime = null;

    const SILENCE_THRESHOLD = 8;  
    const SILENCE_DURATION = 600; 
    const MAX_RECORD_TIME = 6000; 

    let fullTranscript = '';
    let finalJapaneseText = '';
    let englishBuffer = '';
    let recentEnglishHistory = [];

    window.addEventListener('DOMContentLoaded', () => {
      const savedOpenaiKey = localStorage.getItem('openai_api_key');
      if (savedOpenaiKey) document.getElementById('openaiKey').value = savedOpenaiKey;
      
      const savedGeminiKey = localStorage.getItem('gemini_api_key');
      if (savedGeminiKey) {
        document.getElementById('geminiKey').value = savedGeminiKey;
        fetchAvailableModels();
      }
    });

    function log(tag, msg) {
      const timeStr = new Date().toLocaleTimeString();
      const logBox = document.getElementById('logBox');
      if (logBox) logBox.innerText = `[${timeStr}] [${tag}] ${msg}\n` + logBox.innerText;
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    async function fetchAvailableModels() {
      const geminiKey = document.getElementById('geminiKey').value.trim();
      if (!geminiKey) return;

      const selectEl = document.getElementById('modelSelect');
      
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${geminiKey}`);
        if (!res.ok) {
          log("Error", "モデル一覧の取得に失敗しました。API Keyを確認してください。");
          return;
        }

        const data = await res.json();
        const generateModels = (data.models || [])
          .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
          .map(m => m.name.replace("models/", ""));

        if (generateModels.length > 0) {
          selectEl.innerHTML = ""; 
          let defaultSelected = false;

          generateModels.forEach(model => {
            const opt = document.createElement("option");
            opt.value = model;
            opt.textContent = model;
            
            if (model.includes("3.6") && !defaultSelected) {
              opt.selected = true;
              defaultSelected = true;
            }
            selectEl.appendChild(opt);
          });

          if (!defaultSelected) selectEl.selectedIndex = 0;
          log("System", `利用可能なGeminiモデル（${generateModels.length}件）を取得しました。`);
        }
      } catch (e) {
        log("Error", `モデル一覧取得エラー: ${e.message}`);
      }
    }

    async function startProcessing() {
      const openaiKey = document.getElementById('openaiKey').value.trim();
      const geminiKey = document.getElementById('geminiKey').value.trim();
      if (!openaiKey || !geminiKey) {
        alert("API Keyを入力してください。");
        return;
      }

      localStorage.setItem('openai_api_key', openaiKey);
      localStorage.setItem('gemini_api_key', geminiKey);

      const selectEl = document.getElementById('modelSelect');
      if (!selectEl.value || selectEl.value.includes("自動読み込み")) {
        await fetchAvailableModels();
      }

      try {
        const constraints = {
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: true
          }
        };

        audioStream = await navigator.mediaDevices.getUserMedia(constraints);
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(audioStream);
        
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        setStatus("マイク監視中 (音声を自動検知)");

        initRecorder();
        monitorAudio();

      } catch (e) {
        log("Error", `マイクアクセスエラー: ${e.message}`);
        alert("マイクの使用が許可されていません。");
      }
    }

    function initRecorder() {
      recordedChunks = [];
      let mimeType = 'audio/webm';
      if (!MediaRecorder.isTypeSupported('audio/webm')) {
        if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
        else mimeType = '';
      }

      const options = mimeType ? { mimeType } : {};
      mediaRecorder = new MediaRecorder(audioStream, options);
      
      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        if (recordedChunks.length > 0 && isRunning) {
          const audioBlob = new Blob(recordedChunks, { type: mimeType || 'audio/wav' });
          if (audioBlob.size > 2000) { 
            processWhisperChunk(audioBlob);
          }
        }
      };
    }

    function monitorAudio() {
      if (!analyser || !isRunning) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      const avgVolume = sum / dataArray.length;

      const meterBar = document.getElementById('meterBar');
      meterBar.style.width = Math.min(100, Math.round((avgVolume / 100) * 100)) + '%';

      const now = Date.now();

      if (avgVolume > SILENCE_THRESHOLD) {
        document.getElementById('speechState').innerText = "音声検知中...";
        document.getElementById('speechState').style.color = "#00FF00";
        silenceStart = null;

        if (!isSpeaking) {
          isSpeaking = true;
          speechStartTime = now;
          initRecorder();
          mediaRecorder.start();
          setStatus("録音中...");
        } else {
          if (now - speechStartTime > MAX_RECORD_TIME) {
            isSpeaking = false;
            if (mediaRecorder && mediaRecorder.state === "recording") {
              mediaRecorder.stop();
              setStatus("解析中...");
            }
          }
        }
      } else {
        document.getElementById('speechState').innerText = "静寂";
        document.getElementById('speechState').style.color = "#888";

        if (isSpeaking) {
          if (!silenceStart) silenceStart = now;

          if (now - silenceStart > SILENCE_DURATION) {
            isSpeaking = false;
            if (mediaRecorder && mediaRecorder.state === "recording") {
              mediaRecorder.stop();
              setStatus("解析中...");
            }
          }
        }
      }

      if (isRunning) animFrameId = requestAnimationFrame(monitorAudio);
    }

    async function processWhisperChunk(audioBlob) {
      const openaiKey = document.getElementById('openaiKey').value.trim();
      const formData = new FormData();
      formData.append("file", audioBlob, "audio.webm");
      formData.append("model", "whisper-1");
      formData.append("language", "en");
      formData.append("prompt", "This is a continuous English speech. Use proper punctuation like periods and commas.");

      try {
        const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${openaiKey}` },
          body: formData
        });

        if (!response.ok) return;

        const data = await response.json();
        let englishText = data.text ? data.text.trim() : '';

        const lower = englishText.toLowerCase();
        if (
          !englishText ||
          lower.includes("disclaimer") ||
          lower.includes("thanks for watching") ||
          lower.includes("subscribe") ||
          lower === "you" || lower === "you."
        ) {
          return;
        }

        fullTranscript += (fullTranscript ? ' ' : '') + englishText;
        englishBuffer += (englishBuffer ? ' ' : '') + englishText;
        renderEnglish();
        log("Whisper", englishText);

        const words = englishBuffer.split(/\s+/);
        const hasSentenceEnd = /[.?!]/.test(englishBuffer);

        if (hasSentenceEnd || words.length >= 15) {
          const textToTranslate = englishBuffer;
          englishBuffer = ''; 
          await translateWithGemini(textToTranslate);
        }

      } catch (e) {
        log("Error", `Whisper通信エラー: ${e.message}`);
      }
    }

    async function translateWithGemini(englishText) {
      const geminiKey = document.getElementById('geminiKey').value.trim();
      const selectedModel = document.getElementById('modelSelect').value || "gemini-3.6-flash";

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${geminiKey}`;

      const contextText = recentEnglishHistory.length > 0 
        ? `[Previous Context: ${recentEnglishHistory.join(' ')}]`
        : '';

      const requestBody = {
        systemInstruction: {
          parts: [{
            text: "Task: Simultaneous interpreter. Translate English speech to natural, continuous Japanese. Output ONLY the translated Japanese text. ABSOLUTE PROHIBITION: No thinking processes, no draft labels (e.g. Draft 1), no notes, no lecture style headers, no markdown stars (*), no explanations."
          }]
        },
        contents: [{
          parts: [{
            text: `${contextText}\nTranslate this English speech to Japanese:\n"${englishText}"`
          }]
        }],
        generationConfig: { 
          maxOutputTokens: 250
        }
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        if (response.ok) {
          const data = await response.json();
          let translatedText = (data.candidates?.[0]?.content?.parts?.[0]?.text || '').trim();
          
          // Gemini 3.6 Flash の思考ログ・メタ注釈（Draft x: や /Lecture style 等）のクレンジング
          translatedText = translatedText
            .replace(/^Draft\s*\d+:?/gi, '')          
            .replace(/\/.*?style.*$/gmi, '')           
            .replace(/^\*.*$/gm, '')                   
            .replace(/^#+.*$/gm, '')                   
            .replace(/^\d+\..*$/gm, '')                
            .replace(/^日本語訳[:：]?/g, '')
            .replace(/^["'「」]/g, '').replace(/["'「」]$/g, '')
            .trim();

          if (translatedText) {
            finalJapaneseText += (finalJapaneseText ? '\n' : '') + translatedText;
            renderJapanese();
            log("Gemini", translatedText);

            recentEnglishHistory.push(englishText);
            if (recentEnglishHistory.length > 2) recentEnglishHistory.shift();
          }
        } else {
          const err = await response.json();
          log("Error", `Gemini APIエラー: ${err.error?.message || response.statusText}`);
        }
      } catch (e) {
        log("Error", `Gemini通信エラー: ${e.message}`);
      }
    }

    function renderEnglish() {
      const el = document.getElementById('transcriptDisplay');
      el.innerText = fullTranscript;
      el.scrollTop = el.scrollHeight;
    }

    function renderJapanese() {
      const el = document.getElementById('translationDisplay');
      el.innerText = finalJapaneseText;
      el.scrollTop = el.scrollHeight;
    }

    function stopProcessing() {
      isRunning = false;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (audioContext) audioContext.close();
      if (audioStream) audioStream.getTracks().forEach(t => t.stop());

      if (englishBuffer.trim()) {
        translateWithGemini(englishBuffer);
        englishBuffer = '';
      }

      setStatus("停止中");
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function clearTranscript() {
      fullTranscript = '';
      finalJapaneseText = '';
      englishBuffer = '';
      recentEnglishHistory = [];
      renderEnglish();
      renderJapanese();
    }

    function clearLog() {
      document.getElementById('logBox').innerText = '[Cleared]';
    }

    function downloadTranscript() {
      const fileContent = `【英文】\n${fullTranscript}\n\n【和訳】\n${finalJapaneseText}`;
      const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `lecture_${Date.now()}.txt`;
      a.click();
    }
  </script>
</body>
</html>
