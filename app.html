<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム講義翻訳 (Deepgram版)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #6e6e73;
            display: block;
            margin-bottom: 4px;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .key-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .key-container input {
            flex: 1;
            margin-bottom: 0;
        }
        .key-container button {
            width: auto;
            white-space: nowrap;
            background-color: #86868b;
            margin-bottom: 0;
        }
        .saved-hint {
            font-size: 0.75rem;
            color: #34c759;
            margin-top: -8px;
            margin-bottom: 12px;
            display: none;
        }
        .tts-config {
            background: #f2f2f7;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .tts-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .tts-row label {
            margin-bottom: 0;
        }
        .range-container {
            display: flex;
            gap: 12px;
        }
        .range-item {
            flex: 1;
        }
        .range-item label {
            font-size: 0.75rem;
        }
        button.action-btn {
            background-color: #0071e3;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        button.action-btn.stop {
            background-color: #ff3b30;
        }
        #status {
            font-size: 0.9rem;
            font-weight: bold;
            color: #86868b;
            text-align: center;
            margin-bottom: 12px;
        }
        .speech-box {
            height: 180px;
            overflow-y: auto;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            padding: 12px;
            background: #fafafa;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .translated {
            color: #0071e3;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>リアルタイム講義翻訳 (Deepgram)</h2>
    
    <div class="card">
        <!-- Deepgram Key -->
        <label for="deepgramKey">Deepgram API Key</label>
        <div class="key-container">
            <input type="password" id="deepgramKey" placeholder="Deepgram API Key">
            <button id="clearDgKeyBtn" type="button">消去</button>
        </div>
        <div id="saveDgHint" class="saved-hint">✓ ブラウザに保存されています</div>

        <!-- Google Key -->
        <label for="googleKey">Google Translate API Key</label>
        <div class="key-container">
            <input type="password" id="googleKey" placeholder="Google Translate API Key">
            <button id="clearGkeyBtn" type="button">消去</button>
        </div>
        <div id="saveGHint" class="saved-hint">✓ ブラウザに保存されています</div>
        
        <label for="targetLang">翻訳先言語</label>
        <select id="targetLang">
            <option value="ja" selected>日本語 (Japanese)</option>
            <option value="en">英語 (English)</option>
        </select>

        <!-- 音声読み上げ（TTS）設定 -->
        <div class="tts-config">
            <div class="tts-row">
                <label for="ttsEnable">🎧 和訳の音声読み上げ</label>
                <input type="checkbox" id="ttsEnable" checked style="width: auto; margin-bottom: 0;">
            </div>
            <label for="ttsVoiceSelect" style="font-size:0.75rem;">読み上げ音声エンジン</label>
            <select id="ttsVoiceSelect" style="padding: 8px; font-size: 0.85rem; margin-bottom: 8px;"></select>
            
            <div class="range-container">
                <div class="range-item">
                    <label>速度: <span id="ttsRateVal">1.2</span>x</label>
                    <input type="range" id="ttsRate" min="0.8" max="2.0" step="0.1" value="1.2" oninput="document.getElementById('ttsRateVal').innerText = this.value">
                </div>
                <div class="range-item">
                    <label>ピッチ: <span id="ttsPitchVal">1.0</span></label>
                    <input type="range" id="ttsPitch" min="0.5" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('ttsPitchVal').innerText = this.value">
                </div>
            </div>
        </div>

        <button id="toggleBtn" class="action-btn">翻訳を開始する</button>
        <div id="status">停止中</div>
    </div>

    <div class="card">
        <label>認識された音声 (Deepgram 英文)</label>
        <div id="originalText" class="speech-box"></div>
    </div>

    <div class="card">
        <label>リアルタイム翻訳結果 (Google 和訳)</label>
        <div id="translatedText" class="speech-box translated"></div>
    </div>
</div>

<script>
    const STORAGE_DG_KEY = 'deepgram_api_key';
    const STORAGE_G_KEY = 'google_translate_api_key';

    let socket = null;
    let mediaRecorder = null;
    let audioStream = null;
    let isListening = false;
    let wakeLock = null;
    let availableJaVoices = [];

    const toggleBtn = document.getElementById('toggleBtn');
    const statusDiv = document.getElementById('status');
    const originalBox = document.getElementById('originalText');
    const translatedBox = document.getElementById('translatedText');

    const deepgramKeyInput = document.getElementById('deepgramKey');
    const googleKeyInput = document.getElementById('googleKey');
    const clearDgKeyBtn = document.getElementById('clearDgKeyBtn');
    const clearGkeyBtn = document.getElementById('clearGkeyBtn');
    const saveDgHint = document.getElementById('saveDgHint');
    const saveGHint = document.getElementById('saveGHint');

    const targetLangSelect = document.getElementById('targetLang');
    const ttsEnable = document.getElementById('ttsEnable');
    const ttsVoiceSelect = document.getElementById('ttsVoiceSelect');
    const ttsRate = document.getElementById('ttsRate');
    const ttsPitch = document.getElementById('ttsPitch');

    // 初期化：APIキー復元 & 音声エンジン取得
    window.addEventListener('DOMContentLoaded', () => {
        const savedDgKey = localStorage.getItem(STORAGE_DG_KEY);
        if (savedDgKey) {
            deepgramKeyInput.value = savedDgKey;
            saveDgHint.style.display = 'block';
        }
        const savedGKey = localStorage.getItem(STORAGE_G_KEY);
        if (savedGKey) {
            googleKeyInput.value = savedGKey;
            saveGHint.style.display = 'block';
        }
        initSpeechSynthesis();
    });

    // キー保存イベント
    deepgramKeyInput.addEventListener('input', () => {
        const val = deepgramKeyInput.value.trim();
        if (val) {
            localStorage.setItem(STORAGE_DG_KEY, val);
            saveDgHint.style.display = 'block';
        } else {
            localStorage.removeItem(STORAGE_DG_KEY);
            saveDgHint.style.display = 'none';
        }
    });
    googleKeyInput.addEventListener('input', () => {
        const val = googleKeyInput.value.trim();
        if (val) {
            localStorage.setItem(STORAGE_G_KEY, val);
            saveGHint.style.display = 'block';
        } else {
            localStorage.removeItem(STORAGE_G_KEY);
            saveGHint.style.display = 'none';
        }
    });

    clearDgKeyBtn.addEventListener('click', () => {
        deepgramKeyInput.value = '';
        localStorage.removeItem(STORAGE_DG_KEY);
        saveDgHint.style.display = 'none';
    });
    clearGkeyBtn.addEventListener('click', () => {
        googleKeyInput.value = '';
        localStorage.removeItem(STORAGE_G_KEY);
        saveGHint.style.display = 'none';
    });

    // TTS 初期化
    function initSpeechSynthesis() {
        if (!('speechSynthesis' in window)) return;

        function populateVoices() {
            const voices = window.speechSynthesis.getVoices();
            availableJaVoices = voices.filter(v => v.lang.startsWith('ja'));
            ttsVoiceSelect.innerHTML = '';

            if (availableJaVoices.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.innerText = "標準音声（自動選択）";
                ttsVoiceSelect.appendChild(opt);
                return;
            }

            availableJaVoices.forEach((voice, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = `${voice.name} (${voice.lang})`;
                ttsVoiceSelect.appendChild(opt);
            });
        }

        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }
    }

    // 和訳音声読み上げ
    function speakJapaneseText(text) {
        if (!ttsEnable.checked || !text || !('speechSynthesis' in window)) return;

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';

        const selectedIndex = parseInt(ttsVoiceSelect.value, 10);
        if (!isNaN(selectedIndex) && availableJaVoices[selectedIndex]) {
            utterance.voice = availableJaVoices[selectedIndex];
        }

        utterance.rate = parseFloat(ttsRate.value) || 1.2;
        utterance.pitch = parseFloat(ttsPitch.value) || 1.0;

        window.speechSynthesis.speak(utterance);
    }

    // トグルボタン処理
    toggleBtn.addEventListener('click', async () => {
        if (!isListening) {
            startTranslation();
        } else {
            stopTranslation();
        }
    });

    async function startTranslation() {
        const dgKey = deepgramKeyInput.value.trim();
        const gKey = googleKeyInput.value.trim();

        if (!dgKey || !gKey) {
            alert('Deepgram API Key と Google Translate API Key の両方を入力してください。');
            return;
        }

        try {
            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
            alert('マイクのアクセス許可が必要です。');
            return;
        }

        isListening = true;
        toggleBtn.textContent = '翻訳を停止する';
        toggleBtn.classList.add('stop');
        statusDiv.textContent = '接続中...';
        statusDiv.style.color = '#0071e3';

        requestWakeLock();

        // Deepgram WebSocket 接続 (Nova-2モデル / 英語)
        const dgUrl = `wss://api.deepgram.com/v1/listen?model=nova-2&language=en&punctuate=true&interim_results=false`;
        socket = new WebSocket(dgUrl, ['token', dgKey]);

        socket.onopen = () => {
            statusDiv.textContent = '音声認識中 (Deepgram)...';
            statusDiv.style.color = '#34c759';

            // マイク音声をストリーミング送信 (250ms単位)
            mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0 && socket.readyState === WebSocket.OPEN) {
                    socket.send(event.data);
                }
            };
            mediaRecorder.start(250);
        };

        socket.onmessage = async (message) => {
            const received = JSON.parse(message.data);
            const transcript = received.channel?.alternatives[0]?.transcript;

            if (transcript && transcript.trim().length > 0) {
                appendMessage(originalBox, transcript);
                const translated = await translateText(transcript);
                appendMessage(translatedBox, translated);
                speakJapaneseText(translated);
            }
        };

        socket.onerror = (error) => {
            console.error('Deepgram WebSocket Error:', error);
            statusDiv.textContent = 'エラーが発生しました';
            statusDiv.style.color = '#ff3b30';
        };

        socket.onclose = () => {
            if (isListening) {
                stopTranslation();
            }
        };
    }

    function stopTranslation() {
        isListening = false;
        toggleBtn.textContent = '翻訳を開始する';
        toggleBtn.classList.remove('stop');
        statusDiv.textContent = '停止中';
        statusDiv.style.color = '#86868b';

        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
        if (audioStream) {
            audioStream.getTracks().forEach(track => track.stop());
        }
        if (socket) {
            socket.close();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }

        releaseWakeLock();
    }

    // Google Translate API
    async function translateText(text) {
        const apiKey = googleKeyInput.value.trim();
        const targetLang = targetLangSelect.value;

        if (!apiKey) return '[APIキー未入力] ' + text;

        const url = `https://translation.googleapis.com/language/translate/v2?key=${apiKey}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ q: text, target: targetLang })
            });
            const data = await response.json();
            if (data.data && data.data.translations.length > 0) {
                return data.data.translations[0].translatedText;
            }
            return '[翻訳エラー]';
        } catch (error) {
            return '[通信エラー]';
        }
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {}
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
    }

    function appendMessage(element, text) {
        const p = document.createElement('p');
        p.style.margin = '0 0 8px 0';
        p.textContent = text;
        element.appendChild(p);
        element.scrollTop = element.scrollHeight;
    }
</script>

</body>
</html>
