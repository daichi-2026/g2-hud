<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム講義翻訳 (Deepgram版)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background-color: #f5f5f7; color: #1d1d1f; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #ffffff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .header-title { display: flex; align-items: center; justify-content: space-between; }
        .version-tag { background: #ff9500; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        label { font-size: 0.85rem; font-weight: bold; color: #6e6e73; display: block; margin-bottom: 4px; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .key-container { display: flex; gap: 8px; margin-bottom: 12px; }
        .key-container input { flex: 1; margin-bottom: 0; }
        .key-container button { width: auto; white-space: nowrap; background-color: #86868b; margin-bottom: 0; }
        .saved-hint { font-size: 0.75rem; color: #34c759; margin-top: -8px; margin-bottom: 12px; display: none; }
        .tts-config { background: #f2f2f7; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .tts-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .tts-row label { margin-bottom: 0; }
        .range-container { display: flex; gap: 12px; }
        .range-item { flex: 1; }
        .range-item label { font-size: 0.75rem; }
        button.action-btn { background-color: #0071e3; color: white; font-weight: bold; border: none; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        button.action-btn.stop { background-color: #ff3b30; }
        #status { font-size: 0.9rem; font-weight: bold; color: #86868b; text-align: center; margin-bottom: 12px; }
        .speech-box { height: 160px; overflow-y: auto; border: 1px solid #e5e5ea; border-radius: 8px; padding: 12px; background: #fafafa; font-size: 0.95rem; line-height: 1.5; }
        .translated { color: #0071e3; font-weight: 500; }
        .error-msg { color: #ff3b30; font-size: 0.85rem; text-align: center; margin-top: 4px; }
        .setting-group { display: flex; gap: 8px; }
        .setting-group > div { flex: 1; }

        .interim-text { color: #86868b; font-style: italic; }

        .debug-box { height: 140px; overflow-y: auto; background: #1c1c1e; color: #34c759; font-family: monospace; font-size: 0.75rem; padding: 8px; border-radius: 8px; }
        .volume-bar-bg { width: 100%; height: 8px; background: #e5e5ea; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
        .volume-bar-fill { height: 100%; width: 0%; background: #34c759; transition: width 0.1s ease; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h2>リアルタイム講義翻訳</h2>
        <span class="version-tag">v1.4 (Interim Ready)</span>
    </div>
    
    <div class="card">
        <label for="deepgramKey">Deepgram API Key</label>
        <div class="key-container">
            <input type="password" id="deepgramKey" placeholder="Deepgram API Key">
            <button id="clearDgKeyBtn" type="button">消去</button>
        </div>
        <div id="saveDgHint" class="saved-hint">✓ ブラウザに保存されています</div>

        <label for="googleKey">Google Translate API Key</label>
        <div class="key-container">
            <input type="password" id="googleKey" placeholder="Google Translate API Key">
            <button id="clearGkeyBtn" type="button">消去</button>
        </div>
        <div id="saveGHint" class="saved-hint">✓ ブラウザに保存されています</div>
        
        <div class="setting-group">
            <div>
                <label for="sourceLang">話し手の言語 (音声入力)</label>
                <select id="sourceLang">
                    <option value="en" selected>英語 (English)</option>
                    <option value="ja">日本語 (Japanese)</option>
                </select>
            </div>
            <div>
                <label for="targetLang">翻訳先の言語</label>
                <select id="targetLang">
                    <option value="ja" selected>日本語 (Japanese)</option>
                    <option value="en">英語 (English)</option>
                </select>
            </div>
        </div>

        <div class="tts-config">
            <div class="tts-row">
                <label for="ttsEnable">🎧 翻訳音声の読み上げ</label>
                <input type="checkbox" id="ttsEnable" checked style="width: auto; margin-bottom: 0;">
            </div>
            <label for="ttsVoiceSelect" style="font-size:0.75rem;">読み上げ音声エンジン</label>
            <select id="ttsVoiceSelect" style="padding: 8px; font-size: 0.85rem; margin-bottom: 8px;"></select>
            
            <div class="range-container">
                <div class="range-item">
                    <label>速度: <span id="ttsRateVal">1.2</span>x</label>
                    <input type="range" id="ttsRate" min="0.8" max="2.0" step="0.1" value="1.2" oninput="document.getElementById('ttsRateVal').innerText = this.value">
                </div>
                <div class="range-item">
                    <label>ピッチ: <span id="ttsPitchVal">1.0</span></label>
                    <input type="range" id="ttsPitch" min="0.5" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('ttsPitchVal').innerText = this.value">
                </div>
            </div>
        </div>

        <label>マイク入力音量</label>
        <div class="volume-bar-bg">
            <div id="volumeFill" class="volume-bar-fill"></div>
        </div>

        <button id="toggleBtn" class="action-btn">翻訳を開始する</button>
        <div id="status">停止中</div>
        <div id="errorLog" class="error-msg"></div>
    </div>

    <div class="card">
        <label>認識された音声 (Deepgram 原文)</label>
        <div id="originalText" class="speech-box"></div>
    </div>

    <div class="card">
        <label>リアルタイム翻訳結果 (Google 翻訳)</label>
        <div id="translatedText" class="speech-box translated"></div>
    </div>

    <div class="card">
        <label>システム・通信ログ (Debug Log)</label>
        <div id="debugLog" class="debug-box"></div>
    </div>
</div>

<script>
    const STORAGE_DG_KEY = 'deepgram_api_key';
    const STORAGE_G_KEY = 'google_translate_api_key';

    let socket = null;
    let mediaStream = null;
    let mediaRecorder = null;
    let audioContext = null;
    let analyser = null;
    let animFrameId = null;
    let keepAliveTimer = null;
    let isListening = false;
    let wakeLock = null;
    let availableVoices = [];

    // 途中経過（確定前）の表示要素
    let interimOriginalElem = null;

    const toggleBtn = document.getElementById('toggleBtn');
    const statusDiv = document.getElementById('status');
    const errorLog = document.getElementById('errorLog');
    const debugLog = document.getElementById('debugLog');
    const volumeFill = document.getElementById('volumeFill');
    const originalBox = document.getElementById('originalText');
    const translatedBox = document.getElementById('translatedText');

    const deepgramKeyInput = document.getElementById('deepgramKey');
    const googleKeyInput = document.getElementById('googleKey');
    const clearDgKeyBtn = document.getElementById('clearDgKeyBtn');
    const clearGkeyBtn = document.getElementById('clearGkeyBtn');
    const saveDgHint = document.getElementById('saveDgHint');
    const saveGHint = document.getElementById('saveGHint');

    const sourceLangSelect = document.getElementById('sourceLang');
    const targetLangSelect = document.getElementById('targetLang');
    const ttsEnable = document.getElementById('ttsEnable');
    const ttsVoiceSelect = document.getElementById('ttsVoiceSelect');
    const ttsRate = document.getElementById('ttsRate');
    const ttsPitch = document.getElementById('ttsPitch');

    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const p = document.createElement('div');
        p.textContent = `[${time}] ${msg}`;
        if (type === 'error') p.style.color = '#ff453a';
        if (type === 'warn') p.style.color = '#ffd60a';
        debugLog.appendChild(p);
        debugLog.scrollTop = debugLog.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', () => {
        log("システム初期化完了 (v1.4 - Stream Ready)");
        const savedDgKey = localStorage.getItem(STORAGE_DG_KEY);
        if (savedDgKey) {
            deepgramKeyInput.value = savedDgKey;
            saveDgHint.style.display = 'block';
        }
        const savedGKey = localStorage.getItem(STORAGE_G_KEY);
        if (savedGKey) {
            googleKeyInput.value = savedGKey;
            saveGHint.style.display = 'block';
        }
        initSpeechSynthesis();
    });

    deepgramKeyInput.addEventListener('input', () => {
        const val = deepgramKeyInput.value.trim().replace(/\s+/g, '');
        if (val) {
            localStorage.setItem(STORAGE_DG_KEY, val);
            saveDgHint.style.display = 'block';
        } else {
            localStorage.removeItem(STORAGE_DG_KEY);
            saveDgHint.style.display = 'none';
        }
    });

    googleKeyInput.addEventListener('input', () => {
        const val = googleKeyInput.value.trim().replace(/\s+/g, '');
        if (val) {
            localStorage.setItem(STORAGE_G_KEY, val);
            saveGHint.style.display = 'block';
        } else {
            localStorage.removeItem(STORAGE_G_KEY);
            saveGHint.style.display = 'none';
        }
    });

    clearDgKeyBtn.addEventListener('click', () => {
        deepgramKeyInput.value = '';
        localStorage.removeItem(STORAGE_DG_KEY);
        saveDgHint.style.display = 'none';
    });

    clearGkeyBtn.addEventListener('click', () => {
        googleKeyInput.value = '';
        localStorage.removeItem(STORAGE_G_KEY);
        saveGHint.style.display = 'none';
    });

    function initSpeechSynthesis() {
        if (!('speechSynthesis' in window)) return;

        function populateVoices() {
            availableVoices = window.speechSynthesis.getVoices();
            ttsVoiceSelect.innerHTML = '';

            const targetLang = targetLangSelect.value;
            const filteredVoices = availableVoices.filter(v => v.lang.startsWith(targetLang));

            if (filteredVoices.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.innerText = "標準音声（自動選択）";
                ttsVoiceSelect.appendChild(opt);
                return;
            }

            filteredVoices.forEach((voice) => {
                const opt = document.createElement('option');
                opt.value = voice.name;
                opt.innerText = `${voice.name} (${voice.lang})`;
                ttsVoiceSelect.appendChild(opt);
            });
        }

        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }
        targetLangSelect.addEventListener('change', populateVoices);
    }

    function speakText(text) {
        if (!ttsEnable.checked || !text || !('speechSynthesis' in window)) return;

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const targetLang = targetLangSelect.value;
        utterance.lang = targetLang === 'ja' ? 'ja-JP' : 'en-US';

        const selectedVoiceName = ttsVoiceSelect.value;
        if (selectedVoiceName) {
            const voiceObj = availableVoices.find(v => v.name === selectedVoiceName);
            if (voiceObj) utterance.voice = voiceObj;
        }

        utterance.rate = parseFloat(ttsRate.value) || 1.2;
        utterance.pitch = parseFloat(ttsPitch.value) || 1.0;

        window.speechSynthesis.speak(utterance);
    }

    toggleBtn.addEventListener('click', async () => {
        if (!isListening) {
            startTranslation();
        } else {
            stopTranslation();
        }
    });

    async function startTranslation() {
        errorLog.textContent = '';
        const dgKey = deepgramKeyInput.value.trim().replace(/\s+/g, '');
        const gKey = googleKeyInput.value.trim().replace(/\s+/g, '');

        if (!dgKey || !gKey) {
            alert('Deepgram API Key と Google Translate API Key の両方を入力してください。');
            return;
        }

        log("マイク接続要求中...");
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });
            log("マイクアクセスの許可を取得しました");
            startVolumeMonitor(mediaStream);
        } catch (e) {
            log("マイクエラー: " + e.message, 'error');
            errorLog.textContent = 'マイクのアクセスが拒否されました。';
            return;
        }

        isListening = true;
        toggleBtn.textContent = '翻訳を停止する';
        toggleBtn.classList.add('stop');
        statusDiv.textContent = 'Deepgramへ接続中...';
        statusDiv.style.color = '#0071e3';

        requestWakeLock();

        const srcLang = sourceLangSelect.value;
        const model = srcLang === 'ja' ? 'general' : 'nova-2';
        
        // パラメータを最新仕様に最適化 (endpointing, utterance_end_ms)
        const dgUrl = `wss://api.deepgram.com/v1/listen?model=${model}&language=${srcLang}&punctuate=true&smart_formatting=true&interim_results=true&endpointing=300&utterance_end_ms=1000`;
        
        log(`Deepgram接続要求: lang=${srcLang}, model=${model}`);

        try {
            socket = new WebSocket(dgUrl, ['token', dgKey]);
        } catch(e) {
            log("WebSocket作成失敗: " + e.message, 'error');
            stopTranslation();
            return;
        }

        socket.onopen = () => {
            log("WebSocket接続成功 (OPEN)");
            statusDiv.textContent = '音声認識中 (Deepgram)...';
            statusDiv.style.color = '#34c759';

            keepAliveTimer = setInterval(() => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: "KeepAlive" }));
                }
            }, 5000);

            startAudioRecording(mediaStream);
        };

        socket.onmessage = async (message) => {
            try {
                const received = JSON.parse(message.data);
                
                if (received.type === 'Error') {
                    log(`Deepgramエラー: ${received.message}`, 'error');
                    return;
                }

                const transcript = received.channel?.alternatives[0]?.transcript;
                const isFinal = received.is_final;

                if (transcript && transcript.length > 0) {
                    if (isFinal) {
                        // 確定テキストの表示と翻訳
                        log(`[確定原文]: "${transcript}"`);
                        removeInterimText();
                        appendMessage(originalBox, transcript);
                        
                        log(`Google翻訳実行中...`);
                        const translated = await translateText(transcript);
                        log(`[確定翻訳]: "${translated}"`);
                        appendMessage(translatedBox, translated);
                        speakText(translated);
                    } else {
                        // 話している最中の途中テキスト（リアルタイム表示）
                        updateInterimText(transcript);
                    }
                }
            } catch (e) {
                log("レスポンス解釈エラー: " + e.message, 'warn');
            }
        };

        socket.onerror = (error) => {
            log("WebSocketエラーが発生しました", 'error');
            errorLog.textContent = '接続エラーが発生しました。';
        };

        socket.onclose = (event) => {
            log(`接続切断: Code=${event.code}, Reason="${event.reason}"`, 'warn');
            if (isListening) {
                errorLog.textContent = `接続が切断されました (Code: ${event.code})`;
                stopTranslation();
            }
        };
    }

    function startVolumeMonitor(stream) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 256;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function updateVolume() {
            if (!isListening) return;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let average = sum / dataArray.length;
            let val = Math.min(100, Math.floor((average / 128) * 100));
            volumeFill.style.width = val + '%';
            animFrameId = requestAnimationFrame(updateVolume);
        }
        updateVolume();
    }

    function startAudioRecording(stream) {
        let options = {};
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
            options = { mimeType: 'audio/webm;codecs=opus' };
        } else if (MediaRecorder.isTypeSupported('audio/webm')) {
            options = { mimeType: 'audio/webm' };
        }

        log(`MediaRecorder使用フォーマット: ${options.mimeType || 'Default'}`);

        mediaRecorder = new MediaRecorder(stream, options);

        let count = 0;
        mediaRecorder.addEventListener('dataavailable', (event) => {
            if (event.data.size > 0 && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(event.data);
                count++;
                if (count % 20 === 0) {
                    log(`音声パケット送信継続中 (${count}個完了)`);
                }
            }
        });

        // 250ms刻みでリアルタイム送信
        mediaRecorder.start(250);
    }

    function updateInterimText(text) {
        if (!interimOriginalElem) {
            interimOriginalElem = document.createElement('p');
            interimOriginalElem.className = 'interim-text';
            interimOriginalElem.style.margin = '0 0 8px 0';
            originalBox.appendChild(interimOriginalElem);
        }
        interimOriginalElem.textContent = '... ' + text;
        originalBox.scrollTop = originalBox.scrollHeight;
    }

    function removeInterimText() {
        if (interimOriginalElem) {
            originalBox.removeChild(interimOriginalElem);
            interimOriginalElem = null;
        }
    }

    function stopTranslation() {
        isListening = false;
        toggleBtn.textContent = '翻訳を開始する';
        toggleBtn.classList.remove('stop');
        statusDiv.textContent = '停止中';
        statusDiv.style.color = '#86868b';
        volumeFill.style.width = '0%';

        removeInterimText();

        if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
        if (animFrameId) { cancelAnimationFrame(animFrameId); }
        if (audioContext) { audioContext.close(); audioContext = null; }

        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            mediaRecorder = null;
        }

        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }

        if (socket) {
            try { socket.close(); } catch(e){}
            socket = null;
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }

        releaseWakeLock();
        log("正常停止しました");
    }

    async function translateText(text) {
        const apiKey = googleKeyInput.value.trim().replace(/\s+/g, '');
        const targetLang = targetLangSelect.value;

        if (!apiKey) return '[APIキー未入力] ' + text;

        const url = `https://translation.googleapis.com/language/translate/v2?key=${apiKey}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ q: text, target: targetLang })
            });
            const data = await response.json();
            if (data.data && data.data.translations.length > 0) {
                return data.data.translations[0].translatedText;
            }
            log("Google APIエラー: " + JSON.stringify(data), 'error');
            return '[翻訳エラー]';
        } catch (error) {
            log("Google 通信エラー: " + error.message, 'error');
            return '[通信エラー]';
        }
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {}
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
    }

    function appendMessage(element, text) {
        const p = document.createElement('p');
        p.style.margin = '0 0 8px 0';
        p.textContent = text;
        element.appendChild(p);
        element.scrollTop = element.scrollHeight;
    }
</script>

</body>
</html>
