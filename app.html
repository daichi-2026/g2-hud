<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム英語認識・講義翻訳 (v14.8 Debug Output)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #111;
      color: #00FF00;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 10px;
    }
    @media (min-width: 768px) {
      body { flex-direction: row; padding: 15px; gap: 15px; }
    }
    .main-container { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
    .display-box {
      background-color: #000;
      border: 2px solid #00FF00;
      border-radius: 8px;
      padding: 10px;
      display: flex; flex-direction: column; gap: 4px; flex: 1; overflow: hidden;
    }
    .display-box.japanese { border-color: #00FFFF; }
    .display-box.gemini { border-color: #0088FF; }
    
    .section-title { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .display-box.japanese .section-title { color: #00FFFF; }
    .display-box.gemini .section-title { color: #0088FF; }
    
    .content-area {
      color: #00FF00; font-size: 13px; font-weight: bold; line-height: 1.5;
      overflow-y: auto; flex: 1; white-space: pre-wrap; word-break: break-word;
      background: #050505; padding: 10px; border: 1px solid #222; border-radius: 4px;
    }
    .display-box.japanese .content-area { color: #FFFFFF; font-size: 13px; font-weight: normal; }
    .display-box.gemini .content-area { color: #88CCFF; font-size: 13px; font-weight: normal; }

    .side-panel {
      width: 100%; display: flex; flex-direction: column; gap: 8px;
      background: #1a1a1a; padding: 10px; border-radius: 8px; border: 1px solid #333;
      overflow-y: auto; color: #ccc; font-size: 11px;
    }
    @media (min-width: 768px) {
      .side-panel { width: 340px; }
    }
    h2 { color: #00FF00; font-size: 14px; margin: 0 0 4px 0; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #ff9900; color: #000; font-size: 9px; padding: 2px 5px; border-radius: 8px; font-weight: bold; }
    input, button { background: #222; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; font-size: 12px; width: 100%; }
    button { background: #00aa00; color: #fff; font-weight: bold; cursor: pointer; border: none; padding: 10px; transition: background 0.2s; }
    button:hover { background: #00dd00; color: #000; }
    button.stop-btn { background: #cc3333; }
    button.stop-btn:hover { background: #ff4444; color: #fff; }
    button.gemini-btn { background: #0066cc; }
    button.gemini-btn:hover { background: #0088ff; }
    
    .status { font-size: 10px; color: #aaa; padding: 5px; background: #080808; border: 1px solid #222; border-radius: 4px; }
    .log-box { background: #000; border: 1px solid #333; color: #66ff66; font-family: monospace; font-size: 9px; height: 120px; overflow-y: auto; padding: 5px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
    
    .meter-container { background: #000; border: 1px solid #333; height: 10px; border-radius: 5px; overflow: hidden; position: relative; }
    .meter-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00ff00 60%, #ffff00 85%, #ff0000 100%); transition: width 0.05s ease; }
    .metric-info { display: flex; justify-content: space-between; font-size: 9px; color: #888; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="display-box">
      <div class="section-title">【リアルタイム英語文字起こし (WHISPER API)】</div>
      <div id="transcriptDisplay" class="content-area">(マイク入力を開始してください...)</div>
    </div>
    <div class="display-box japanese">
      <div class="section-title">【正確な日本語訳 (GOOGLE TRANSLATION API)】</div>
      <div id="translationDisplay" class="content-area">(文章の一区切りごとに高精度の翻訳が表示されます...)</div>
    </div>
    <div class="display-box gemini">
      <div class="section-title">【自動文脈要約・意訳・背景解説 (GEMINI API)】</div>
      <div id="geminiDisplay" class="content-area">(音声認識の進行に伴い、自動的に文脈解析結果が更新されます...)</div>
    </div>
  </div>

  <div class="side-panel">
    <h2>
      <span>英語講義翻訳アシスト</span>
      <span class="badge">v14.8 Verbose</span>
    </h2>

    <div>
      <label style="color:#00FF00; font-weight:bold;">OpenAI API Key (Whisper用):</label>
      <input type="password" id="openaiKey" placeholder="sk-proj-...">
    </div>

    <div>
      <label style="color:#00FF00; font-weight:bold;">Google Cloud API Key (翻訳用):</label>
      <input type="password" id="googleTranslateKey" placeholder="AIzaSy...">
    </div>

    <div>
      <label style="color:#0088FF; font-weight:bold;">Gemini API Key (Google AI Studio用):</label>
      <input type="password" id="geminiKey" placeholder="AIzaSy...">
    </div>

    <div style="background:#111; padding:6px; border-radius:6px; border:1px solid #222;">
      <div class="meter-container">
        <div id="meterBar" class="meter-bar"></div>
      </div>
      <div class="metric-info">
        <span>マイク感度（音量）</span>
        <span id="speechState" style="color:#00FFFF;">静寂</span>
      </div>
    </div>

    <div style="display:flex; gap:6px;">
      <button id="startBtn" onclick="startProcessing()">🎤 マイク音声認識を開始</button>
      <button id="stopBtn" class="stop-btn" onclick="stopProcessing()" disabled>⏹ 停止</button>
    </div>

    <button onclick="analyzeWithGemini(true)" class="gemini-btn">⚡ 今すぐ手動でGemini要約を実行</button>

    <div style="display:flex; gap:6px;">
      <button onclick="downloadTranscript()" style="background:#0088cc;">💾 TXT保存</button>
      <button onclick="clearTranscript()" style="background:#444;">🗑️ 表示クリア</button>
    </div>

    <div style="border-top:1px solid #333; margin:2px 0;"></div>

    <div style="font-weight:bold; color:#00FF00;">【動作ステータス】</div>
    <div id="status" class="status">待機中</div>

    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:bold; color:#00FF00;">【詳細ログ（エラーデバッグ強化）】</span>
      <button onclick="clearLog()" style="padding:2px 6px; font-size:9px; background:#444; width:auto;">クリア</button>
    </div>
    <div id="logBox" class="log-box">[System v14.8] Verbose error logging active.</div>
  </div>

  <script>
    let isRunning = false;
    let audioStream = null;
    let audioContext = null;
    let analyser = null;
    let animFrameId = null;

    let mediaRecorder = null;
    let recordedChunks = [];
    let isSpeaking = false;
    let silenceStart = null;
    let speechStartTime = null;

    const SILENCE_THRESHOLD = 8;  
    const SILENCE_DURATION = 600; 
    const MAX_RECORD_TIME = 6000; 

    let fullTranscript = '';
    let finalJapaneseText = '';
    let englishBuffer = '';
    let geminiSummaryText = '';

    let lastGeminiLength = 0;
    let isGeminiAnalyzing = false;

    window.addEventListener('DOMContentLoaded', () => {
      const savedOpenaiKey = localStorage.getItem('openai_api_key');
      if (savedOpenaiKey) document.getElementById('openaiKey').value = savedOpenaiKey;
      
      const savedGoogleKey = localStorage.getItem('google_translate_api_key');
      if (savedGoogleKey) document.getElementById('googleTranslateKey').value = savedGoogleKey;

      const savedGeminiKey = localStorage.getItem('gemini_api_key');
      if (savedGeminiKey) document.getElementById('geminiKey').value = savedGeminiKey;
    });

    function log(tag, msg) {
      const timeStr = new Date().toLocaleTimeString();
      const logBox = document.getElementById('logBox');
      if (logBox) logBox.innerText = `[${timeStr}] [${tag}] ${msg}\n` + logBox.innerText;
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    async function startProcessing() {
      const openaiKey = document.getElementById('openaiKey').value.trim();
      const googleKey = document.getElementById('googleTranslateKey').value.trim();
      
      if (!openaiKey || !googleKey) {
        alert("OpenAI API Key と Google Cloud API Key の両方を入力してください。");
        return;
      }

      localStorage.setItem('openai_api_key', openaiKey);
      localStorage.setItem('google_translate_api_key', googleKey);
      
      const geminiKey = document.getElementById('geminiKey').value.trim();
      if (geminiKey) localStorage.setItem('gemini_api_key', geminiKey);

      try {
        const constraints = {
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
        };

        audioStream = await navigator.mediaDevices.getUserMedia(constraints);
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(audioStream);
        
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        setStatus("マイク監視中 (音声を自動検知)");

        initRecorder();
        monitorAudio();

      } catch (e) {
        log("Error", `マイクアクセスエラー: ${e.message}`);
        alert("マイクの使用が許可されていません。");
      }
    }

    function initRecorder() {
      recordedChunks = [];
      let mimeType = 'audio/webm';
      if (!MediaRecorder.isTypeSupported('audio/webm')) {
        if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
        else mimeType = '';
      }

      const options = mimeType ? { mimeType } : {};
      mediaRecorder = new MediaRecorder(audioStream, options);
      
      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        if (recordedChunks.length > 0 && isRunning) {
          const audioBlob = new Blob(recordedChunks, { type: mimeType || 'audio/wav' });
          if (audioBlob.size > 2000) { 
            processWhisperChunk(audioBlob);
          }
        }
      };
    }

    function monitorAudio() {
      if (!analyser || !isRunning) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      const avgVolume = sum / dataArray.length;

      const meterBar = document.getElementById('meterBar');
      meterBar.style.width = Math.min(100, Math.round((avgVolume / 100) * 100)) + '%';

      const now = Date.now();

      if (avgVolume > SILENCE_THRESHOLD) {
        document.getElementById('speechState').innerText = "音声検知中...";
        document.getElementById('speechState').style.color = "#00FF00";
        silenceStart = null;

        if (!isSpeaking) {
          isSpeaking = true;
          speechStartTime = now;
          initRecorder();
          mediaRecorder.start();
          setStatus("録音中...");
        } else {
          if (now - speechStartTime > MAX_RECORD_TIME) {
            isSpeaking = false;
            if (mediaRecorder && mediaRecorder.state === "recording") {
              mediaRecorder.stop();
              setStatus("解析中...");
            }
          }
        }
      } else {
        document.getElementById('speechState').innerText = "静寂";
        document.getElementById('speechState').style.color = "#888";

        if (isSpeaking) {
          if (!silenceStart) silenceStart = now;

          if (now - silenceStart > SILENCE_DURATION) {
            isSpeaking = false;
            if (mediaRecorder && mediaRecorder.state === "recording") {
              mediaRecorder.stop();
              setStatus("解析中...");
            }
          }
        }
      }

      if (isRunning) animFrameId = requestAnimationFrame(monitorAudio);
    }

    async function processWhisperChunk(audioBlob) {
      const openaiKey = document.getElementById('openaiKey').value.trim();
      const formData = new FormData();
      formData.append("file", audioBlob, "audio.webm");
      formData.append("model", "whisper-1");
      formData.append("language", "en");

      try {
        const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${openaiKey}` },
          body: formData
        });

        if (!response.ok) return;

        const data = await response.json();
        let englishText = data.text ? data.text.trim() : '';

        const lower = englishText.toLowerCase();
        if (
          !englishText ||
          lower.includes("disclaimer") ||
          lower.includes("thanks for watching") ||
          lower.includes("subscribe") ||
          lower === "you" || lower === "you."
        ) {
          return;
        }

        fullTranscript += (fullTranscript ? ' ' : '') + englishText;
        englishBuffer += (englishBuffer ? ' ' : '') + englishText;
        renderEnglish();
        log("Whisper", englishText);

        const words = englishBuffer.split(/\s+/);
        const hasSentenceEnd = /[.?!]/.test(englishBuffer);

        if (hasSentenceEnd || words.length >= 12) {
          const textToTranslate = englishBuffer;
          englishBuffer = ''; 
          await translateWithGoogleCloud(textToTranslate);
        }

      } catch (e) {
        log("Error", `Whisper通信エラー: ${e.message}`);
      }
    }

    async function translateWithGoogleCloud(englishText) {
      const googleKey = document.getElementById('googleTranslateKey').value.trim();
      const url = `https://translation.googleapis.com/language/translate/v2?key=${googleKey}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            q: englishText,
            source: 'en',
            target: 'ja',
            format: 'text'
          })
        });

        if (response.ok) {
          const data = await response.json();
          const translatedText = data.data?.translations?.[0]?.translatedText || '';

          if (translatedText) {
            const parser = new DOMParser();
            const decodedText = parser.parseFromString(translatedText, 'text/html').body.textContent;

            finalJapaneseText += (finalJapaneseText ? '\n' : '') + decodedText;
            renderJapanese();
            log("GoogleTrans", decodedText);

            if (finalJapaneseText.length - lastGeminiLength > 150) {
              analyzeWithGemini(false);
            }
          }
        } else {
          const err = await response.json();
          log("Error", `Google Translate APIエラー: ${err.error?.message || response.statusText}`);
        }
      } catch (e) {
        log("Error", `Google Translate通信エラー: ${e.message}`);
      }
    }

    // ★Gemini API 呼び出し（詳細デバッグログ出力版）
    async function analyzeWithGemini(isManual = false) {
      const geminiKey = document.getElementById('geminiKey').value.trim();
      if (!geminiKey) {
        if (isManual) alert("Gemini API Key を入力してください。");
        return;
      }
      if (!fullTranscript.trim()) {
        if (isManual) alert("解析対象の英文テキストがありません。");
        return;
      }
      if (isGeminiAnalyzing) return;

      isGeminiAnalyzing = true;
      lastGeminiLength = finalJapaneseText.length;

      const geminiDisplay = document.getElementById('geminiDisplay');
      if (isManual || !geminiSummaryText) {
        geminiDisplay.innerText = "【Geminiが文脈・オチ・ニュアンスを解析中...】";
      }
      log("Gemini", `要約送信中... (${isManual ? '手動' : '自動'})`);

      const promptText = `
以下の【英語原文】と【機械直訳】を総合的に分析し、直訳では分かりにくい文脈、一人芝居・ジョーク・比喩表現・話者の意図を補正した上で、わかりやすい日本語で出力してください。

1. 【全体要約】（箇条書き2〜3点）
2. 【文脈を踏まえたスムーズな意訳】（自然な流れの日本語）
3. 【補足・ニュアンス解説】（ジョークや比喩の補足）

【英語原文】
${fullTranscript}

【機械直訳】
${finalJapaneseText}
`;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: promptText }]
            }]
          })
        });

        const rawText = await response.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch (pErr) {
          data = null;
        }

        if (response.ok && data) {
          const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          if (resultText) {
            geminiSummaryText = resultText;
            renderGemini();
            log("Gemini Success", "gemini-1.5-flash より応答取得成功");
          } else {
            const warningMsg = `API応答200ですが本文が空です: ${rawText}`;
            log("Gemini Warn", warningMsg);
            geminiDisplay.innerText = warningMsg;
          }
        } else {
          // 詳細エラー情報の完全吐き出し
          const errStatus = response.status;
          const errCode = data?.error?.code || 'N/A';
          const errStatusText = data?.error?.status || 'N/A';
          const errMsg = data?.error?.message || rawText || '不明なエラー';

          const fullErrLog = `[HTTP ${errStatus}] Status: ${errStatusText} (Code: ${errCode})\nMessage: ${errMsg}`;
          
          log("Gemini ERROR", fullErrLog);
          geminiDisplay.innerText = `【Gemini API エラー詳細】\n${fullErrLog}`;
        }

      } catch (e) {
        const fetchErr = `通信例外エラー: ${e.name} - ${e.message}`;
        log("Gemini Fatal", fetchErr);
        geminiDisplay.innerText = `【通信エラー】\n${fetchErr}`;
      } finally {
        isGeminiAnalyzing = false;
      }
    }

    function renderEnglish() {
      const el = document.getElementById('transcriptDisplay');
      el.innerText = fullTranscript;
      el.scrollTop = el.scrollHeight;
    }

    function renderJapanese() {
      const el = document.getElementById('translationDisplay');
      el.innerText = finalJapaneseText;
      el.scrollTop = el.scrollHeight;
    }

    function renderGemini() {
      const el = document.getElementById('geminiDisplay');
      el.innerText = geminiSummaryText;
      el.scrollTop = el.scrollHeight;
    }

    function stopProcessing() {
      isRunning = false;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (audioContext) audioContext.close();
      if (audioStream) audioStream.getTracks().forEach(t => t.stop());

      if (englishBuffer.trim()) {
        translateWithGoogleCloud(englishBuffer);
        englishBuffer = '';
      }

      if (fullTranscript.trim()) {
        analyzeWithGemini(false);
      }

      setStatus("停止中");
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function clearTranscript() {
      fullTranscript = '';
      finalJapaneseText = '';
      englishBuffer = '';
      geminiSummaryText = '';
      lastGeminiLength = 0;
      renderEnglish();
      renderJapanese();
      renderGemini();
    }

    function clearLog() {
      document.getElementById('logBox').innerText = '[Cleared]';
    }

    function downloadTranscript() {
      const fileContent = `【英文】\n${fullTranscript}\n\n【和訳】\n${finalJapaneseText}\n\n【Gemini要約】\n${geminiSummaryText}`;
      const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `lecture_${Date.now()}.txt`;
      a.click();
    }
  </script>
</body>
</html>
