<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム講義翻訳</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #6e6e73;
            display: block;
            margin-bottom: 4px;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .key-container {
            display: flex;
            gap: 8px;
        }
        .key-container input {
            flex: 1;
            margin-bottom: 0;
        }
        .key-container button {
            width: auto;
            white-space: nowrap;
            background-color: #86868b;
            margin-bottom: 0;
        }
        .saved-hint {
            font-size: 0.75rem;
            color: #34c759;
            margin-top: 4px;
            margin-bottom: 12px;
            display: none;
        }
        .tts-config {
            background: #f2f2f7;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .tts-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .tts-row label {
            margin-bottom: 0;
        }
        .range-container {
            display: flex;
            gap: 12px;
        }
        .range-item {
            flex: 1;
        }
        .range-item label {
            font-size: 0.75rem;
        }
        button.action-btn {
            background-color: #0071e3;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        button.action-btn.stop {
            background-color: #ff3b30;
        }
        #status {
            font-size: 0.9rem;
            font-weight: bold;
            color: #86868b;
            text-align: center;
            margin-bottom: 12px;
        }
        .speech-box {
            height: 180px;
            overflow-y: auto;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            padding: 12px;
            background: #fafafa;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .translated {
            color: #0071e3;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>リアルタイム講義翻訳</h2>
    
    <div class="card">
        <label for="apiKey">Google Translate API Key</label>
        <div class="key-container">
            <input type="password" id="apiKey" placeholder="APIキーを入力">
            <button id="clearKeyBtn" type="button">消去</button>
        </div>
        <div id="saveHint" class="saved-hint">✓ ブラウザに保存されています</div>
        
        <label for="targetLang">翻訳先言語</label>
        <select id="targetLang">
            <option value="ja" selected>日本語 (Japanese)</option>
            <option value="en">英語 (English)</option>
        </select>

        <!-- 音声読み上げ（TTS）設定 -->
        <div class="tts-config">
            <div class="tts-row">
                <label for="ttsEnable">🎧 和訳の音声読み上げ</label>
                <input type="checkbox" id="ttsEnable" checked style="width: auto; margin-bottom: 0;">
            </div>
            <label for="ttsVoiceSelect" style="font-size:0.75rem;">読み上げ音声エンジン</label>
            <select id="ttsVoiceSelect" style="padding: 8px; font-size: 0.85rem; margin-bottom: 8px;"></select>
            
            <div class="range-container">
                <div class="range-item">
                    <label>速度: <span id="ttsRateVal">1.2</span>x</label>
                    <input type="range" id="ttsRate" min="0.8" max="2.0" step="0.1" value="1.2" oninput="document.getElementById('ttsRateVal').innerText = this.value">
                </div>
                <div class="range-item">
                    <label>ピッチ: <span id="ttsPitchVal">1.0</span></label>
                    <input type="range" id="ttsPitch" min="0.5" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('ttsPitchVal').innerText = this.value">
                </div>
            </div>
        </div>

        <button id="toggleBtn" class="action-btn">翻訳を開始する</button>
        <div id="status">停止中</div>
    </div>

    <div class="card">
        <label>認識された音声 (原文)</label>
        <div id="originalText" class="speech-box"></div>
    </div>

    <div class="card">
        <label>リアルタイム翻訳結果</label>
        <div id="translatedText" class="speech-box translated"></div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'google_translate_api_key';

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;
    let wakeLock = null;
    let availableJaVoices = [];

    const toggleBtn = document.getElementById('toggleBtn');
    const statusDiv = document.getElementById('status');
    const originalBox = document.getElementById('originalText');
    const translatedBox = document.getElementById('translatedText');
    const apiKeyInput = document.getElementById('apiKey');
    const clearKeyBtn = document.getElementById('clearKeyBtn');
    const saveHint = document.getElementById('saveHint');
    const targetLangSelect = document.getElementById('targetLang');
    const ttsEnable = document.getElementById('ttsEnable');
    const ttsVoiceSelect = document.getElementById('ttsVoiceSelect');
    const ttsRate = document.getElementById('ttsRate');
    const ttsPitch = document.getElementById('ttsPitch');

    // 初期化：APIキー復元 & 音声エンジン取得
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem(STORAGE_KEY);
        if (savedKey) {
            apiKeyInput.value = savedKey;
            saveHint.style.display = 'block';
        }
        initSpeechSynthesis();
    });

    apiKeyInput.addEventListener('input', () => {
        const key = apiKeyInput.value.trim();
        if (key) {
            localStorage.setItem(STORAGE_KEY, key);
            saveHint.style.display = 'block';
        } else {
            localStorage.removeItem(STORAGE_KEY);
            saveHint.style.display = 'none';
        }
    });

    clearKeyBtn.addEventListener('click', () => {
        apiKeyInput.value = '';
        localStorage.removeItem(STORAGE_KEY);
        saveHint.style.display = 'none';
    });

    // Web Speech API (音声読み上げ) 初期化
    function initSpeechSynthesis() {
        if (!('speechSynthesis' in window)) return;

        function populateVoices() {
            const voices = window.speechSynthesis.getVoices();
            availableJaVoices = voices.filter(v => v.lang.startsWith('ja'));
            ttsVoiceSelect.innerHTML = '';

            if (availableJaVoices.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.innerText = "標準音声（自動選択）";
                ttsVoiceSelect.appendChild(opt);
                return;
            }

            availableJaVoices.forEach((voice, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = `${voice.name} (${voice.lang})`;
                ttsVoiceSelect.appendChild(opt);
            });
        }

        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }
    }

    // 和訳音声読み上げ実行関数
    function speakJapaneseText(text) {
        if (!ttsEnable.checked || !text || !('speechSynthesis' in window)) return;

        window.speechSynthesis.cancel(); // 割り込み再生のため直前の音声を停止

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';

        const selectedIndex = parseInt(ttsVoiceSelect.value, 10);
        if (!isNaN(selectedIndex) && availableJaVoices[selectedIndex]) {
            utterance.voice = availableJaVoices[selectedIndex];
        }

        utterance.rate = parseFloat(ttsRate.value) || 1.2;
        utterance.pitch = parseFloat(ttsPitch.value) || 1.0;

        window.speechSynthesis.speak(utterance);
    }

    if (!SpeechRecognition) {
        alert('お使いのブラウザはWeb Speech APIに対応していません。スマホ版Chromeをご利用ください。');
    } else {
        initRecognition();
    }

    function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            statusDiv.textContent = '音声認識中...';
            statusDiv.style.color = '#34c759';
        };

        recognition.onresult = async (event) => {
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }

            if (finalTranscript) {
                appendMessage(originalBox, finalTranscript);
                const translated = await translateText(finalTranscript);
                appendMessage(translatedBox, translated);
                
                // 翻訳完了と同時にイヤホン/スピーカーから音声再生
                speakJapaneseText(translated);
            }
        };

        recognition.onend = () => {
            if (isListening) {
                recognition.start();
            } else {
                statusDiv.textContent = '停止中';
                statusDiv.style.color = '#86868b';
            }
        };

        recognition.onerror = (event) => {
            if (event.error === 'no-speech' && isListening) return;
        };
    }

    toggleBtn.addEventListener('click', async () => {
        if (!isListening) {
            startTranslation();
        } else {
            stopTranslation();
        }
    });

    async function startTranslation() {
        isListening = true;
        toggleBtn.textContent = '翻訳を停止する';
        toggleBtn.classList.add('stop');
        requestWakeLock();
        try { recognition.start(); } catch (e) {}
    }

    function stopTranslation() {
        isListening = false;
        toggleBtn.textContent = '翻訳を開始する';
        toggleBtn.classList.remove('stop');
        if (recognition) recognition.stop();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        releaseWakeLock();
    }

    async function translateText(text) {
        const apiKey = apiKeyInput.value.trim();
        const targetLang = targetLangSelect.value;

        if (!apiKey) return '[APIキー未入力] ' + text;

        const url = `https://translation.googleapis.com/language/translate/v2?key=${apiKey}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ q: text, target: targetLang })
            });
            const data = await response.json();
            if (data.data && data.data.translations.length > 0) {
                return data.data.translations[0].translatedText;
            }
            return '[翻訳エラー]';
        } catch (error) {
            return '[通信エラー]';
        }
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {}
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
    }

    function appendMessage(element, text) {
        const p = document.createElement('p');
        p.style.margin = '0 0 8px 0';
        p.textContent = text;
        element.appendChild(p);
        element.scrollTop = element.scrollHeight;
    }
</script>

</body>
</html>
