<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム英語認識・講義翻訳 (v9.0 超高速ストリーム版)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #111;
      color: #00FF00;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      height: 100vh;
      gap: 15px;
    }
    .main-container { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .display-box {
      background-color: #000;
      border: 2px solid #00FF00;
      border-radius: 8px;
      padding: 12px;
      display: flex; flex-direction: column; gap: 6px; flex: 1; overflow: hidden;
    }
    .display-box.japanese { border-color: #00FFFF; }
    .section-title { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .display-box.japanese .section-title { color: #00FFFF; }
    .content-area {
      color: #00FF00; font-size: 15px; font-weight: bold; line-height: 1.5;
      overflow-y: auto; flex: 1; white-space: pre-wrap; word-break: break-word;
      background: #050505; padding: 10px; border: 1px solid #222; border-radius: 4px;
    }
    .display-box.japanese .content-area { color: #FFFFFF; }
    .interim-text { color: #888888; font-style: italic; display: block; margin-top: 4px; }
    .side-panel {
      width: 360px; display: flex; flex-direction: column; gap: 10px;
      background: #1a1a1a; padding: 12px; border-radius: 8px; border: 1px solid #333;
      overflow-y: auto; color: #ccc; font-size: 12px;
    }
    h2 { color: #00FF00; font-size: 15px; margin: 0 0 6px 0; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #00FF00; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
    input, select, button { background: #222; border: 1px solid #444; color: #fff; padding: 7px; border-radius: 4px; font-size: 12px; width: 100%; }
    button { background: #00aa00; color: #fff; font-weight: bold; cursor: pointer; border: none; padding: 9px; transition: background 0.2s; }
    button:hover { background: #00dd00; color: #000; }
    button.stop-btn { background: #cc3333; }
    button.stop-btn:hover { background: #ff4444; color: #fff; }
    .status { font-size: 11px; color: #aaa; padding: 6px; background: #080808; border: 1px solid #222; border-radius: 4px; }
    .log-box { background: #000; border: 1px solid #333; color: #66ff66; font-family: monospace; font-size: 10px; height: 100px; overflow-y: auto; padding: 6px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="display-box">
      <div class="section-title">【リアルタイム英語文字起こし (WEB SPEECH API)】</div>
      <div id="transcriptDisplay" class="content-area">(音声認識を開始してください...)</div>
    </div>
    <div class="display-box japanese">
      <div class="section-title">【リアルタイム日本語訳 (GEMINI AI 超高速即時訳)】</div>
      <div id="translationDisplay" class="content-area">(翻訳結果がここに表示されます...)</div>
    </div>
  </div>

  <div class="side-panel">
    <h2>
      <span>英語講義翻訳アシスト</span>
      <span class="badge">v9.0</span>
    </h2>

    <div>
      <label style="color:#00FF00; font-weight:bold;">Gemini API Key (Google AI Studio):</label>
      <input type="password" id="apiKey" placeholder="AIzaSy...">
    </div>

    <div>
      <label style="color:#00FF00; font-weight:bold;">Gemini モデル指定:</label>
      <input type="text" id="modelInput" value="gemini-3.6-flash" placeholder="gemini-3.6-flash">
    </div>

    <div>
      <label style="color:#00FF00; font-weight:bold;">音声認識 言語設定:</label>
      <select id="languageSelect">
        <option value="en-US" selected>英語 (米国 - en-US)</option>
        <option value="en-GB">英語 (英国 - en-GB)</option>
      </select>
    </div>

    <div style="display:flex; gap:8px;">
      <button id="startBtn" onclick="startRecognition()">🎤 認識開始</button>
      <button id="stopBtn" class="stop-btn" onclick="stopRecognition()" disabled>⏹ 停止</button>
    </div>

    <div style="display:flex; gap:8px;">
      <button id="ttsBtn" onclick="toggleContinuousTTS()" style="background:#00aaff; color:#000;">🔊 最新から連続朗読</button>
      <button onclick="stopSpeaking()" style="background:#882222; width:40%;">⏹ 読上停止</button>
    </div>

    <div style="display:flex; gap:8px;">
      <button onclick="downloadTranscript()" style="background:#0088cc;">💾 TXT保存</button>
      <button onclick="clearTranscript()" style="background:#444;">🗑️ 表示クリア</button>
    </div>

    <div style="border-top:1px solid #333; margin:2px 0;"></div>

    <div style="font-weight:bold; color:#00FF00;">【動作ステータス】</div>
    <div id="status" class="status">待機中</div>

    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:bold; color:#00FF00;">【詳細ログ】</span>
      <button onclick="clearLog()" style="padding:2px 6px; font-size:10px; background:#444; width:auto;">クリア</button>
    </div>
    <div id="logBox" class="log-box">[System v9.0] Ultra Fast Stream Engine Ready.</div>
  </div>

  <script>
    let recognition = null;
    let isRecognizing = false;
    let finalEnglishText = '';
    let finalJapaneseText = '';

    let ttsQueue = [];
    let isTtsActive = false;
    let isSpeakingNow = false;

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('apiKey').value = savedKey;

      const savedModel = localStorage.getItem('gemini_model_name');
      if (savedModel) document.getElementById('modelInput').value = savedModel;

      initSpeechRecognition();
    });

    document.getElementById('apiKey').addEventListener('change', (e) => {
      localStorage.setItem('gemini_api_key', e.target.value.trim());
    });

    document.getElementById('modelInput').addEventListener('change', (e) => {
      localStorage.setItem('gemini_model_name', e.target.value.trim());
    });

    function cleanEnglishOnly(text) {
      if (!text) return '';
      let cleaned = text.replace(/[^a-zA-Z0-9\s.,?!'\"]/g, '');
      return cleaned.replace(/\s+/g, ' ').trim();
    }

    function log(tag, msg) {
      const timeStr = new Date().toLocaleTimeString();
      const logBox = document.getElementById('logBox');
      if (logBox) {
        logBox.innerText = `[${timeStr}] [${tag}] ${msg}\n` + logBox.innerText;
      }
    }

    function setStatus(msg) {
      const statusEl = document.getElementById('status');
      if (statusEl) statusEl.innerText = msg;
    }

    // 確定した1文ごとに即時非同期リクエストを送る
    async function translateChunkImmediately(englishChunk) {
      const apiKey = document.getElementById('apiKey').value.trim();
      let modelName = document.getElementById('modelInput').value.trim() || 'gemini-3.6-flash';
      
      if (!apiKey || !englishChunk.trim()) return;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

      const requestData = {
        systemInstruction: {
          parts: [{ text: "You are an instant live translator. Translate the given English spoken sentence into natural Japanese. Output ONLY the Japanese translation. Absolutely no English, no thoughts, no typos notes, and no markdown." }]
        },
        contents: [{
          parts: [{ text: englishChunk }]
        }],
        generationConfig: {
          temperature: 0.0,
          maxOutputTokens: 200
        }
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestData)
        });

        if (response.ok) {
          const data = await response.json();
          let translatedText = (data.candidates?.[0]?.content?.parts?.[0]?.text || '').trim();
          translatedText = translatedText.replace(/^[`"'\s]+|[`"'\s]+$/g, '');

          if (translatedText) {
            finalJapaneseText += translatedText + '\n';
            renderJapanese();

            if (isTtsActive) {
              ttsQueue.push(translatedText);
              processTtsQueue();
            }
          }
        } else {
          const errData = await response.json();
          log("Gemini Error", errData.error?.message || response.statusText);
        }
      } catch (e) {
        log("Error", `API通信エラー: ${e.message}`);
      }
    }

    function renderJapanese() {
      const jaDisplay = document.getElementById('translationDisplay');
      if (jaDisplay) {
        jaDisplay.innerHTML = finalJapaneseText || '(翻訳結果がここに表示されます...)';
        jaDisplay.scrollTop = jaDisplay.scrollHeight;
      }
    }

    function toggleContinuousTTS() {
      if (isTtsActive) stopSpeaking();
      else startContinuousTTS();
    }

    function startContinuousTTS() {
      if (!('speechSynthesis' in window)) return;
      isTtsActive = true;
      ttsQueue = [];
      const lines = finalJapaneseText.trim().split('\n').filter(l => l.trim().length > 0);
      if (lines.length > 0) ttsQueue.push(lines[lines.length - 1]);

      const btn = document.getElementById('ttsBtn');
      if (btn) {
        btn.innerText = "🔊 連続朗読中 (タップで停止)";
        btn.style.background = "#ff9900";
      }
      log("TTS", "リアルタイム連続朗読を開始しました");
      processTtsQueue();
    }

    function processTtsQueue() {
      if (!isTtsActive || isSpeakingNow || ttsQueue.length === 0) return;
      const textToSpeak = ttsQueue.shift();
      isSpeakingNow = true;

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.0;

      utterance.onend = () => {
        isSpeakingNow = false;
        if (isTtsActive) processTtsQueue();
      };
      utterance.onerror = (e) => {
        log("Error", `読上げエラー: ${e.error}`);
        isSpeakingNow = false;
        if (isTtsActive) processTtsQueue();
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeaking() {
      isTtsActive = false;
      isSpeakingNow = false;
      ttsQueue = [];
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      const btn = document.getElementById('ttsBtn');
      if (btn) {
        btn.innerText = "🔊 最新から連続朗読";
        btn.style.background = "#00aaff";
      }
      log("TTS", "朗読を停止しました");
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        setStatus("エラー: ブラウザがWeb Speech API非対応です");
        return false;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = document.getElementById('languageSelect').value;

      recognition.onstart = () => {
        isRecognizing = true;
        setStatus("音声認識中... (マイクON)");
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        log("System", "音声認識を開始しました");
      };

      recognition.onresult = (event) => {
        let currentInterimEn = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const rawText = event.results[i][0].transcript;
          const filteredText = cleanEnglishOnly(rawText);
          if (!filteredText) continue;

          if (event.results[i].isFinal) {
            finalEnglishText += filteredText + '. ';
            
            // 確定文を即時・非同期でGeminiへ送信
            translateChunkImmediately(filteredText);
          } else {
            currentInterimEn += filteredText;
          }
        }

        const enDisplay = document.getElementById('transcriptDisplay');
        if (enDisplay) {
          enDisplay.innerHTML = finalEnglishText + (currentInterimEn ? `<span class="interim-text">${currentInterimEn}</span>` : '');
          enDisplay.scrollTop = enDisplay.scrollHeight;
        }
      };

      recognition.onerror = (e) => log("Error", `認識エラー: ${e.error}`);

      recognition.onend = () => {
        if (isRecognizing) {
          try { recognition.start(); } catch (e) {}
        } else {
          setStatus("停止中");
          document.getElementById('startBtn').disabled = false;
          document.getElementById('stopBtn').disabled = true;
          log("System", "音声認識を停止しました");
        }
      };
      return true;
    }

    function startRecognition() {
      if (!recognition) {
        if (!initSpeechRecognition()) return;
      }
      isRecognizing = true;
      recognition.lang = document.getElementById('languageSelect').value;
      try {
        recognition.start();
      } catch (e) {
        log("Error", `開始エラー: ${e.message}`);
      }
    }

    function stopRecognition() {
      isRecognizing = false;
      if (recognition) recognition.stop();
      stopSpeaking();
      setStatus("停止処理中...");
    }

    function clearTranscript() {
      stopSpeaking();
      finalEnglishText = '';
      finalJapaneseText = '';
      document.getElementById('transcriptDisplay').innerText = '(音声認識を開始してください...)';
      document.getElementById('translationDisplay').innerText = '(翻訳結果がここに表示されます...)';
    }

    function clearLog() {
      const logBox = document.getElementById('logBox');
      if (logBox) logBox.innerText = '[Cleared]';
    }

    async function downloadTranscript() {
      if (!finalEnglishText && !finalJapaneseText) return;
      const fileContent = `【英文講義テキスト】\n${finalEnglishText}\n\n【日本語訳】\n${finalJapaneseText}`;
      const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `lecture_transcript_${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
