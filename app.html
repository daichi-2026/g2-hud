<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>英語講義翻訳アシスト v14.0 (Cloud Trans + Gemini)</title>
  <style>
    body {
      background-color: #121212;
      color: #00ff66;
      font-family: 'Consolas', 'Courier New', monospace, sans-serif;
      margin: 15px;
    }
    .header-title {
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .version-tag {
      background-color: #008000;
      color: #fff;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .main-container {
      display: flex;
      gap: 15px;
    }
    .left-panel {
      flex: 2;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .box {
      border: 1px solid #00ff66;
      border-radius: 5px;
      padding: 10px;
      background-color: #050505;
      display: flex;
      flex-direction: column;
    }
    .box-title {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 5px;
    }
    textarea {
      width: 100%;
      background-color: transparent;
      border: none;
      color: #00ff66;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
    }
    .gemini-box {
      border-color: #00aaff;
    }
    .gemini-box textarea {
      color: #00d9ff;
    }
    .gemini-box .box-title {
      color: #00aaff;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 8px;
    }
    label {
      font-size: 0.8rem;
      color: #aaa;
    }
    input[type="password"], input[type="text"] {
      background-color: #000;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }
    .btn-start { background-color: #28a745; color: white; }
    .btn-stop { background-color: #dc3545; color: white; }
    .btn-gemini { background-color: #007bff; color: white; }
    .btn-action { background-color: #17a2b8; color: white; }
    .btn-clear { background-color: #6c757d; color: white; }
    .log-box {
      background-color: #000;
      border: 1px solid #333;
      height: 120px;
      overflow-y: scroll;
      font-size: 0.75rem;
      color: #aaa;
      padding: 5px;
    }
  </style>
</head>
<body>

  <div class="header-title">
    英語講義翻訳アシスト
    <span class="version-tag">v14.0 Cloud Trans + Gemini</span>
  </div>

  <div class="main-container">
    <div class="left-panel">
      <div class="box">
        <div class="box-title">【リアルタイム英語音声認識 (WHISPER API)】</div>
        <textarea id="whisperText" rows="6" placeholder="音声認識結果がここに表示されます..."></textarea>
      </div>

      <div class="box">
        <div class="box-title">【正確な日本語直訳 (GOOGLE TRANSLATION API)】</div>
        <textarea id="googleText" rows="6" placeholder="リアルタイム直訳結果がここに表示されます..."></textarea>
      </div>

      <div class="box gemini-box">
        <div class="box-title">【文脈要約・意訳・背景解説 (GEMINI API)】</div>
        <textarea id="geminiText" rows="8" placeholder="「Geminiで文脈要約を実行」を押すと、原文と直訳を総合解析した結果が表示されます..."></textarea>
      </div>
    </div>

    <div class="right-panel">
      <div class="input-group">
        <label>OpenAI API Key (Whisper用):</label>
        <input type="password" id="openaiKey" placeholder="sk-...">
      </div>
      <div class="input-group">
        <label>Google Cloud API Key (翻訳用):</label>
        <input type="password" id="googleKey" placeholder="AIzaSy...">
      </div>
      <div class="input-group">
        <label>Gemini API Key (要約用):</label>
        <input type="password" id="geminiKey" placeholder="AIzaSy...">
      </div>

      <button id="startBtn" class="btn-start" onclick="startRecognition()">🎤 マイク音声認識を開始</button>
      <button id="stopBtn" class="btn-stop" onclick="stopRecognition()" disabled>■ 停止</button>
      
      <hr style="border-color: #333; width: 100%; margin: 10px 0;">

      <button class="btn-gemini" onclick="analyzeWithGemini()">✨ Geminiで文脈要約を実行</button>

      <div style="display: flex; gap: 5px; margin-top: 5px;">
        <button class="btn-action" style="flex: 1;" onclick="saveTxt()">💾 TXT保存</button>
        <button class="btn-clear" style="flex: 1;" onclick="clearAll()">🗑 表示クリア</button>
      </div>

      <div style="margin-top: 15px;">
        <div class="box-title">【動作ステータス】</div>
        <div id="statusText" style="color: #fff; font-size: 0.85rem;">停止中</div>
      </div>

      <div style="margin-top: 10px;">
        <div class="box-title">【詳細ログ】</div>
        <div id="logBox" class="log-box"></div>
      </div>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    function addLog(msg) {
      const logBox = document.getElementById('logBox');
      const time = new Date().toLocaleTimeString();
      logBox.innerHTML += `[${time}] ${msg}<br>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // 音声認識の開始・停止処理（概要ロジック）
    async function startRecognition() {
      const openaiKey = document.getElementById('openaiKey').value;
      if (!openaiKey) {
        alert('OpenAI API Keyを入力してください。');
        return;
      }
      isRecording = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('statusText').innerText = '録音・音声認識中...';
      addLog('音声認識を開始しました。');
      
      // Web Audio / MediaRecorder 処理の起点
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.start(3000); // 3秒ごとにチャンク処理
        addLog('マイク入力を検知中...');
      }).catch(err => {
        addLog('マイクエラー: ' + err.message);
        stopRecognition();
      });
    }

    function stopRecognition() {
      isRecording = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('statusText').innerText = '停止中';
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      addLog('音声認識を停止しました。');
    }

    // Google Cloud Translation API 呼び出し（直訳）
    async function translateText(text) {
      const googleKey = document.getElementById('googleKey').value;
      if (!googleKey || !text.trim()) return;

      const url = `https://translation.googleapis.com/language/translate/v2?key=${googleKey}`;
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ q: text, target: 'ja', format: 'text' })
        });
        const data = await res.json();
        if (data.data && data.data.translations) {
          const translated = data.data.translations[0].translatedText;
          document.getElementById('googleText').value += translated + '\n';
          addLog('Google Translation 成功');
        }
      } catch (e) {
        addLog('Google Translation エラー: ' + e.message);
      }
    }

    // ★新規機能：Gemini APIによる文脈解析・要約
    async function analyzeWithGemini() {
      const geminiKey = document.getElementById('geminiKey').value;
      const englishText = document.getElementById('whisperText').value;
      const googleText = document.getElementById('googleText').value;

      if (!geminiKey) {
        alert('Gemini API Keyを入力してください。');
        return;
      }
      if (!englishText.trim()) {
        alert('解析対象の英文テキストがありません。');
        return;
      }

      const geminiArea = document.getElementById('geminiText');
      geminiArea.value = '【Geminiが文脈・比喩・オチを解析中...】';
      addLog('Gemini APIへ文脈解析リクエスト送信...');

      // 原文＋直訳をセットで渡すプロンプト構成
      const prompt = `
以下の【英語原文】と【機械直訳】を総合的に分析し、直訳では掴みにくい文脈、一人芝居・ジョーク・比喩表現・話者の意図を補正した上で、以下のフォーマットで出力してください。

1. 【全体要約】（箇条書きで2〜3点）
2. 【文脈を考慮した自然な意訳】（話の流れがわかるスムーズな日本語）
3. 【補足・ニュアンス解説】（ジョークや比喩、専門用語の解説があれば）

【英語原文】
${englishText}

【機械直訳】
${googleText}
`;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`;

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await res.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          geminiArea.value = data.candidates[0].content.parts[0].text;
          addLog('Gemini文脈要約 完了');
        } else {
          geminiArea.value = '解析結果の取得に失敗しました。';
          addLog('Gemini API 応答エラー');
        }
      } catch (e) {
        geminiArea.value = '通信エラーが発生しました: ' + e.message;
        addLog('Gemini API 通信エラー: ' + e.message);
      }
    }

    // 表示クリア
    function clearAll() {
      document.getElementById('whisperText').value = '';
      document.getElementById('googleText').value = '';
      document.getElementById('geminiText').value = '';
      document.getElementById('logBox').innerHTML = '';
      addLog('表示をクリアしました。');
    }

    // テキストファイル保存
    function saveTxt() {
      const text = `=== 英語原文 (Whisper) ===\n${document.getElementById('whisperText').value}\n\n` +
                   `=== 直訳 (Google Translate) ===\n${document.getElementById('googleText').value}\n\n` +
                   `=== 文脈要約 (Gemini) ===\n${document.getElementById('geminiText').value}`;
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `lecture_translation_${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
    }
  </script>
</body>
</html>
