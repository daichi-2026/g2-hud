<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム英語認識・講義翻訳 (v7.2 読上げ機能付き)</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #111;
      color: #00FF00;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      height: 100vh;
      gap: 15px;
    }
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .display-box {
      background-color: #000;
      border: 2px solid #00FF00;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow: hidden;
    }
    .display-box.japanese {
      border-color: #00FFFF;
    }
    .section-title {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .display-box.japanese .section-title {
      color: #00FFFF;
    }
    .content-area {
      color: #00FF00;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.5;
      overflow-y: auto;
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
      background: #050505;
      padding: 10px;
      border: 1px solid #222;
      border-radius: 4px;
    }
    .display-box.japanese .content-area {
      color: #FFFFFF;
    }
    .side-panel {
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #1a1a1a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      overflow-y: auto;
      color: #ccc;
      font-size: 12px;
    }
    h2 {
      color: #00FF00;
      font-size: 15px;
      margin: 0 0 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: #00FF00;
      color: #000;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }
    input, textarea, button, select {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 7px;
      border-radius: 4px;
      font-size: 12px;
      width: 100%;
    }
    button {
      background: #00aa00;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: none;
      padding: 9px;
      transition: background 0.2s;
    }
    button:hover {
      background: #00dd00;
      color: #000;
    }
    button.stop-btn {
      background: #cc3333;
    }
    button.stop-btn:hover {
      background: #ff4444;
      color: #fff;
    }
    .status {
      font-size: 11px;
      color: #aaa;
      padding: 6px;
      background: #080808;
      border: 1px solid #222;
      border-radius: 4px;
    }
    .log-box {
      background: #000;
      border: 1px solid #333;
      color: #66ff66;
      font-family: monospace;
      font-size: 10px;
      height: 100px;
      overflow-y: auto;
      padding: 6px;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- 上段：英語文字起こし -->
    <div class="display-box">
      <div class="section-title">【リアルタイム英語文字起こし (Web Speech API)】</div>
      <div id="transcriptDisplay" class="content-area">(音声認識を開始してください...)</div>
    </div>
    <!-- 下段：日本語訳 -->
    <div class="display-box japanese">
      <div class="section-title">【リアルタイム日本語訳 (Google 翻訳)】</div>
      <div id="translationDisplay" class="content-area">(翻訳結果がここに表示されます...)</div>
    </div>
  </div>

  <div class="side-panel">
    <h2>
      <span>英語講義翻訳アシスト</span>
      <span class="badge">v7.2</span>
    </h2>

    <div>
      <label style="color:#00FF00; font-weight:bold;">Google Apps Script (GAS) Web API URL:</label>
      <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec">
    </div>

    <div>
      <label style="color:#00FF00; font-weight:bold;">音声認識 言語設定:</label>
      <select id="languageSelect">
        <option value="en-US" selected>英語 (米国 - en-US)</option>
        <option value="en-GB">英語 (英国 - en-GB)</option>
      </select>
    </div>

    <div style="display:flex; gap:8px;">
      <button id="startBtn" onclick="startRecognition()">🎤 認識開始</button>
      <button id="stopBtn" class="stop-btn" onclick="stopRecognition()" disabled>⏹ 停止</button>
    </div>

    <!-- 和訳音声読上げ用コントロール -->
    <div style="display:flex; gap:8px;">
      <button onclick="speakJapanese()" style="background:#00aaff; color:#000;">🔊 和訳を朗読</button>
      <button onclick="stopSpeaking()" style="background:#882222; width:40%;">⏹ 読上停止</button>
    </div>

    <div style="display:flex; gap:8px;">
      <button onclick="downloadTranscript()" style="background:#0088cc;">💾 TXT保存</button>
      <button onclick="clearTranscript()" style="background:#444;">🗑️ 表示クリア</button>
    </div>

    <div style="border-top:1px solid #333; margin:2px 0;"></div>

    <div style="font-weight:bold; color:#00FF00;">【動作ステータス】</div>
    <div id="status" class="status">待機中</div>

    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:bold; color:#00FF00;">【詳細ログ・除外フィルタ結果】</span>
      <button onclick="clearLog()" style="padding:2px 6px; font-size:10px; background:#444; width:auto;">クリア</button>
    </div>
    <div id="logBox" class="log-box">[System v7.2] Ready.</div>
  </div>

  <script>
    let recognition = null;
    let isRecognizing = false;
    let finalEnglishText = '';
    let finalJapaneseText = '';
    let wakeLock = null;

    // ローカルストレージ復元
    window.addEventListener('DOMContentLoaded', () => {
      const savedGasUrl = localStorage.getItem('gas_translation_url');
      if (savedGasUrl) {
        document.getElementById('gasUrl').value = savedGasUrl;
      }
      initSpeechRecognition();
    });

    document.getElementById('gasUrl').addEventListener('change', (e) => {
      localStorage.setItem('gas_translation_url', e.target.value.trim());
    });

    // 非英語文字除去フィルタ
    function cleanEnglishOnly(text) {
      if (!text) return '';
      let cleaned = text.replace(/[^a-zA-Z0-9\s.,?!'\"]/g, '');
      cleaned = cleaned.replace(/\s+/g, ' ').trim();
      return cleaned;
    }

    function log(tag, msg) {
      const timeStr = new Date().toLocaleTimeString();
      const logBox = document.getElementById('logBox');
      logBox.innerText = `[${timeStr}] [${tag}] ${msg}\n` + logBox.innerText;
      console.log(`[${tag}] ${msg}`);
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    // スリープ防止（Wake Lock）
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          log("System", "画面スリープ防止 (Wake Lock) アクティブ");
        }
      } catch (err) {
        log("System", `Wake Lock エラー: ${err.message}`);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
        log("System", "画面スリープ防止 解除");
      }
    }

    // Google 翻訳 (GAS) 呼び出し
    async function translateText(englishSentence) {
      const gasUrl = document.getElementById('gasUrl').value.trim();
      if (!gasUrl) {
        log("Translate", "GAS URL未設定のため翻訳スキップ");
        return;
      }

      try {
        log("Translate", `送信中: "${englishSentence}"`);
        const response = await fetch(gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ text: englishSentence, source: 'en', target: 'ja' })
        });

        if (response.ok) {
          const jaText = await response.text();
          log("Translate", `翻訳成功: "${jaText}"`);
          
          finalJapaneseText += jaText + '\n';
          const jaDisplay = document.getElementById('translationDisplay');
          jaDisplay.innerText = finalJapaneseText;
          jaDisplay.scrollTop = jaDisplay.scrollHeight;
        } else {
          log("Error", `GASレスポンスエラー: ${response.status}`);
        }
      } catch (e) {
        log("Error", `翻訳通信エラー: ${e.message}`);
      }
    }

    // ==========================================
    // 和訳音声読上げ機能 (Web Speech Synthesis API)
    // ==========================================
    function speakJapanese() {
      if (!('speechSynthesis' in window)) {
        alert("お使いのブラウザは音声読上げに対応していません。");
        return;
      }

      const text = finalJapaneseText.trim();
      if (!text) {
        alert("読上げる和訳テキストがありません。");
        return;
      }

      // 既に再生中の場合は一旦キャンセル
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.0; // 読み上げ速度 (1.0 = 標準)
      utterance.pitch = 1.0; // 声のトーン (1.0 = 標準)

      utterance.onstart = () => {
        log("TTS", "和訳の音声読上げを開始します。");
        setStatus("🔊 和訳音声読上げ中...");
      };

      utterance.onend = () => {
        log("TTS", "読上げが完了しました。");
        if (isRecognizing) {
          setStatus("音声認識中... (マイクON)");
        } else {
          setStatus("停止中");
        }
      };

      utterance.onerror = (e) => {
        log("Error", `読上げエラー: ${e.error}`);
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeaking() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        log("TTS", "読上げを停止しました。");
        if (isRecognizing) {
          setStatus("音声認識中... (マイクON)");
        } else {
          setStatus("停止中");
        }
      }
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        setStatus("エラー: お使いのブラウザは Web Speech API 非対応です。");
        log("Error", "Web Speech API not supported.");
        document.getElementById('startBtn').disabled = true;
        return false;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = document.getElementById('languageSelect').value;

      recognition.onstart = () => {
        isRecognizing = true;
        setStatus("音声認識中... (マイクON)");
        log("System", "音声認識開始");
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        requestWakeLock();
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const rawText = event.results[i][0].transcript;
          const filteredText = cleanEnglishOnly(rawText);

          if (!filteredText) continue;

          if (event.results[i].isFinal) {
            finalEnglishText += filteredText + '. ';
            log("Final", filteredText);
            
            // 確定した英文を翻訳に送信
            translateText(filteredText);
          } else {
            interimTranscript += filteredText;
          }
        }

        const enDisplay = document.getElementById('transcriptDisplay');
        enDisplay.innerText = finalEnglishText + (interimTranscript ? `\n(認識中...: ${interimTranscript})` : '');
        enDisplay.scrollTop = enDisplay.scrollHeight;
      };

      recognition.onerror = (event) => {
        log("Error", `認識エラー: ${event.error}`);
        if (event.error === 'not-allowed') {
          setStatus("エラー: マイク許可が拒否されました。");
        }
      };

      recognition.onend = () => {
        log("System", "音声認識セッション終了");
        if (isRecognizing) {
          log("System", "自動再接続中...");
          try {
            recognition.start();
          } catch (e) {
            log("Error", `再接続失敗: ${e.message}`);
          }
        } else {
          setStatus("停止中");
          document.getElementById('startBtn').disabled = false;
          document.getElementById('stopBtn').disabled = true;
          releaseWakeLock();
        }
      };

      return true;
    }

    function startRecognition() {
      if (!recognition && !initSpeechRecognition()) return;
      isRecognizing = true;
      try {
        recognition.lang = document.getElementById('languageSelect').value;
        recognition.start();
      } catch (e) {
        log("Error", `開始エラー: ${e.message}`);
      }
    }

    function stopRecognition() {
      isRecognizing = false;
      if (recognition) {
        recognition.stop();
      }
      stopSpeaking();
      setStatus("停止処理中...");
    }

    function clearTranscript() {
      stopSpeaking();
      finalEnglishText = '';
      finalJapaneseText = '';
      document.getElementById('transcriptDisplay').innerText = '(音声認識を開始してください...)';
      document.getElementById('translationDisplay').innerText = '(翻訳結果がここに表示されます...)';
      log("System", "表示テキストをクリアしました。");
    }

    function clearLog() {
      document.getElementById('logBox').innerText = '[Cleared]';
    }

    // スマホ・PC共通のファイルダウンロード / 保存ポップアップ処理
    async function downloadTranscript() {
      if (!finalEnglishText && !finalJapaneseText) {
        alert("保存するテキストがありません。");
        return;
      }

      const now = new Date();
      const timeStr = now.toISOString().slice(0, 10) + '_' + now.toTimeString().slice(0, 8).replace(/:/g, '');
      const defaultFileName = `lecture_transcript_${timeStr}.txt`;
      
      const fileContent = `========================================\n`
                        + `【英文講義テキスト】\n`
                        + `========================================\n\n`
                        + `${finalEnglishText}\n\n`
                        + `========================================\n`
                        + `【日本語訳】\n`
                        + `========================================\n\n`
                        + `${finalJapaneseText}`;

      // PC用: 名前を付けて保存ダイアログ
      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: defaultFileName,
            types: [{
              description: 'Text Document',
              accept: { 'text/plain': ['.txt'] },
            }],
          });
          const writable = await handle.createWritable();
          await writable.write(fileContent);
          await writable.close();
          log("System", `ファイルを保存しました: ${handle.name}`);
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
          log("System", "標準ダウンロードに切り替えます。");
        }
      }

      // スマホ・フォールバック用: 汎用ダウンロード
      const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = defaultFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      log("System", `ダウンロードを実行しました: ${defaultFileName}`);
    }

    document.getElementById('languageSelect').addEventListener('change', (e) => {
      if (recognition) {
        recognition.lang = e.target.value;
        log("Config", `言語変更: ${e.target.value}`);
      }
    });
  </script>
</body>
</html>
