<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>EVEN G2 Debug App</title>
  <style>
    body {
      background-color: #111;
      color: #00FF00;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .glass-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #333;
      padding-right: 20px;
    }
    #glass-display {
      width: 576px;
      height: 288px;
      background-color: #000;
      border: 3px solid #00FF00;
      border-radius: 8px;
      box-sizing: border-box;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .control-panel {
      width: 400px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #ccc;
      font-size: 13px;
    }
    .control-panel h2 { color: #00FF00; font-size: 16px; margin: 0 0 5px 0; }
    .status { font-size: 12px; color: #888; background: #222; padding: 10px; border-radius: 4px; height: 200px; overflow-y: auto; }
  </style>
</head>
<body>

  <!-- 左側：ブラウザシミュレーションUI -->
  <div class="glass-container">
    <div id="glass-display">
      <div id="displayText" style="font-size: 18px; font-weight: bold; color: #00FF00;">
        G2 SDK デバッグ待機中...
      </div>
    </div>
  </div>

  <!-- 右側：コントロールパネル（ログ確認用） -->
  <div class="control-panel">
    <h2>イベントログ</h2>
    <div id="logStatus" class="status"></div>
  </div>

  <!-- 公式SDK & アプリロジック -->
  <script type="module">
    import {
      waitForEvenAppBridge,
      TextContainerProperty,
      CreateStartUpPageContainer,
      TextContainerUpgrade
    } from 'https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk/+esm';

    let bridge = null;

    function log(msg) {
      const status = document.getElementById('logStatus');
      status.innerText += msg + "\n";
      status.scrollTop = status.scrollHeight;
      console.log(msg);
    }

    async function initG2() {
      try {
        log("G2ブリッジ接続中...");
        bridge = await waitForEvenAppBridge();
        log("ブリッジ接続成功。初期コンテナ作成中...");
        
        const mainText = new TextContainerProperty({
          xPosition: 0,
          yPosition: 0,
          width: 576,
          height: 288,
          borderWidth: 0,
          borderColor: 5,
          paddingLength: 4,
          containerID: 1,
          containerName: 'debug_main',
          content: "HELLO EVEN G2\nPress any button or Menu",
          isEventCapture: 1,
        });

        await bridge.createStartUpPageContainer(
          new CreateStartUpPageContainer({
            containerTotalNum: 1,
            textObject: [mainText],
          })
        );

        log("初期化完了。イベント待機中...");

        // イベントリスナーの最小構成
        bridge.onEvenHubEvent(async event => {
          log("--- Event Triggered ---");
          log(JSON.stringify(event, null, 2));

          // 単純に固定のテキストに書き換えてみるテスト
          try {
            await bridge.textContainerUpgrade(
              new TextContainerUpgrade({
                containerID: 1,
                containerName: 'debug_main',
                content: "Event Received!\n" + JSON.stringify(event),
              })
            );
            log("画面更新成功");
          } catch (err) {
            log("画面更新エラー: " + err.message);
          }
        });

      } catch (e) {
        log("SDK接続エラー: " + e.message);
      }
    }

    initG2();
  </script>
</body>
</html>
