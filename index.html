<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>EVEN G2 Translator App</title>
  <style>
    body {
      background-color: #111;
      color: #00FF00;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .glass-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #333;
      padding-right: 20px;
    }
    .mode-tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      width: 576px;
    }
    .mode-tab {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #00AA00;
      color: #00FF00;
      padding: 6px 2px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    .mode-tab.active {
      background: #00FF00;
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }
    #glass-display {
      width: 576px;
      height: 288px;
      background-color: #000;
      border: 3px solid #00FF00;
      border-radius: 8px;
      box-sizing: border-box;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .hud-mode-screen {
      display: none;
      height: 100%;
      flex-direction: column;
    }
    .hud-mode-screen.active {
      display: flex;
    }
    .control-panel {
      width: 400px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #ccc;
      font-size: 13px;
      overflow-y: auto;
    }
    .control-panel h2 { color: #00FF00; font-size: 16px; margin: 0 0 5px 0; }
    input, textarea, select, button {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    button { background: #00aa00; color: #fff; font-weight: bold; cursor: pointer; border: none; padding: 8px; }
    button:hover { background: #00dd00; color: #000; }
    .nav-btn {
      background: #333;
      border: 1px solid #00FF00;
      color: #00FF00;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .nav-btn:hover { background: #00FF00; color: #000; }
    .status { font-size: 11px; color: #888; }
  </style>
</head>
<body tabindex="0">

  <div class="glass-container">
    <div class="mode-tab-bar">
      <div id="tab1" class="mode-tab active" onclick="switchMode(1)">1: 自動トリガー</div>
      <div id="tab2" class="mode-tab" onclick="switchMode(2)">2: PTT (押して送信)</div>
    </div>

    <div id="glass-display">
      <div id="mode1Screen" class="hud-mode-screen active">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="color:#00FF00; font-size:10px; font-weight:bold;">自動トリガー (↑/↓キーで履歴切り替え)</div>
          <div>
            <button class="nav-btn" onclick="navigateHistory('up')">▲ 前へ</button>
            <button class="nav-btn" onclick="navigateHistory('down')">▼ 次へ</button>
          </div>
        </div>
        <div id="m1-status" style="color:#888; font-size:11px; margin-top:2px;">音声入力待機中...</div>
        <div id="m1-text" style="color:#fff; font-size:12px; font-weight:bold; margin-top:4px; white-space:pre-wrap;">-</div>
      </div>

      <div id="mode2Screen" class="hud-mode-screen">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="color:#00BFFF; font-size:10px; font-weight:bold;">PTT 翻訳 (↑/↓キーで履歴切り替え)</div>
          <div>
            <button class="nav-btn" onclick="navigateHistory('up')">▲ 前へ</button>
            <button class="nav-btn" onclick="navigateHistory('down')">▼ 次へ</button>
          </div>
        </div>
        <div id="m2-status" style="color:#888; font-size:11px; margin-top:2px;">タップで音声送信＆解析</div>
        <div id="m2-text" style="color:#fff; font-size:12px; font-weight:bold; margin-top:4px; white-space:pre-wrap;">-</div>
      </div>
    </div>
  </div>

  <div class="control-panel">
    <h2>G2 音声翻訳＆返答アシスト</h2>
    <div>
      <label>OpenAI API Key (Whisper/GPT用):</label>
      <input type="password" id="apiKey" placeholder="sk-..." style="width:100%; box-sizing:border-box;" />
    </div>
    <div style="border-top:1px solid #333; margin:5px 0;"></div>
    <button onclick="forceSendPTT()" style="background:#0088cc;">🎤 PTT 手動送信（画面2用）</button>
    <div id="status" class="status">SDK接続待機中...</div>
  </div>

  <script type="module">
    import {
      waitForEvenAppBridge,
      TextContainerProperty,
      CreateStartUpPageContainer,
      TextContainerUpgrade,
      OsEventTypeList
    } from 'https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk/+esm';

    let bridge = null;
    let currentMode = 1;

    let pcmBuffer = [];
    let totalLength = 0;
    let isProcessing = false;

    let historyList = [];
    let historyIndex = -1;

    function getDisplayText() {
      if (historyList.length === 0) {
        return currentMode === 1 
          ? "音声入力待機中...\n（相手の発言を検知すると自動表示されます）" 
          : "タップ操作で音声送信\n（ボタンを押して会話を開始）";
      }
      const item = historyList[historyIndex];
      const navInfo = `[${historyIndex + 1}/${historyList.length}] -------------------\n`;
      return navInfo + item;
    }

    // 音声データの最小音量チェック（確実に声を拾えるよう閾値を300へ引き下げ）
    function isAudioQuiet(pcmChunks) {
      let sum = 0;
      let count = 0;
      for (const chunk of pcmChunks) {
        const dataView = new DataView(chunk.buffer, chunk.byteOffset, chunk.byteLength);
        for (let i = 0; i < chunk.length; i += 2) {
          const sample = dataView.getInt16(i, true);
          sum += sample * sample;
          count++;
        }
      }
      if (count === 0) return true;
      const rms = Math.sqrt(sum / count);
      return rms < 300; 
    }

    function pcmToWavBlob(pcmChunks, totalLen) {
      const wavHeader = new ArrayBuffer(44);
      const view = new DataView(wavHeader);
      view.setUint32(0, 0x52494646, false);
      view.setUint32(4, 36 + totalLen, true);
      view.setUint32(8, 0x57415645, false);
      view.setUint32(12, 0x666d7420, false);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, 16000, true);
      view.setUint32(28, 32000, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      view.setUint32(36, 0x64617461, false);
      view.setUint32(40, totalLen, true);

      const wavBytes = new Uint8Array(44 + totalLen);
      wavBytes.set(new Uint8Array(wavHeader), 0);
      let offset = 44;
      for (const chunk of pcmChunks) {
        wavBytes.set(chunk, offset);
        offset += chunk.length;
      }
      return new Blob([wavBytes], { type: 'audio/wav' });
    }

    // ハルシネーション（幻聴）や意味のない短文を弾くフィルタ
    function isNoiseOrFiller(text) {
      if (!text) return true;
      const clean = text.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
      
      const hallucinationPhrases = [
        'thank you for watching',
        'thanks for watching',
        'subtitles by',
        'amara.org',
        'click noises',
        'ignore',
        'subscribe',
        'you'
      ];

      if (clean.length < 2) return true;
      if (hallucinationPhrases.some(p => clean === p || clean.includes(p))) return true;

      return false;
    }

    async function flushAndTranscribe() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (isProcessing || pcmBuffer.length === 0 || !apiKey) {
        if (!apiKey) setStatus('API Keyを入力してください');
        return;
      }

      isProcessing = true;
      const chunksToProcess = [...pcmBuffer];
      const lenToProcess = totalLength;
      pcmBuffer = [];
      totalLength = 0;

      if (isAudioQuiet(chunksToProcess)) {
        setStatus('待機中（小さな音）...');
        isProcessing = false;
        return;
      }

      try {
        setStatus('Whisperで文字起こし中...');
        const wavBlob = pcmToWavBlob(chunksToProcess, lenToProcess);
        const formData = new FormData();
        formData.append('file', wavBlob, 'audio.wav');
        formData.append('model', 'whisper-1');
        // prompt で「会話以外の音は文字起こししない」旨を適切に与えて幻聴を防止
        formData.append('prompt', 'Transcribe English speech. If there is no clear speech, output nothing.');

        const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${apiKey}` },
          body: formData
        });

        if (!response.ok) throw new Error(`Whisper API Error: ${response.statusText}`);
        const data = await response.json();
        const enText = data.text ? data.text.trim() : '';

        if (!isNoiseOrFiller(enText)) {
          setStatus('AIが和訳＆返答を生成中...');

          const chatResponse = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: 'gpt-4o-mini',
              messages: [
                {
                  role: 'system',
                  content: `あなたはスマートグラス用の通訳・回答アシスタントです。相手の発言を受け取り、中央に【破線】を明記した以下のフォーマットをそのまま厳格に守って出力してください。余計な挨拶や解説は一切不要です。

【相手】
(英語原文)
(日本語訳)
-------------------
【返答ヒント】
(おすすめの英語返答)
(カタカナフリガナ)
(日本語訳)`
                },
                {
                  role: 'user',
                  content: enText
                }
              ]
            })
          });

          const chatData = await chatResponse.json();
          const aiReply = chatData.choices[0].message.content;

          historyList.push(aiReply);
          if (historyList.length > 10) historyList.shift();
          
          historyIndex = historyList.length - 1;

          await updateDisplays();
          setStatus('完了！');
        } else {
          setStatus('無効な文字起こしをスキップしました');
        }
      } catch (e) {
        setStatus('エラー: ' + e.message);
      } finally {
        isProcessing = false;
      }
    }

    async function updateDisplays() {
      const displayText = getDisplayText();
      
      if (currentMode === 1) {
        document.getElementById('m1-text').innerText = displayText;
      } else {
        document.getElementById('m2-text').innerText = displayText;
      }

      await sendToG2Display(displayText);
    }

    window.navigateHistory = async function(direction) {
      if (historyList.length === 0) return;
      if (direction === 'up' && historyIndex > 0) {
        historyIndex--;
        await updateDisplays();
      } else if (direction === 'down' && historyIndex < historyList.length - 1) {
        historyIndex++;
        await updateDisplays();
      }
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        window.navigateHistory('up');
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        window.navigateHistory('down');
      }
    });

    async function initG2() {
      try {
        setStatus("G2ブリッジ接続中...");
        bridge = await waitForEvenAppBridge();
        
        const mainText = new TextContainerProperty({
          xPosition: 0,
          yPosition: 0,
          width: 576,
          height: 288,
          borderWidth: 0,
          borderColor: 5,
          paddingLength: 4,
          containerID: 1,
          containerName: 'hud_main',
          content: getDisplayText(),
          isEventCapture: 1,
        });

        await bridge.createStartUpPageContainer(
          new CreateStartUpPageContainer({
            containerTotalNum: 1,
            textObject: [mainText],
          })
        );

        await bridge.audioControl(true);
        setStatus("G2 SDK 接続完了 / マイクON");

        bridge.onEvenHubEvent(async event => {
          const pcm = event.audioEvent?.audioPcm;
          if (pcm) {
            pcmBuffer.push(pcm);
            totalLength += pcm.length;

            if (currentMode === 1 && totalLength > 32000 * 2) {
              flushAndTranscribe();
            }
          }

          const sysType = event.sysEvent?.eventType;
          const textType = event.textEvent?.eventType;

          if (sysType === OsEventTypeList.CLICK_EVENT || textType === OsEventTypeList.CLICK_EVENT) {
            if (currentMode === 2) {
              flushAndTranscribe();
            }
          }

          const evt = sysType || textType;
          if (evt === OsEventTypeList.UP_EVENT || evt === OsEventTypeList.SCROLL_UP_EVENT || evt === OsEventTypeList.FLICK_UP_EVENT) {
            window.navigateHistory('up');
          }
          if (evt === OsEventTypeList.DOWN_EVENT || evt === OsEventTypeList.SCROLL_DOWN_EVENT || evt === OsEventTypeList.FLICK_DOWN_EVENT) {
            window.navigateHistory('down');
          }
        });

      } catch (e) {
        setStatus("SDK接続エラー: " + e.message);
      }
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    async function sendToG2Display(text) {
      if (!bridge) return;
      try {
        await bridge.textContainerUpgrade(
          new TextContainerUpgrade({
            containerID: 1,
            containerName: 'hud_main',
            content: text,
          })
        );
      } catch (e) {
        console.error("Display update failed:", e);
      }
    }

    function updateUIOnly(mode) {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab' + mode);
      if (activeTab) activeTab.classList.add('active');

      document.querySelectorAll('.hud-mode-screen').forEach(s => s.classList.remove('active'));
      const activeScreen = document.getElementById('mode' + mode + 'Screen');
      if (activeScreen) activeScreen.classList.add('active');
    }

    window.switchMode = function(mode) {
      currentMode = mode;
      pcmBuffer = [];
      totalLength = 0;
      updateUIOnly(currentMode);
      updateDisplays();
    };

    window.forceSendPTT = function() {
      if (currentMode !== 2) {
        switchMode(2);
      }
      flushAndTranscribe();
    };

    initG2();
  </script>
</body>
</html>
