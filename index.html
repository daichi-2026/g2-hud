<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>EVEN G2 Translator App</title>
  <style>
    body {
      background-color: #111;
      color: #00FF00;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .glass-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #333;
      padding-right: 20px;
    }
    .mode-tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      width: 576px;
    }
    .mode-tab {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #00AA00;
      color: #00FF00;
      padding: 6px 2px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    .mode-tab.active {
      background: #00FF00;
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }
    #glass-display {
      width: 576px;
      height: 288px;
      background-color: #000;
      border: 3px solid #00FF00;
      border-radius: 8px;
      box-sizing: border-box;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .hud-mode-screen {
      display: none;
      height: 100%;
      flex-direction: column;
    }
    .hud-mode-screen.active {
      display: flex;
    }
    .text-scroll-area {
      flex: 1;
      overflow-y: auto;
      margin-top: 4px;
      padding-right: 4px;
    }
    .text-scroll-area::-webkit-scrollbar {
      width: 6px;
    }
    .text-scroll-area::-webkit-scrollbar-thumb {
      background: #00AA00;
      border-radius: 3px;
    }
    .control-panel {
      width: 400px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #ccc;
      font-size: 13px;
      overflow-y: auto;
    }
    .control-panel h2 { color: #00FF00; font-size: 16px; margin: 0 0 5px 0; display: flex; align-items: center; justify-content: space-between; }
    .version-badge {
      background: #00FF00;
      color: #000;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }
    input, button {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    button { background: #00aa00; color: #fff; font-weight: bold; cursor: pointer; border: none; padding: 8px; }
    button:hover { background: #00dd00; color: #000; }
    .nav-btn {
      background: #333;
      border: 1px solid #00FF00;
      color: #00FF00;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .nav-btn:hover { background: #00FF00; color: #000; }
    .status { font-size: 11px; color: #888; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body tabindex="0">

  <div class="glass-container">
    <div class="mode-tab-bar">
      <div id="tab1" class="mode-tab active" onclick="switchMode(1)">1: 自動トリガー</div>
      <div id="tab2" class="mode-tab" onclick="switchMode(2)">2: PTT (押して送信)</div>
    </div>

    <div id="glass-display">
      <div id="mode1Screen" class="hud-mode-screen active">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="color:#00FF00; font-size:10px; font-weight:bold;">自動トリガー (↑/↓キーで履歴移動)</div>
          <div>
            <button class="nav-btn" onclick="navigateHistory('up')">▲ 前へ</button>
            <button class="nav-btn" onclick="navigateHistory('down')">▼ 次へ</button>
          </div>
        </div>
        <div id="m1-status" style="color:#888; font-size:11px; margin-top:2px;">音声入力待機中...</div>
        <div class="text-scroll-area">
          <div id="m1-text" style="color:#fff; font-size:12px; font-weight:bold; white-space:pre-wrap;">-</div>
        </div>
      </div>

      <div id="mode2Screen" class="hud-mode-screen">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="color:#00BFFF; font-size:10px; font-weight:bold;">PTT 翻訳 (↑/↓キーで履歴移動)</div>
          <div>
            <button class="nav-btn" onclick="navigateHistory('up')">▲ 前へ</button>
            <button class="nav-btn" onclick="navigateHistory('down')">▼ 次へ</button>
          </div>
        </div>
        <div id="m2-status" style="color:#888; font-size:11px; margin-top:2px;">ボタンで音声送信</div>
        <div class="text-scroll-area">
          <div id="m2-text" style="color:#fff; font-size:12px; font-weight:bold; white-space:pre-wrap;">-</div>
        </div>
      </div>
    </div>
  </div>

  <div class="control-panel">
    <h2>
      <span>G2 音声翻訳＆返答アシスト</span>
      <span class="version-badge" id="versionBadge">v1.4 (修正4回目)</span>
    </h2>
    <div>
      <label>OpenAI API Key (Whisper/GPT用):</label>
      <input type="password" id="apiKey" placeholder="sk-..." style="width:100%; box-sizing:border-box;" />
    </div>
    
    <div>
      <label>マイク感度閾値 (音量閾値): <span id="thresholdVal">300</span></label>
      <input type="range" id="noiseThreshold" min="50" max="2000" value="300" style="width:100%;" oninput="document.getElementById('thresholdVal').innerText = this.value" />
      <div style="font-size:10px; color:#888;">※この値以下の環境音・ノイズは「無音」として無視されます</div>
    </div>

    <div style="border-top:1px solid #333; margin:5px 0;"></div>
    <button onclick="forceSendPTT()" style="background:#0088cc;">🎤 PTT 手動送信（画面2用）</button>
    <button onclick="clearHistory()" style="background:#cc3333; margin-top:5px;">🗑️ 履歴をクリア</button>
    
    <div style="border-top:1px solid #333; margin:5px 0;"></div>
    <div style="font-weight:bold; color:#00FF00;">【ログ・ステータス】</div>
    <div id="status" class="status">SDK接続待機中...</div>
  </div>

  <script type="module">
    import {
      waitForEvenAppBridge,
      TextContainerProperty,
      CreateStartUpPageContainer,
      TextContainerUpgrade,
      OsEventTypeList
    } from 'https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk/+esm';

    const APP_VERSION = "v1.4 (修正4回目)";

    let bridge = null;
    let currentMode = 1;

    let pcmChunks = [];
    let totalBytes = 0;
    let isProcessing = false;
    let silenceTimer = null;

    let historyList = [];
    let historyIndex = -1;

    function getDisplayText() {
      if (historyList.length === 0) {
        return currentMode === 1 
          ? "音声入力待機中...\n（相手の発言を検知すると自動表示されます）" 
          : "タップ操作で音声送信\n（ボタンを押して会話を開始）";
      }
      const item = historyList[historyIndex];
      const navInfo = `[${historyIndex + 1}/${historyList.length}] -------------------\n`;
      return navInfo + item;
    }

    function normalizePcm(pcmData) {
      if (!pcmData) return null;
      if (typeof pcmData === 'string') {
        const binary = atob(pcmData);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }
      if (pcmData instanceof Uint8Array) return pcmData;
      if (pcmData instanceof ArrayBuffer) return new Uint8Array(pcmData);
      if (Array.isArray(pcmData)) return new Uint8Array(pcmData);
      if (ArrayBuffer.isView(pcmData)) return new Uint8Array(pcmData.buffer, pcmData.byteOffset, pcmData.byteLength);
      return null;
    }

    function calculateRMS(uint8Array) {
      if (!uint8Array || uint8Array.length < 2) return 0;
      const dataView = new DataView(uint8Array.buffer, uint8Array.byteOffset, uint8Array.byteLength);
      let sum = 0;
      const samples = Math.floor(uint8Array.byteLength / 2);
      for (let i = 0; i < samples; i++) {
        const sample = dataView.getInt16(i * 2, true);
        sum += sample * sample;
      }
      return Math.sqrt(sum / samples);
    }

    function createWavBlob(chunks, dataSize) {
      const sampleRate = 16000;
      const numChannels = 1;
      const bitsPerSample = 16;
      
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, 'WAVE');

      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * numChannels * (bitsPerSample / 8), true);
      view.setUint16(32, numChannels * (bitsPerSample / 8), true);
      view.setUint16(34, bitsPerSample, true);

      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (const chunk of chunks) {
        new Uint8Array(buffer, offset, chunk.byteLength).set(chunk);
        offset += chunk.byteLength;
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    // ノイズ判定ロジックの適正化（過剰なキーワード判定を排除）
    function isNoiseOrFiller(text) {
      if (!text) return true;
      const clean = text.trim();
      if (clean.length <= 1) return true;

      const cleanLower = clean.toLowerCase();
      const strictHallucinations = [
        'thank you for watching',
        'thanks for watching',
        'subtitles by',
        'amara.org'
      ];

      if (strictHallucinations.some(p => cleanLower === p)) return true;

      return false;
    }

    async function flushAndTranscribe() {
      if (silenceTimer) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }

      if (isProcessing) return;

      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        setStatus('エラー: API Keyを入力してください');
        return;
      }

      if (totalBytes < 4000) {
        setStatus(`データ不足のためスキップ (${totalBytes} bytes)`);
        return;
      }

      isProcessing = true;
      const chunksToProcess = [...pcmChunks];
      const bytesToProcess = totalBytes;
      
      pcmChunks = [];
      totalBytes = 0;

      try {
        setStatus(`Whisperへ送信中... (${Math.round(bytesToProcess / 1024)}KB)`);
        const wavBlob = createWavBlob(chunksToProcess, bytesToProcess);
        
        const formData = new FormData();
        formData.append('file', wavBlob, 'audio.wav');
        formData.append('model', 'whisper-1');
        formData.append('language', 'en');

        const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${apiKey}` },
          body: formData
        });

        if (!response.ok) {
          const errJson = await response.json().catch(() => ({}));
          throw new Error(errJson.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const enText = data.text ? data.text.trim() : '';

        if (!isNoiseOrFiller(enText)) {
          setStatus(`GPT生成中: "${enText}"`);

          const chatResponse = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: 'gpt-4o-mini',
              messages: [
                {
                  role: 'system',
                  content: `あなたはスマートグラス用の通訳・回答アシスタントです。相手の発言を受け取り、中央に【破線】を明記した以下のフォーマットをそのまま厳格に守って出力してください。余計な挨拶や解説は一切不要です。

【相手】
(英語原文)
(日本語訳)
-------------------
【返答ヒント】
(おすすめの英語返答)
(カタカナフリガナ)
(日本語訳)`
                },
                { role: 'user', content: enText }
              ]
            })
          });

          if (!chatResponse.ok) {
            const errJson = await chatResponse.json().catch(() => ({}));
            throw new Error(errJson.error?.message || `GPT HTTP ${chatResponse.status}`);
          }

          const chatData = await chatResponse.json();
          const aiReply = chatData.choices[0].message.content;

          historyList.push(aiReply);
          if (historyList.length > 10) historyList.shift();
          historyIndex = historyList.length - 1;

          await updateDisplays();
          setStatus('次を待機中...');
        } else {
          setStatus(`ノイズ除去: "${enText}" -> 次を待機中`);
        }
      } catch (e) {
        console.error(e);
        setStatus('エラー: ' + e.message);
      } finally {
        isProcessing = false;
      }
    }

    function handleAudioData(normalized) {
      if (isProcessing) return;

      const rms = calculateRMS(normalized);
      const threshold = parseFloat(document.getElementById('noiseThreshold').value) || 300;

      if (rms >= threshold) {
        pcmChunks.push(normalized);
        totalBytes += normalized.length;

        if (currentMode === 1) {
          setStatus(`音声検知中... (${Math.round(totalBytes/1024)}KB) [音量:${Math.round(rms)}]`);

          if (silenceTimer) clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (currentMode === 1 && !isProcessing) {
              flushAndTranscribe();
            }
          }, 1200);
        }
      } else {
        if (currentMode === 1 && totalBytes > 0) {
          setStatus(`無音判定中... (${Math.round(totalBytes/1024)}KB) [音量:${Math.round(rms)}]`);
        }
      }
    }

    async function updateDisplays() {
      const displayText = getDisplayText();
      document.getElementById('m1-text').innerText = displayText;
      document.getElementById('m2-text').innerText = displayText;
      await sendToG2Display(displayText);
    }

    window.navigateHistory = async function(direction) {
      if (historyList.length === 0) return;
      if (direction === 'up' && historyIndex > 0) {
        historyIndex--;
        await updateDisplays();
      } else if (direction === 'down' && historyIndex < historyList.length - 1) {
        historyIndex++;
        await updateDisplays();
      }
    };

    window.clearHistory = async function() {
      historyList = [];
      historyIndex = -1;
      await updateDisplays();
      setStatus('履歴をクリアしました');
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        window.navigateHistory('up');
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        window.navigateHistory('down');
      }
    });

    async function initG2() {
      try {
        setStatus(`G2ブリッジ接続中... [${APP_VERSION}]`);
        bridge = await waitForEvenAppBridge();
        
        const mainText = new TextContainerProperty({
          xPosition: 0,
          yPosition: 0,
          width: 576,
          height: 288,
          borderWidth: 0,
          borderColor: 5,
          paddingLength: 4,
          containerID: 1,
          containerName: 'hud_main',
          content: getDisplayText(),
          isEventCapture: 1,
        });

        await bridge.createStartUpPageContainer(
          new CreateStartUpPageContainer({
            containerTotalNum: 1,
            textObject: [mainText],
          })
        );

        await bridge.audioControl(true);
        setStatus(`G2 SDK 接続完了 (${APP_VERSION}) / マイクON\n音声待機中...`);

        bridge.onEvenHubEvent(async event => {
          const rawPcm = event.audioEvent?.audioPcm;
          if (rawPcm) {
            const normalized = normalizePcm(rawPcm);
            if (normalized && normalized.length > 0) {
              handleAudioData(normalized);
            }
          }

          const sysType = event.sysEvent?.eventType;
          const textType = event.textEvent?.eventType;

          if (sysType === OsEventTypeList.CLICK_EVENT || textType === OsEventTypeList.CLICK_EVENT) {
            if (currentMode === 2) {
              flushAndTranscribe();
            }
          }

          const evt = sysType || textType;
          if (evt === OsEventTypeList.UP_EVENT || evt === OsEventTypeList.SCROLL_UP_EVENT || evt === OsEventTypeList.FLICK_UP_EVENT) {
            window.navigateHistory('up');
          }
          if (evt === OsEventTypeList.DOWN_EVENT || evt === OsEventTypeList.SCROLL_DOWN_EVENT || evt === OsEventTypeList.FLICK_DOWN_EVENT) {
            window.navigateHistory('down');
          }
        });

      } catch (e) {
        setStatus("SDK接続エラー: " + e.message);
      }
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    async function sendToG2Display(text) {
      if (!bridge) return;
      try {
        await bridge.textContainerUpgrade(
          new TextContainerUpgrade({
            containerID: 1,
            containerName: 'hud_main',
            content: text,
          })
        );
      } catch (e) {
        console.error("Display update failed:", e);
      }
    }

    function updateUIOnly(mode) {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab' + mode);
      if (activeTab) activeTab.classList.add('active');

      document.querySelectorAll('.hud-mode-screen').forEach(s => s.classList.remove('active'));
      const activeScreen = document.getElementById('mode' + mode + 'Screen');
      if (activeScreen) activeScreen.classList.add('active');
    }

    window.switchMode = function(mode) {
      currentMode = mode;
      pcmChunks = [];
      totalBytes = 0;
      isProcessing = false;
      if (silenceTimer) clearTimeout(silenceTimer);
      updateUIOnly(currentMode);
      updateDisplays();
    };

    window.forceSendPTT = function() {
      if (currentMode !== 2) {
        switchMode(2);
      }
      flushAndTranscribe();
    };

    initG2();
  </script>
</body>
</html>
