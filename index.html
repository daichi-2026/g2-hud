<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>EVEN G2 Translator App</title>
  <style>
    body {
      background-color: #111;
      color: #00FF00;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      user-select: none;
    }
    .glass-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #333;
      padding-right: 20px;
    }
    .mode-tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      width: 576px;
    }
    .mode-tab {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #00AA00;
      color: #00FF00;
      padding: 6px 2px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    .mode-tab.active {
      background: #00FF00;
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }
    #glass-display {
      width: 576px;
      height: 288px;
      background-color: #000;
      border: 3px solid #00FF00;
      border-radius: 8px;
      box-sizing: border-box;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .hud-mode-screen {
      display: none;
      height: 100%;
      flex-direction: column;
    }
    .hud-mode-screen.active {
      display: flex;
    }
    .text-scroll-area {
      flex: 1;
      overflow: hidden;
      margin-top: 4px;
    }
    .control-panel {
      width: 400px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #ccc;
      font-size: 13px;
      overflow-y: auto;
    }
    .control-panel h2 { color: #00FF00; font-size: 16px; margin: 0 0 5px 0; display: flex; align-items: center; justify-content: space-between; }
    .version-badge {
      background: #00FF00;
      color: #000;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }
    input, button {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    button { background: #00aa00; color: #fff; font-weight: bold; cursor: pointer; border: none; padding: 8px; }
    button:hover { background: #00dd00; color: #000; }
    .nav-btn {
      background: #333;
      border: 1px solid #00FF00;
      color: #00FF00;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .nav-btn:active { background: #00FF00; color: #000; }
    .status { font-size: 11px; color: #888; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

  <div class="glass-container">
    <div class="mode-tab-bar">
      <div id="tab1" class="mode-tab active" onclick="switchMode(1)">1: 自動トリガー</div>
      <div id="tab2" class="mode-tab" onclick="switchMode(2)">2: PTT (押して送信)</div>
    </div>

    <div id="glass-display">
      <div id="mode1Screen" class="hud-mode-screen active">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="color:#00FF00; font-size:10px; font-weight:bold;">自動トリガー (↑/↓キーまたはボタンでページ切替)</div>
          <div>
            <button type="button" class="nav-btn" id="m1-prev-btn">▲ 前へ</button>
            <button type="button" class="nav-btn" id="m1-next-btn">▼ 次へ</button>
          </div>
        </div>
        <div id="m1-status" style="color:#888; font-size:11px; margin-top:2px;">音声入力待機中...</div>
        <div class="text-scroll-area">
          <div id="m1-text" style="color:#fff; font-size:12px; font-weight:bold; white-space:pre-wrap;">-</div>
        </div>
      </div>

      <div id="mode2Screen" class="hud-mode-screen">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="color:#00BFFF; font-size:10px; font-weight:bold;">PTT 翻訳 (↑/↓キーまたはボタンでページ切替)</div>
          <div>
            <button type="button" class="nav-btn" id="m2-prev-btn">▲ 前へ</button>
            <button type="button" class="nav-btn" id="m2-next-btn">▼ 次へ</button>
          </div>
        </div>
        <div id="m2-status" style="color:#888; font-size:11px; margin-top:2px;">ボタンで音声送信</div>
        <div class="text-scroll-area">
          <div id="m2-text" style="color:#fff; font-size:12px; font-weight:bold; white-space:pre-wrap;">-</div>
        </div>
      </div>
    </div>
  </div>

  <div class="control-panel">
    <h2>
      <span>G2 音声翻訳＆返答アシスト</span>
      <span class="version-badge" id="versionBadge">v3.2</span>
    </h2>
    <div>
      <label>OpenAI API Key (Whisper/GPT用):</label>
      <input type="password" id="apiKey" placeholder="sk-..." style="width:100%; box-sizing:border-box;" />
    </div>
    
    <div>
      <label>マイク感度閾値 (音量閾値): <span id="thresholdVal">250</span></label>
      <input type="range" id="noiseThreshold" min="50" max="2000" value="250" style="width:100%;" oninput="document.getElementById('thresholdVal').innerText = this.value" />
    </div>

    <div>
      <label>無音判定タイマー (秒): <span id="silenceSecVal">0.05</span>秒</label>
      <input type="range" id="silenceSec" min="0.05" max="3.00" step="0.05" value="0.05" style="width:100%;" oninput="document.getElementById('silenceSecVal').innerText = parseFloat(this.value).toFixed(2)" />
      <div style="font-size:10px; color:#888;">※最速設定: 0.05秒（息継ぎや小さな間で即座に送信）</div>
    </div>

    <div style="border-top:1px solid #333; margin:5px 0;"></div>
    <button onclick="forceSendPTT()" style="background:#0088cc;">🎤 PTT 手動送信（画面2用）</button>
    <button onclick="clearHistory()" style="background:#cc3333; margin-top:5px;">🗑️ 履歴をクリア</button>
    
    <div style="border-top:1px solid #333; margin:5px 0;"></div>
    <div style="font-weight:bold; color:#00FF00;">【ログ・ステータス】</div>
    <div id="status" class="status">SDK接続待機中...</div>
  </div>

  <script type="module">
    import {
      waitForEvenAppBridge,
      TextContainerProperty,
      CreateStartUpPageContainer,
      TextContainerUpgrade,
      OsEventTypeList
    } from 'https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk/+esm';

    const APP_VERSION = "v3.2 (手動固定表示版)";

    let bridge = null;
    let currentMode = 1;

    let activePcmChunks = [];
    let activeTotalBytes = 0;
    
    let preRingBuffer = [];
    const MAX_PRE_BUFFER = 3;

    let isProcessing = false;
    let silenceTimer = null;

    let historyList = [];
    let historyIndex = 0; // 初期状態から1ページ目を保持

    function getDisplayText() {
      if (historyList.length === 0) {
        return currentMode === 1 
          ? "音声入力待機中...\n（相手の発言を検知すると自動表示されます）" 
          : "タップ操作で音声送信\n（ボタンを押して会話を開始）";
      }
      
      // インデックスの安全チェック（範囲内に強制修復）
      if (historyIndex < 0) historyIndex = 0;
      if (historyIndex >= historyList.length) historyIndex = historyList.length - 1;

      const item = historyList[historyIndex];
      const navInfo = `[${historyIndex + 1}/${historyList.length}] -------------------\n`;
      return navInfo + item;
    }

    function normalizePcm(pcmData) {
      if (!pcmData) return null;
      if (typeof pcmData === 'string') {
        const binary = atob(pcmData);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }
      if (pcmData instanceof Uint8Array) return pcmData;
      if (pcmData instanceof ArrayBuffer) return new Uint8Array(pcmData);
      if (Array.isArray(pcmData)) return new Uint8Array(pcmData);
      if (ArrayBuffer.isView(pcmData)) return new Uint8Array(pcmData.buffer, pcmData.byteOffset, pcmData.byteLength);
      return null;
    }

    function calculateRMS(uint8Array) {
      if (!uint8Array || uint8Array.length < 2) return 0;
      const dataView = new DataView(uint8Array.buffer, uint8Array.byteOffset, uint8Array.byteLength);
      let sum = 0;
      const samples = Math.floor(uint8Array.byteLength / 2);
      for (let i = 0; i < samples; i++) {
        const sample = dataView.getInt16(i * 2, true);
        sum += sample * sample;
      }
      return Math.sqrt(sum / samples);
    }

    function createWavBlob(chunks, dataSize) {
      const sampleRate = 16000;
      const numChannels = 1;
      const bitsPerSample = 16;
      
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, 'WAVE');

      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * numChannels * (bitsPerSample / 8), true);
      view.setUint16(32, numChannels * (bitsPerSample / 8), true);
      view.setUint16(34, bitsPerSample, true);

      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (const chunk of chunks) {
        new Uint8Array(buffer, offset, chunk.byteLength).set(chunk);
        offset += chunk.byteLength;
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    function isNoiseOrFiller(text) {
      if (!text) return true;
      const clean = text.trim();
      if (clean.length <= 1) return true;

      const cleanLower = clean.toLowerCase();
      const strictHallucinations = [
        'thank you for watching',
        'thanks for watching',
        'subtitles by',
        'amara.org'
      ];

      if (strictHallucinations.some(p => cleanLower === p)) return true;

      return false;
    }

    async function flushAndTranscribe() {
      if (silenceTimer) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }

      if (isProcessing) return;

      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        setStatus('⚠️ エラー: API Keyを入力してください');
        activePcmChunks = [];
        activeTotalBytes = 0;
        return;
      }

      if (activeTotalBytes < 1600) {
        setStatus(`データ不足のためスキップ (${activeTotalBytes} bytes)`);
        return;
      }

      isProcessing = true;
      const chunksToProcess = [...activePcmChunks];
      const bytesToProcess = activeTotalBytes;
      
      activePcmChunks = [];
      activeTotalBytes = 0;

      try {
        setStatus(`Whisperへ送信中... (${Math.round(bytesToProcess / 1024)}KB)`);
        const wavBlob = createWavBlob(chunksToProcess, bytesToProcess);
        
        const formData = new FormData();
        formData.append('file', wavBlob, 'audio.wav');
        formData.append('model', 'whisper-1');
        formData.append('language', 'en');
        formData.append('temperature', '0');

        const promptText = "It's already late August, but it's still so hot. Everyday conversation about weather, greetings, and daily life.";
        formData.append('prompt', promptText);

        const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${apiKey}` },
          body: formData
        });

        if (!response.ok) {
          const errJson = await response.json().catch(() => ({}));
          throw new Error(errJson.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        let newEnText = data.text ? data.text.trim() : '';

        if (!isNoiseOrFiller(newEnText)) {
          setStatus(`相手発言を即時翻訳中...`);
          let jaTranslation = "";
          try {
            const transResponse = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                temperature: 0.1,
                messages: [
                  { role: 'system', content: '入力された英語を自然で簡潔な日本語に直訳してください。翻訳文のみ出力すること。' },
                  { role: 'user', content: newEnText }
                ]
              })
            });
            if (transResponse.ok) {
              const transData = await transResponse.json();
              jaTranslation = transData.choices[0].message.content.trim();
            }
          } catch(e) {
            console.warn("翻訳エラー:", e);
          }

          let currentContent = `【相手】\n${newEnText}\n${jaTranslation}\n-------------------\n【返答ヒント】\n生成中...`;
          
          historyList.push(currentContent);
          if (historyList.length > 10) historyList.shift();

          const targetItemIndex = historyList.length - 1;

          // ★ historyIndex の自動追従・上書きを完全に排除（手動操作で選ばれたインデックス位置を100%維持）
          await updateDisplays();
          setStatus(`新着履歴追加 [${historyList.length}件] - 【返答ヒント】生成中...`);

          const chatResponse = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: 'gpt-4o-mini',
              temperature: 0.2,
              max_tokens: 200,
              stream: true,
              messages: [
                {
                  role: 'system',
                  content: `あなたはスマートグラス用の通訳・回答アシスタントです。入力された英語に対する【返答ヒント】のみを以下の3行フォーマットで出力してください。

(自然で短めの英語一文)
(カタカナフリガナ)
(日本語訳)`
                },
                { role: 'user', content: newEnText }
              ]
            })
          });

          if (!chatResponse.ok) {
            const errJson = await chatResponse.json().catch(() => ({}));
            throw new Error(errJson.error?.message || `GPT HTTP ${chatResponse.status}`);
          }

          const reader = chatResponse.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let hintText = "";
          let lastRenderTime = Date.now();

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split("\n");

            for (const line of lines) {
              if (line.startsWith("data: ") && line !== "data: [DONE]") {
                try {
                  const json = JSON.parse(line.slice(6));
                  const token = json.choices[0]?.delta?.content || "";
                  hintText += token;

                  const nowRender = Date.now();
                  if (nowRender - lastRenderTime > 80) {
                    historyList[targetItemIndex] = `【相手】\n${newEnText}\n${jaTranslation}\n-------------------\n【返答ヒント】\n${hintText}`;
                    await updateDisplays();
                    lastRenderTime = nowRender;
                  }
                } catch (e) {
                  // 無視
                }
              }
            }
          }

          historyList[targetItemIndex] = `【相手】\n${newEnText}\n${jaTranslation}\n-------------------\n【返答ヒント】\n${hintText.trim()}`;
          await updateDisplays();
          setStatus('次を待機中...');

        } else {
          setStatus(`ノイズ除去: "${newEnText}" -> 次を待機中`);
        }
      } catch (e) {
        console.error(e);
        setStatus('エラー: ' + e.message);
      } finally {
        isProcessing = false;

        if (activeTotalBytes > 0) {
          const silenceMs = Math.max(50, parseFloat(document.getElementById('silenceSec').value) * 1000);
          silenceTimer = setTimeout(() => {
            if (currentMode === 1 && !isProcessing) {
              flushAndTranscribe();
            }
          }, silenceMs);
        }
      }
    }

    function handleAudioData(normalized) {
      const rms = calculateRMS(normalized);
      const threshold = parseFloat(document.getElementById('noiseThreshold').value) || 250;

      if (rms >= threshold) {
        if (activePcmChunks.length === 0 && preRingBuffer.length > 0) {
          for (const preChunk of preRingBuffer) {
            activePcmChunks.push(preChunk);
            activeTotalBytes += preChunk.length;
          }
          preRingBuffer = [];
        }

        activePcmChunks.push(normalized);
        activeTotalBytes += normalized.length;

        if (currentMode === 1 && !isProcessing) {
          setStatus(`音声検知中... (${Math.round(activeTotalBytes/1024)}KB) [音量:${Math.round(rms)}]`);

          if (silenceTimer) clearTimeout(silenceTimer);
          
          const silenceMs = Math.max(50, parseFloat(document.getElementById('silenceSec').value) * 1000);
          silenceTimer = setTimeout(() => {
            if (currentMode === 1 && !isProcessing) {
              flushAndTranscribe();
            }
          }, silenceMs);
        }
      } else {
        if (activePcmChunks.length === 0) {
          preRingBuffer.push(normalized);
          if (preRingBuffer.length > MAX_PRE_BUFFER) {
            preRingBuffer.shift();
          }
        }

        if (currentMode === 1 && activeTotalBytes > 0 && !isProcessing) {
          setStatus(`無音判定中... (${Math.round(activeTotalBytes/1024)}KB) [音量:${Math.round(rms)}]`);
        }
      }
    }

    async function updateDisplays() {
      const displayText = getDisplayText();
      document.getElementById('m1-text').innerText = displayText;
      document.getElementById('m2-text').innerText = displayText;
      await sendToG2Display(displayText);
    }

    function prevPage() {
      if (historyList.length === 0) return;
      if (historyIndex > 0) {
        historyIndex--;
        updateDisplays();
        setStatus(`ページ移動: [${historyIndex + 1}/${historyList.length}]`);
      } else {
        setStatus(`これ以上前の履歴はありません [1/${historyList.length}]`);
      }
    }

    function nextPage() {
      if (historyList.length === 0) return;
      if (historyIndex < historyList.length - 1) {
        historyIndex++;
        updateDisplays();
        setStatus(`ページ移動: [${historyIndex + 1}/${historyList.length}]`);
      } else {
        setStatus(`最新の履歴を表示中です [${historyList.length}/${historyList.length}]`);
      }
    }

    // ボタン直接バインド
    document.getElementById('m1-prev-btn').addEventListener('click', (e) => { e.preventDefault(); prevPage(); });
    document.getElementById('m1-next-btn').addEventListener('click', (e) => { e.preventDefault(); nextPage(); });
    document.getElementById('m2-prev-btn').addEventListener('click', (e) => { e.preventDefault(); prevPage(); });
    document.getElementById('m2-next-btn').addEventListener('click', (e) => { e.preventDefault(); nextPage(); });

    window.clearHistory = async function() {
      historyList = [];
      historyIndex = 0;
      activePcmChunks = [];
      activeTotalBytes = 0;
      preRingBuffer = [];
      await updateDisplays();
      setStatus('履歴をクリアしました');
    };

    // キーボード操作対応 (↑: 前へ / ↓: 次へ)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        prevPage();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        nextPage();
      }
    });

    async function initG2() {
      try {
        setStatus(`G2ブリッジ接続中... [${APP_VERSION}]`);
        bridge = await waitForEvenAppBridge();
        
        const mainText = new TextContainerProperty({
          xPosition: 0,
          yPosition: 0,
          width: 576,
          height: 288,
          borderWidth: 0,
          borderColor: 5,
          paddingLength: 4,
          containerID: 1,
          containerName: 'hud_main',
          content: getDisplayText(),
          isEventCapture: 1,
        });

        await bridge.createStartUpPageContainer(
          new CreateStartUpPageContainer({
            containerTotalNum: 1,
            textObject: [mainText],
          })
        );

        await bridge.audioControl(true);
        setStatus(`G2 SDK 接続完了 (${APP_VERSION}) / マイクON`);

        bridge.onEvenHubEvent(async event => {
          const rawPcm = event.audioEvent?.audioPcm;
          if (rawPcm) {
            const normalized = normalizePcm(rawPcm);
            if (normalized && normalized.length > 0) {
              handleAudioData(normalized);
            }
          }

          const sysType = event.sysEvent?.eventType;
          const textType = event.textEvent?.eventType;

          if (sysType === OsEventTypeList.CLICK_EVENT || textType === OsEventTypeList.CLICK_EVENT) {
            if (currentMode === 2) {
              flushAndTranscribe();
            }
          }

          const evt = sysType || textType;

          // スマートグラスのタッチ・フリック操作割り当て
          if (evt === OsEventTypeList.UP_EVENT || evt === OsEventTypeList.SCROLL_UP_EVENT || evt === OsEventTypeList.FLICK_UP_EVENT) {
            prevPage();
          }
          if (evt === OsEventTypeList.DOWN_EVENT || evt === OsEventTypeList.SCROLL_DOWN_EVENT || evt === OsEventTypeList.FLICK_DOWN_EVENT) {
            nextPage();
          }
        });

      } catch (e) {
        setStatus("SDK接続エラー: " + e.message);
      }
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    async function sendToG2Display(text) {
      if (!bridge) return;
      try {
        await bridge.textContainerUpgrade(
          new TextContainerUpgrade({
            containerID: 1,
            containerName: 'hud_main',
            content: text,
          })
        );
      } catch (e) {
        console.error("Display update failed:", e);
      }
    }

    function updateUIOnly(mode) {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab' + mode);
      if (activeTab) activeTab.classList.add('active');

      document.querySelectorAll('.hud-mode-screen').forEach(s => s.classList.remove('active'));
      const activeScreen = document.getElementById('mode' + mode + 'Screen');
      if (activeScreen) activeScreen.classList.add('active');
    }

    window.switchMode = function(mode) {
      currentMode = mode;
      activePcmChunks = [];
      activeTotalBytes = 0;
      preRingBuffer = [];
      isProcessing = false;
      if (silenceTimer) clearTimeout(silenceTimer);
      updateUIOnly(currentMode);
      updateDisplays();
    };

    window.forceSendPTT = function() {
      if (currentMode !== 2) {
        switchMode(2);
      }
      flushAndTranscribe();
    };

    initG2();
  </script>
</body>
</html>
