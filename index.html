<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リアルタイム文字起こし・翻訳通訳アシスタント V4.2 (G2対応)</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
    background-color: #f4f4f9;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 15px;
  }
  .control-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
    background: #eee;
    padding: 15px;
    border-radius: 6px;
  }
  .control-panel div {
    display: flex;
    flex-direction: column;
  }
  label {
    font-size: 0.85rem;
    font-weight: bold;
    margin-bottom: 3px;
  }
  input, select, button {
    padding: 8px;
    font-size: 0.9rem;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
  button {
    cursor: pointer;
    background-color: #007bff;
    color: white;
    border: none;
    font-weight: bold;
  }
  button:hover {
    background-color: #0056b3;
  }
  button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
  }
  .status {
    margin-bottom: 15px;
    font-weight: bold;
    color: #333;
  }
  .display-box {
    background: #222;
    color: #00ffcc;
    font-family: monospace;
    font-size: 1.1rem;
    padding: 15px;
    border-radius: 6px;
    min-height: 240px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .nav-buttons {
    margin-top: 10px;
    display: flex;
    gap: 10px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>リアルタイム文字起こし・翻訳通訳アシスタント V4.2</h1>

  <div class="control-panel">
    <div>
      <label>Deepgram API Key (文字起こし):</label>
      <input type="password" id="deepgramKey" placeholder="Deepgram Key" />
    </div>
    <div>
      <label>DeepL API Key (翻訳):</label>
      <input type="password" id="deeplKey" placeholder="DeepL Key (:fx 含む)" />
    </div>
    <div>
      <label>OpenAI API Key (返答ヒント用・任意):</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
    </div>
    <div>
      <label>無音判定時間 (秒):</label>
      <input type="number" id="silenceSec" value="1.2" step="0.1" min="0.5" />
    </div>
    <div style="grid-column: span 2;">
      <label>操作:</label>
      <div style="display:flex; gap:10px;">
        <button id="startBtn" style="flex:1;">録音開始</button>
        <button id="stopBtn" disabled style="flex:1; background-color:#dc3545;">録音停止</button>
      </div>
    </div>
  </div>

  <div class="status" id="statusText">ステータス: 待機中 (V4.2)</div>

  <!-- メイン表示領域 兼 G2グラス転送用要素 -->
  <div class="display-box" id="displayBox">ここに会話と翻訳、返答ヒントが表示されます...</div>

  <div class="nav-buttons">
    <button id="prevBtn">＜ 前へ</button>
    <button id="nextBtn">次へ ＞</button>
  </div>
</div>

<script>
// ==========================================
// グローバル変数・状態管理
// ==========================================
let audioContext = null;
let mediaStream = null;
let scriptProcessor = null;

let isRecording = false;
let isProcessing = false;
let isPartialTranscribing = false;

let activePcmChunks = [];
let activeTotalBytes = 0;
let silenceTimer = null;
let lastPartialBytes = 0;

let historyList = [];
let historyIndex = -1;
let currentActiveIndex = -1;
let currentMode = 0; // 0: 無音待機, 1: 発話中

// Node / HTML要素
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const statusText = document.getElementById('statusText');
const displayBox = document.getElementById('displayBox');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

// イベントリスナー
startBtn.addEventListener('click', startRecording);
stopBtn.addEventListener('click', stopRecording);
prevBtn.addEventListener('click', showPrevHistory);
nextBtn.addEventListener('click', showNextHistory);

function setStatus(msg) {
  statusText.innerText = 'ステータス: ' + msg;
}

function isNoiseOrFiller(text) {
  if (!text) return true;
  const clean = text.trim().toLowerCase().replace(/[^a-z]/g, '');
  const fillers = ['thankyou', 'thanks', 'you', 'mb', 'bye', 'am', 'so'];
  return clean.length <= 2 || fillers.includes(clean);
}

// ==========================================
// G2グラスディスプレイ表示更新処理
// ==========================================
function updateDisplays() {
  if (historyList.length === 0) {
    const defaultMsg = "会話データがありません";
    displayBox.innerText = defaultMsg;
    sendToG2Glass(defaultMsg);
    return;
  }

  if (currentActiveIndex !== -1) {
    historyIndex = currentActiveIndex;
  } else if (historyIndex === -1 || historyIndex >= historyList.length) {
    historyIndex = historyList.length - 1;
  }

  const activeText = historyList[historyIndex];
  
  // 1. メイン画面出力
  displayBox.innerText = activeText;

  // 2. G2グラス側へデータ伝達 (Even Realities App / WebSocket / WebBridge)
  sendToG2Glass(activeText);
}

function sendToG2Glass(text) {
  // G2側が参照するグローバル変数およびカスタムイベントの発行
  window.g2DisplayText = text;
  
  const event = new CustomEvent('g2UpdateText', { detail: { text: text } });
  window.dispatchEvent(event);

  // WebSocket等でG2ブリッジと通信している環境への対応
  if (window.g2Socket && window.g2Socket.readyState === WebSocket.OPEN) {
    window.g2Socket.send(JSON.stringify({ type: 'display', text: text }));
  }
}

// ==========================================
// WAVヘッダー作成
// ==========================================
function createWavBlob(pcmChunks, totalBytes) {
  const sampleRate = audioContext.sampleRate;
  const wavBuffer = new ArrayBuffer(44 + totalBytes);
  const view = new DataView(wavBuffer);

  function writeString(offset, string) {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + totalBytes, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, 1, true); // Mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true); // 16bit
  writeString(36, 'data');
  view.setUint32(40, totalBytes, true);

  let offset = 44;
  for (const chunk of pcmChunks) {
    const uint8 = new Uint8Array(chunk.buffer, chunk.byteOffset, chunk.byteLength);
    new Uint8Array(wavBuffer, offset).set(uint8);
    offset += chunk.byteLength;
  }

  return new Blob([wavBuffer], { type: 'audio/wav' });
}

// ==========================================
// API 1: Deepgram (文字起こし)
// ==========================================
async function transcribeAudioWithDeepgram(wavBlob) {
  const deepgramKey = document.getElementById('deepgramKey').value.trim();
  if (!deepgramKey) throw new Error("Deepgram API Keyが未設定です");

  const url = 'https://api.deepgram.com/v1/listen?model=nova-2&language=en&punctuate=true';

  const response = await fetch(url, {
    method: 'POST',
    headers: {
      'Authorization': `Token ${deepgramKey}`,
      'Content-Type': 'audio/wav'
    },
    body: wavBlob
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.reason || `Deepgram Error (${response.status})`);
  }

  const data = await response.json();
  return (data.results?.channels[0]?.alternatives[0]?.transcript || '').trim();
}

// ==========================================
// API 2: DeepL (翻訳)
// ==========================================
async function translateTextWithDeepL(text) {
  const deeplKey = document.getElementById('deeplKey').value.trim();
  if (!deeplKey) return "（DeepL Key未設定のため翻訳省略）";

  const isFree = deeplKey.endsWith(':fx');
  const endpoint = isFree
    ? 'https://api-free.deepl.com/v2/translate'
    : 'https://api.deepl.com/v2/translate';

  try {
    // 直送り試行
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Authorization': `DeepL-Auth-Key ${deeplKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        text: [text],
        target_lang: 'JA'
      })
    });

    if (response.ok) {
      const data = await response.json();
      return data.translations[0]?.text || '';
    }

    // CORS制限等で失敗した場合のフォームフォールバック
    const params = new URLSearchParams();
    params.append('auth_key', deeplKey);
    params.append('text', text);
    params.append('target_lang', 'JA');

    const resForm = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params
    });

    if (resForm.ok) {
      const dataForm = await resForm.json();
      return dataForm.translations[0]?.text || '';
    }
  } catch (e) {
    console.warn("DeepL Direct Error, trying proxy:", e);
  }

  // プロキシ経由
  try {
    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(endpoint);
    const params = new URLSearchParams();
    params.append('auth_key', deeplKey);
    params.append('text', text);
    params.append('target_lang', 'JA');

    const resProxy = await fetch(proxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params
    });

    if (resProxy.ok) {
      const dataProxy = await resProxy.json();
      return dataProxy.translations[0]?.text || '';
    }
  } catch(e) {
    console.error("DeepL Proxy Error:", e);
  }

  return "（DeepL翻訳エラー: Key確認または制限）";
}

// ==========================================
// API 3: OpenAI (返答ヒント)
// ==========================================
async function generateResponseHint(enText) {
  const openAiKey = document.getElementById('apiKey').value.trim();
  if (!openAiKey) return "（OpenAI Key未設定のためヒント省略）";

  try {
    const chatResponse = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${openAiKey}`
      },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        temperature: 0.2,
        max_tokens: 200,
        messages: [
          {
            role: 'system',
            content: `あなたはスマートグラス用の通訳・回答アシスタントです。入力された英語に対する【返答ヒント】のみを以下の3行フォーマットで出力してください。\n\n(自然で短めの英語一文)\n(カタカナフリガナ)\n(日本語訳)`
          },
          { role: 'user', content: enText }
        ]
      })
    });

    if (chatResponse.ok) {
      const chatData = await chatResponse.json();
      return chatData.choices[0]?.message?.content?.trim() || "（ヒント生成失敗）";
    }
  } catch (e) {
    console.warn("GPTヒント生成エラー:", e);
  }
  return "（ヒント生成エラー）";
}

// ==========================================
// 録音 & リアルタイム音声処理
// ==========================================
async function startRecording() {
  const deepgramKey = document.getElementById('deepgramKey').value.trim();
  if (!deepgramKey) {
    alert("録音を開始するにはDeepgram API Keyが必要です。");
    return;
  }

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    
    const source = audioContext.createMediaStreamSource(mediaStream);
    scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

    scriptProcessor.onaudioprocess = processAudio;
    source.connect(scriptProcessor);
    scriptProcessor.connect(audioContext.destination);

    isRecording = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    setStatus("録音中... 発話待機中");
  } catch (e) {
    alert("マイクの起動に失敗しました: " + e.message);
  }
}

function stopRecording() {
  isRecording = false;
  if (scriptProcessor) scriptProcessor.disconnect();
  if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
  if (audioContext) audioContext.close();

  startBtn.disabled = false;
  stopBtn.disabled = true;
  setStatus("停止中");
}

function processAudio(e) {
  if (!isRecording) return;

  const inputData = e.inputBuffer.getChannelData(0);
  
  let sum = 0;
  for (let i = 0; i < inputData.length; i++) {
    sum += inputData[i] * inputData[i];
  }
  const rms = Math.sqrt(sum / inputData.length);
  const threshold = 0.02;

  const pcm16 = new Int16Array(inputData.length);
  for (let i = 0; i < inputData.length; i++) {
    const s = Math.max(-1, Math.min(1, inputData[i]));
    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }

  if (rms > threshold) {
    activePcmChunks.push(pcm16);
    activeTotalBytes += pcm16.byteLength;

    if (currentMode === 0) {
      currentMode = 1;
      setStatus("音声検知中 (発話中)...");
    }

    if (silenceTimer) {
      clearTimeout(silenceTimer);
      silenceTimer = null;
    }

    if (activeTotalBytes - lastPartialBytes > 32000 && !isPartialTranscribing) {
      requestPartialTranscribe();
    }
  } else {
    if (currentMode === 1) {
      activePcmChunks.push(pcm16);
      activeTotalBytes += pcm16.byteLength;

      if (!silenceTimer) {
        const silenceMs = Math.max(500, parseFloat(document.getElementById('silenceSec').value) * 1000);
        silenceTimer = setTimeout(() => {
          currentMode = 0;
          flushAndTranscribe();
        }, silenceMs);
      }
    }
  }
}

async function requestPartialTranscribe() {
  if (isPartialTranscribing || activeTotalBytes < 16000) return;

  isPartialTranscribing = true;
  const snapshotChunks = [...activePcmChunks];
  const snapshotBytes = activeTotalBytes;
  lastPartialBytes = snapshotBytes;

  try {
    const wavBlob = createWavBlob(snapshotChunks, snapshotBytes);
    const partialText = await transcribeAudioWithDeepgram(wavBlob);

    if (partialText && !isNoiseOrFiller(partialText)) {
      const content = `【相手 (リアルタイム入力中...)】\n${partialText}...\n-------------------\n【返答ヒント】\n（発言終了後に生成されます）`;
      
      if (currentActiveIndex === -1) {
        historyList.push(content);
        if (historyList.length > 10) historyList.shift();
        currentActiveIndex = historyList.length - 1;
      } else {
        historyList[currentActiveIndex] = content;
      }
      updateDisplays();
      setStatus(`リアルタイム認識中: "${partialText}"`);
    }
  } catch(e) {
    console.warn("部分認識スルー:", e);
  } finally {
    isPartialTranscribing = false;
  }
}

async function flushAndTranscribe() {
  if (silenceTimer) {
    clearTimeout(silenceTimer);
    silenceTimer = null;
  }

  if (isProcessing) return;

  if (activeTotalBytes < 3200) {
    activePcmChunks = [];
    activeTotalBytes = 0;
    currentActiveIndex = -1;
    setStatus("待機中 (短い音声をスキップ)");
    return;
  }

  isProcessing = true;
  const chunksToProcess = [...activePcmChunks];
  const bytesToProcess = activeTotalBytes;

  activePcmChunks = [];
  activeTotalBytes = 0;
  lastPartialBytes = 0;
  const workingIndex = currentActiveIndex;
  currentActiveIndex = -1;

  try {
    setStatus(`全音声確定・文字起こし中...`);
    const wavBlob = createWavBlob(chunksToProcess, bytesToProcess);
    
    // 1. Deepgram
    const newEnText = await transcribeAudioWithDeepgram(wavBlob);

    if (!isNoiseOrFiller(newEnText)) {
      setStatus(`翻訳＆返答ヒント生成中...`);
      
      // 2. DeepL
      const jaTranslation = await translateTextWithDeepL(newEnText);

      let currentContent = `【相手】\n${newEnText}\n${jaTranslation}\n-------------------\n【返答ヒント】\n生成中...`;
      
      let targetItemIndex = workingIndex;
      if (targetItemIndex >= 0 && targetItemIndex < historyList.length) {
        historyList[targetItemIndex] = currentContent;
      } else {
        historyList.push(currentContent);
        if (historyList.length > 10) historyList.shift();
        targetItemIndex = historyList.length - 1;
      }

      updateDisplays();

      // 3. OpenAI GPT
      const hintText = await generateResponseHint(newEnText);

      // 最終更新
      historyList[targetItemIndex] = `【相手】\n${newEnText}\n${jaTranslation}\n-------------------\n【返答ヒント】\n${hintText}`;
      updateDisplays();
      setStatus(`次を待機中... (表示: [${historyIndex + 1}/${historyList.length}])`);

    } else {
      if (workingIndex >= 0 && workingIndex < historyList.length) {
        historyList.splice(workingIndex, 1);
        updateDisplays();
      }
      setStatus(`ノイズ除去: "${newEnText}" -> 待機中`);
    }
  } catch (e) {
    console.error(e);
    setStatus('エラー: ' + e.message);
  } finally {
    isProcessing = false;
  }
}

function showPrevHistory() {
  if (historyList.length === 0) return;
  if (historyIndex > 0) {
    historyIndex--;
    updateDisplays();
    setStatus(`過去ログ表示中 [${historyIndex + 1}/${historyList.length}]`);
  }
}

function showNextHistory() {
  if (historyList.length === 0) return;
  if (historyIndex < historyList.length - 1) {
    historyIndex++;
    updateDisplays();
    setStatus(`過去ログ表示中 [${historyIndex + 1}/${historyList.length}]`);
  }
}
</script>

</body>
</html>
