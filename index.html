<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>EVEN G2 Translator App (v5.06 Custom Profile)</title>
  <style>
    body {
      background-color: #111;
      color: #00FF00;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .glass-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #333;
      padding-right: 20px;
    }
    .mode-tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      width: 576px;
    }
    .mode-tab {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #00AA00;
      color: #00FF00;
      padding: 6px 2px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    .mode-tab.active {
      background: #00FF00;
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }
    #glass-display {
      width: 576px;
      height: 288px;
      background-color: #000;
      border: 3px solid #00FF00;
      border-radius: 8px;
      box-sizing: border-box;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      gap: 4px;
    }
    .hud-mode-screen {
      display: none;
      height: 100%;
      flex-direction: column;
    }
    .hud-mode-screen.active {
      display: flex;
    }
    .preview-box {
      border: 1px dashed #333;
      border-radius: 4px;
      padding: 6px;
      background: #050505;
      display: flex;
      flex-direction: column;
    }
    .control-panel {
      width: 420px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: #ccc;
      font-size: 12px;
      overflow-y: auto;
    }
    .control-panel h2 { color: #00FF00; font-size: 15px; margin: 0 0 5px 0; display: flex; align-items: center; justify-content: space-between; }
    .version-badge {
      background: #00FF00;
      color: #000;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }
    input, textarea, button {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 5px;
      border-radius: 4px;
      font-size: 12px;
    }
    textarea {
      resize: vertical;
      font-family: inherit;
    }
    button { background: #00aa00; color: #fff; font-weight: bold; cursor: pointer; border: none; padding: 7px; }
    button:hover { background: #00dd00; color: #000; }
    .nav-btn {
      background: #333;
      border: 1px solid #00FF00;
      color: #00FF00;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
    }
    .nav-btn:hover { background: #00FF00; color: #000; }
    .status { font-size: 11px; color: #aaa; white-space: pre-wrap; word-break: break-all; }

    .error-log-box {
      background: #080000;
      border: 1px solid #33ff33;
      color: #66ff66;
      font-family: monospace;
      font-size: 10px;
      height: 100px;
      overflow-y: auto;
      padding: 6px;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body tabindex="0">

  <div class="glass-container">
    <div class="mode-tab-bar">
      <div id="tab1" class="mode-tab active" onclick="switchMode(1)">1: 連続即時描画</div>
      <div id="tab2" class="mode-tab" onclick="switchMode(2)">2: PTT (押して送信)</div>
    </div>

    <div id="glass-display">
      <div id="mode1Screen" class="hud-mode-screen active" style="height:100%; flex-direction:column; gap:4px;">
        <div style="display:flex; justify-content:space-between; align-items:center; font-size:10px;">
          <span style="color:#00FF00; font-weight:bold;">[上段] 英語リアルタイム枠 (↑/↓ 履歴)</span>
          <div>
            <button class="nav-btn" onclick="navigateHistory('up')">▲前</button>
            <button class="nav-btn" onclick="navigateHistory('down')">▼次</button>
          </div>
        </div>
        <div class="preview-box" style="height: 115px;">
          <div style="font-size:9px; color:#888;">【相手の英語 (Deepgram)】</div>
          <div id="preview-en" style="color:#00FF00; font-size:11px; font-weight:bold; overflow-y:auto; flex:1; white-space:pre-wrap;">(音声待機中...)</div>
        </div>
        <div class="preview-box" style="height: 135px;">
          <div style="font-size:9px; color:#888;">【日本語訳 (Google Translate) ＆ 返答ヒント (OpenAI)】</div>
          <div id="preview-ja" style="color:#fff; font-size:11px; overflow-y:auto; flex:1; white-space:pre-wrap;">(翻訳待機中...)</div>
        </div>
      </div>
    </div>
  </div>

  <div class="control-panel">
    <h2>
      <span>G2 音声翻訳＆返答アシスト</span>
      <span class="version-badge" id="versionBadge">v5.06 Tagging</span>
    </h2>
    <div>
      <label>Google Translate API Key (和訳用):</label>
      <input type="password" id="googleKey" placeholder="AIzaSy..." style="width:100%; box-sizing:border-box;" />
    </div>
    <div>
      <label>Deepgram API Key (文字起こし):</label>
      <input type="password" id="deepgramKey" placeholder="Deepgram Key" style="width:100%; box-sizing:border-box;" />
    </div>
    <div>
      <label>OpenAI API Key (返答ヒント生成):</label>
      <input type="password" id="apiKey" placeholder="sk-..." style="width:100%; box-sizing:border-box;" />
    </div>

    <!-- 思考プロファイル・キーワード設定枠 -->
    <div>
      <label style="color:#00FF00; font-weight:bold;">思考プロファイル・キーワード (AI連携用):</label>
      <textarea id="userProfile" rows="2" placeholder="例: 経理財務 / 丁寧かつ結論ファースト / 趣味: 読書 / 返答方針: 簡潔に" style="width:100%; box-sizing:border-box;"></textarea>
    </div>
    
    <div style="display:flex; gap:10px;">
      <div style="flex:1;">
        <label>マイク感度: <span id="thresholdVal">80</span></label>
        <input type="range" id="noiseThreshold" min="20" max="1000" value="80" style="width:100%;" oninput="document.getElementById('thresholdVal').innerText = this.value" />
      </div>
      <div style="flex:1;">
        <label>無音タイマー: <span id="silenceSecVal">0.35</span>s</label>
        <input type="range" id="silenceSec" min="0.1" max="1.0" step="0.05" value="0.35" style="width:100%;" oninput="document.getElementById('silenceSecVal').innerText = this.value" />
      </div>
    </div>

    <button onclick="forceSendPTT()" style="background:#0088cc;">🎤 PTT 手動送信 / 強制翻訳実行</button>
    <button onclick="clearHistory()" style="background:#cc3333;">🗑️ 履歴をクリア</button>
    
    <div style="border-top:1px solid #333; margin:2px 0;"></div>
    
    <div style="font-weight:bold; color:#00FF00;">【動作ステータス】</div>
    <div id="status" class="status">SDK接続待機中...</div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
      <span style="font-weight:bold; color:#00FF00;">【詳細デバッグ・エラーログ】</span>
      <button onclick="clearErrorLog()" style="padding:2px 6px; font-size:10px; background:#444;">クリア</button>
    </div>
    <div id="errorLog" class="error-log-box">[System initialized] ログ待機中...</div>
  </div>

  <script type="module">
    import {
      waitForEvenAppBridge,
      TextContainerProperty,
      CreateStartUpPageContainer,
      TextContainerUpgrade,
      OsEventTypeList
    } from 'https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk/+esm';

    const APP_VERSION = "v5.06 Tagging";

    let bridge = null;
    let currentMode = 1;

    let activePcmChunks = [];
    let activeTotalBytes = 0;
    
    let preRingBuffer = [];
    const MAX_PRE_BUFFER = 25; 

    let isProcessing = false;
    let silenceTimer = null;
    let chunkTimer = null;

    let currentEnSession = [];
    let sessionLastTime = 0;

    let historyList = [];
    let historyIndex = -1;

    function initKeyStorage() {
      const gEl = document.getElementById('googleKey');
      const dEl = document.getElementById('deepgramKey');
      const oEl = document.getElementById('apiKey');
      const pEl = document.getElementById('userProfile');

      if (gEl) gEl.value = localStorage.getItem('google_api_key') || '';
      if (dEl) dEl.value = localStorage.getItem('deepgram_api_key') || '';
      if (oEl) oEl.value = localStorage.getItem('openai_api_key') || '';
      if (pEl) pEl.value = localStorage.getItem('user_profile_keywords') || '';

      if (gEl) gEl.addEventListener('input', (e) => localStorage.setItem('google_api_key', e.target.value.trim()));
      if (dEl) dEl.addEventListener('input', (e) => localStorage.setItem('deepgram_api_key', e.target.value.trim()));
      if (oEl) oEl.addEventListener('input', (e) => localStorage.setItem('openai_api_key', e.target.value.trim()));
      if (pEl) pEl.addEventListener('input', (e) => localStorage.setItem('user_profile_keywords', e.target.value));
    }

    function getInputValue(id) {
      const el = document.getElementById(id);
      return el ? el.value.trim() : "";
    }

    function logError(tag, message, detail = null) {
      const timeStr = new Date().toLocaleTimeString();
      const logBox = document.getElementById('errorLog');
      let msg = `[${timeStr}] [${tag}] ${message}`;
      if (detail) {
        msg += typeof detail === 'object' ? `\n  > Detail: ${JSON.stringify(detail)}` : `\n  > Detail: ${detail}`;
      }
      logBox.innerText = msg + "\n---\n" + logBox.innerText;
      console.log(`[${tag}]`, message, detail);
    }

    window.clearErrorLog = function() {
      document.getElementById('errorLog').innerText = "[Cleared]";
    };

    function getCurrentEnText() {
      if (historyList.length === 0) return "(音声入力待機中...)";
      const item = historyList[historyIndex];
      return `[${historyIndex + 1}/${historyList.length}] ${item.en}`;
    }

    function getCurrentJaText() {
      if (historyList.length === 0) return "(翻訳・ヒント待機中...)";
      const item = historyList[historyIndex];
      const ja = item.ja ? `【訳】${item.ja}` : "【訳】（Google翻訳中...）";
      const hint = item.hint ? `【ヒント】\n${item.hint}` : "【ヒント】（AI作成中...）";
      return `${ja}\n-------------------\n${hint}`;
    }

    function normalizePcm(pcmData) {
      if (!pcmData) return null;
      if (typeof pcmData === 'string') {
        const binary = atob(pcmData);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }
      if (pcmData instanceof Uint8Array) return pcmData;
      if (pcmData instanceof ArrayBuffer) return new Uint8Array(pcmData);
      if (Array.isArray(pcmData)) return new Uint8Array(pcmData);
      if (ArrayBuffer.isView(pcmData)) return new Uint8Array(pcmData.buffer, pcmData.byteOffset, pcmData.byteLength);
      return null;
    }

    function calculateRMS(uint8Array) {
      if (!uint8Array || uint8Array.length < 2) return 0;
      const dataView = new DataView(uint8Array.buffer, uint8Array.byteOffset, uint8Array.byteLength);
      let sum = 0;
      const samples = Math.floor(uint8Array.byteLength / 2);
      for (let i = 0; i < samples; i++) {
        const sample = dataView.getInt16(i * 2, true);
        sum += sample * sample;
      }
      return Math.sqrt(sum / samples);
    }

    function createWavBlob(chunks, dataSize) {
      const sampleRate = 16000;
      const numChannels = 1;
      const bitsPerSample = 16;
      
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, 'WAVE');

      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint16(32, numChannels * (bitsPerSample / 8), true);
      view.setUint16(34, bitsPerSample, true);

      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (const chunk of chunks) {
        new Uint8Array(buffer, offset, chunk.byteLength).set(chunk);
        offset += chunk.byteLength;
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    function isNoiseOrFiller(text) {
      if (!text) return true;
      const clean = text.trim().toLowerCase().replace(/[^a-z]/g, '');
      const fillers = ['thankyou', 'thanks', 'you', 'mb', 'bye', 'a', 'the'];
      return clean.length <= 1 || fillers.includes(clean);
    }

    async function transcribeWithDeepgram(wavBlob) {
      const deepgramKey = getInputValue('deepgramKey');
      if (!deepgramKey) throw new Error("Deepgram Key未設定");

      const url = 'https://api.deepgram.com/v1/listen?model=nova-2&language=en&smart_format=true&punctuate=true';
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Authorization': `Token ${deepgramKey}`,
          'Content-Type': 'audio/wav'
        },
        body: wavBlob
      });

      if (!response.ok) throw new Error(`Deepgram Error (${response.status})`);
      const data = await response.json();
      return (data.results?.channels[0]?.alternatives[0]?.transcript || '').trim();
    }

    async function fetchGoogleTranslationAsync(targetIndex, text) {
      const googleKey = getInputValue('googleKey');
      if (!googleKey) return;

      try {
        const url = `https://translation.googleapis.com/language/translate/v2?key=${googleKey}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ q: text, target: 'ja', format: 'text' })
        });

        if (response.ok) {
          const data = await response.json();
          const translatedText = data.data?.translations[0]?.translatedText || "";

          if (translatedText && historyList[targetIndex]) {
            historyList[targetIndex].ja = translatedText;
            await updateDisplays();
          }
        }
      } catch (e) {
        logError("Google Translate", "通信エラー", e.message);
      }
    }

    // ★ ユーザープロファイル・可変品詞タグ対応 OpenAIヒント生成
    async function fetchOpenAiHintAsync(targetIndex, fullText) {
      const openAiKey = getInputValue('apiKey');
      if (!openAiKey || !historyList[targetIndex]) return;

      const item = historyList[targetIndex];

      if (item.lastProcessedText === fullText) return;

      let textToProcess = fullText;
      if (item.lastProcessedText && fullText.startsWith(item.lastProcessedText)) {
        textToProcess = fullText.slice(item.lastProcessedText.length).trim();
      }

      if (!textToProcess || textToProcess.length < 3) return;

      item.lastProcessedText = fullText;

      const userProfileKeywords = getInputValue('userProfile');
      const profileContext = userProfileKeywords ? `【ユーザー設定】\n${userProfileKeywords}\n` : '';

      const systemPrompt = `${profileContext}あなたはリアルタイム英会話アシスタントです。相手の発言に対し、ユーザーがその場で口に出しやすい自然な返答英文（1文）とカタカナ読み、日本語訳を出力してください。

【厳格ルール】
1. 可変可能な単語（文脈でユーザーが自由に置き換えられる部分）には、以下の品詞タグを付与してください。
   - [動可:xxx] : 単体で置換しても後ろの前置詞や文脈に影響を与えない動詞（他動詞など）
   - [動不:xxx] : 前置詞とセットの熟語（例: waiting for）や型が固定された動詞句（置換不可）
   - [形:xxx] : 形容詞（状態・気持ち）
   - [副:xxx] : 副詞（程度・強調）
   - [名:xxx] : 名詞（モノ・人・場所・時間）
2. 置き換えによって前置詞と不整合を起こす表現は避け、他動詞を使用するか熟語セット [動不:xxx for] として一括出力してください。
3. 全体で改行は極力減らし、コンパクトに30〜40文字程度で出力してください。

出力フォーマット例:
I want to [動可:check] the [名:schedule]. [チェッキング ザ スケジュール] (スケジュールを確認したい)`;

      try {
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${openAiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            temperature: 0.3,
            max_tokens: 100,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: textToProcess }
            ]
          })
        });

        if (res.ok) {
          const data = await res.json();
          const newHint = data.choices[0]?.message?.content?.trim() || "";

          if (newHint && historyList[targetIndex]) {
            if (!historyList[targetIndex].hint) {
              historyList[targetIndex].hint = newHint;
            } else {
              historyList[targetIndex].hint += `\n➜ ${newHint}`;
            }
            await updateDisplays();
            setStatus('ヒント追記完了');
          }
        }
      } catch (e) {
        logError("OpenAI", "通信エラー", e.message);
      }
    }

    function triggerParallelProcessing(targetIndex, text) {
      setStatus(`並列処理実行中...`);
      fetchGoogleTranslationAsync(targetIndex, text);
      fetchOpenAiHintAsync(targetIndex, text);
    }

    async function processQueue(isFinal = false, isForce = false) {
      if (isProcessing && !isForce) return;

      isProcessing = true;
      const chunksToProcess = [...activePcmChunks];
      const bytesToProcess = activeTotalBytes;
      
      if (isFinal || isForce) {
        activePcmChunks = [];
        activeTotalBytes = 0;
      }

      let targetIndex = -1;
      let targetText = "";

      try {
        if (chunksToProcess.length > 0 && bytesToProcess >= 800) {
          const wavBlob = createWavBlob(chunksToProcess, bytesToProcess);
          let enText = await transcribeWithDeepgram(wavBlob);

          if (!isNoiseOrFiller(enText)) {
            const now = Date.now();
            const isNewSession = (now - sessionLastTime > 6000 || currentEnSession.length === 0);

            if (isNewSession) {
              currentEnSession = [enText];
            } else {
              currentEnSession[currentEnSession.length - 1] = enText;
            }
            sessionLastTime = now;

            const fullEn = currentEnSession.join(' ');

            if (isNewSession || historyList.length === 0) {
              historyList.push({ en: fullEn, ja: null, hint: null, lastProcessedText: "" });
            } else {
              historyList[historyList.length - 1].en = fullEn;
            }
            
            historyIndex = historyList.length - 1;
            targetIndex = historyIndex;
            targetText = fullEn;

            await updateDisplays();
          }
        } else if (historyList.length > 0) {
          targetIndex = historyIndex;
          targetText = historyList[targetIndex].en;
        }
      } catch (e) {
        if (historyList.length > 0) {
          targetIndex = historyIndex;
          targetText = historyList[targetIndex].en;
        }
      } finally {
        isProcessing = false;
        if (targetIndex >= 0 && targetText) {
          triggerParallelProcessing(targetIndex, targetText);
        }
      }
    }

    function handleAudioData(normalized) {
      const rms = calculateRMS(normalized);
      const threshold = parseFloat(document.getElementById('noiseThreshold').value) || 80;

      if (rms >= threshold) {
        if (activePcmChunks.length === 0 && preRingBuffer.length > 0) {
          for (const preChunk of preRingBuffer) {
            activePcmChunks.push(preChunk);
            activeTotalBytes += preChunk.length;
          }
          preRingBuffer = [];
        }

        activePcmChunks.push(normalized);
        activeTotalBytes += normalized.length;

        if (currentMode === 1) {
          const accumulatedKB = (activeTotalBytes / 1024).toFixed(1);
          setStatus(`音声検出中... (${accumulatedKB} KB)`);

          if (!chunkTimer) {
            chunkTimer = setTimeout(() => {
              chunkTimer = null;
              processQueue(false, false);
            }, 300);
          }

          if (silenceTimer) clearTimeout(silenceTimer);
          const silenceMs = parseFloat(document.getElementById('silenceSec').value) * 1000 || 350;
          silenceTimer = setTimeout(() => {
            if (currentMode === 1) {
              processQueue(true, false);
            }
          }, silenceMs);
        }
      } else {
        if (activePcmChunks.length === 0) {
          preRingBuffer.push(normalized);
          if (preRingBuffer.length > MAX_PRE_BUFFER) {
            preRingBuffer.shift();
          }
        }
      }
    }

    async function updateDisplays() {
      let enText = getCurrentEnText();
      let jaText = getCurrentJaText();

      document.getElementById('preview-en').innerText = enText;
      document.getElementById('preview-ja').innerText = jaText;

      // SDK文字数上限（安全値）でのトリミング処理
      if (enText.length > 300) enText = enText.slice(-300);
      if (jaText.length > 400) jaText = jaText.slice(-400);

      if (bridge) {
        try {
          await bridge.textContainerUpgrade(new TextContainerUpgrade({
            containerID: 1,
            containerName: 'english_box',
            content: enText,
          }));
          await bridge.textContainerUpgrade(new TextContainerUpgrade({
            containerID: 2,
            containerName: 'japanese_box',
            content: jaText,
          }));
        } catch (e) {
          logError("SDK", "描画アップグレード失敗", e.message);
        }
      }
    }

    window.navigateHistory = async function(direction) {
      if (historyList.length === 0) return;
      if (direction === 'up' && historyIndex > 0) {
        historyIndex--;
        await updateDisplays();
      } else if (direction === 'down' && historyIndex < historyList.length - 1) {
        historyIndex++;
        await updateDisplays();
      }
    };

    window.clearHistory = async function() {
      historyList = [];
      historyIndex = -1;
      currentEnSession = [];
      activePcmChunks = [];
      activeTotalBytes = 0;
      preRingBuffer = [];
      await updateDisplays();
      setStatus('履歴クリア');
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        window.navigateHistory('up');
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        window.navigateHistory('down');
      }
    });

    async function initG2() {
      initKeyStorage();

      try {
        setStatus(`接続中... [${APP_VERSION}]`);
        bridge = await waitForEvenAppBridge();
        
        const englishBox = new TextContainerProperty({
          xPosition: 0,
          yPosition: 0,
          width: 576,
          height: 130,
          borderWidth: 0,
          borderColor: 5,
          paddingLength: 2,
          containerID: 1,
          containerName: 'english_box',
          content: getCurrentEnText(),
          isEventCapture: 0,
        });

        const japaneseBox = new TextContainerProperty({
          xPosition: 0,
          yPosition: 140,
          width: 576,
          height: 145,
          borderWidth: 0,
          borderColor: 5,
          paddingLength: 2,
          containerID: 2,
          containerName: 'japanese_box',
          content: getCurrentJaText(),
          isEventCapture: 1,
        });

        await bridge.createStartUpPageContainer(
          new CreateStartUpPageContainer({
            containerTotalNum: 2,
            textObject: [englishBox, japaneseBox],
          })
        );

        await bridge.audioControl(true);
        setStatus(`G2 SDK 接続完了 (${APP_VERSION}) / マイクON`);

        bridge.onEvenHubEvent(async event => {
          const rawPcm = event.audioEvent?.audioPcm;
          if (rawPcm) {
            const normalized = normalizePcm(rawPcm);
            if (normalized && normalized.length > 0) {
              handleAudioData(normalized);
            }
          }

          const sysType = event.sysEvent?.eventType;
          const textType = event.textEvent?.eventType;

          if (sysType === OsEventTypeList.CLICK_EVENT || textType === OsEventTypeList.CLICK_EVENT) {
            if (currentMode === 2) {
              processQueue(true, true);
            }
          }

          const evt = sysType || textType;
          if (evt === OsEventTypeList.UP_EVENT || evt === OsEventTypeList.SCROLL_UP_EVENT || evt === OsEventTypeList.FLICK_UP_EVENT) {
            window.navigateHistory('up');
          }
          if (evt === OsEventTypeList.DOWN_EVENT || evt === OsEventTypeList.SCROLL_DOWN_EVENT || evt === OsEventTypeList.FLICK_DOWN_EVENT) {
            window.navigateHistory('down');
          }
        });

      } catch (e) {
        logError("SDK", "初期化失敗", e.message);
        setStatus("接続エラー: " + e.message);
      }
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    function updateUIOnly(mode) {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab' + mode);
      if (activeTab) activeTab.classList.add('active');
    }

    window.switchMode = function(mode) {
      currentMode = mode;
      activePcmChunks = [];
      activeTotalBytes = 0;
      preRingBuffer = [];
      isProcessing = false;
      if (silenceTimer) clearTimeout(silenceTimer);
      updateUIOnly(currentMode);
      updateDisplays();
    };

    window.forceSendPTT = function() {
      isProcessing = false;
      processQueue(true, true);
    };

    initG2();
  </script>
</body>
</html>
