<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVEN G2 Translator</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #232323; color: #E5E5E5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #app { display: flex; height: 100%; }
    .panel { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 640px; margin: 0 auto; padding: 24px; box-sizing: border-box; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0; }
    .mode-badge { font-size: 11px; padding: 4px 8px; border-radius: 4px; border: 1px solid #3CFA44; background: #1a1a1a; }
    .status { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid transparent; }
    .status-connecting { color: #A7A7A7; border-color: #3E3E3E; }
    .status-listening  { color: #3CFA44; border-color: #3CFA44; background: rgba(60,250,68,0.08); }
    .status-processing { color: #FFA500; border-color: #FFA500; background: rgba(255,165,0,0.08); }
    .status-paused     { color: #00BFFF; border-color: #00BFFF; background: rgba(0,191,255,0.08); }
    .status-error      { color: #FF453A; border-color: #FF453A; background: rgba(255,69,58,0.08); }
    .transcript { flex: 1; overflow: auto; background: #2E2E2E; border: 1px solid #3E3E3E; border-radius: 12px; padding: 20px; font-size: 18px; white-space: pre-wrap; word-break: break-word; }
    .label { font-size: 11px; color: #888; margin-bottom: 8px; }
    .interim { color: #919191; font-style: italic; }
    footer { font-size: 12px; color: #7B7B7B; text-align: center; }
    .api-key-box { margin-bottom: 10px; }
    .api-key-box input { background: #111; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 4px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="app">
    <main class="panel">
      <header>
        <h1>G2 AI Translator</h1>
        <div id="modeIndicator" class="mode-badge">Mode 1: 自動ハンズフリー</div>
        <div id="status" class="status status-connecting">SDK接続中...</div>
      </header>

      <div class="api-key-box">
        <input type="password" id="apiKeyInput" placeholder="OpenAI API Key (sk-...) を入力" />
      </div>

      <section class="transcript" aria-live="polite">
        <div class="label">音声認識 / 翻訳結果:</div>
        <span id="final"></span><span id="interim" class="interim"></span>
      </section>

      <footer>タップ: モード切り替え (1:自動 ⇄ 2:PTT) / ダブルタップ: 終了</footer>
    </main>
  </div>

  <script type="module">
    import {
      waitForEvenAppBridge,
      TextContainerProperty,
      CreateStartUpPageContainer,
      TextContainerUpgrade,
      OsEventTypeList
    } from 'https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk/+esm';

    let bridge = null;
    let currentMode = 1; // 1: 自動, 2: PTT
    let pcmBuffer = [];
    let totalLength = 0;
    let isProcessing = false;
    let accumulatedText = '';
    let currentContent = 'Listening...';
    let lastRender = '';
    let renderTimer = null;

    const statusEl = document.getElementById('status');
    const finalEl = document.getElementById('final');
    const interimEl = document.getElementById('interim');
    const modeIndicatorEl = document.getElementById('modeIndicator');
    const apiKeyInput = document.getElementById('apiKeyInput');

    function setStatus(kind, text) {
      statusEl.className = `status status-${kind}`;
      statusEl.textContent = text;
    }

    function setModeDisplay(mode) {
      if (mode === 1) {
        modeIndicatorEl.textContent = "Mode 1: 自動ハンズフリー";
        modeIndicatorEl.style.borderColor = "#3CFA44";
      } else {
        modeIndicatorEl.textContent = "Mode 2: プッシュ・トゥ・トーク";
        modeIndicatorEl.style.borderColor = "#00BFFF";
      }
    }

    // PCM (16kHz 16bit mono) を WAV (Blob) に変換
    function pcmToWavBlob(pcmChunks, totalLen) {
      const wavHeader = new ArrayBuffer(44);
      const view = new DataView(wavHeader);
      view.setUint32(0, 0x52494646, false); // "RIFF"
      view.setUint32(4, 36 + totalLen, true);
      view.setUint32(8, 0x57415645, false); // "WAVE"
      view.setUint32(12, 0x666d7420, false); // "fmt "
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, 16000, true); // 16kHz
      view.setUint32(28, 16000 * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      view.setUint32(36, 0x64617461, false); // "data"
      view.setUint32(40, totalLen, true);

      const wavBytes = new Uint8Array(44 + totalLen);
      wavBytes.set(new Uint8Array(wavHeader), 0);
      let offset = 44;
      for (const chunk of pcmChunks) {
        wavBytes.set(chunk, offset);
        offset += chunk.length;
      }
      return new Blob([wavBytes], { type: 'audio/wav' });
    }

    // Whisper API 呼び出し
    async function flushAndTranscribe() {
      const apiKey = apiKeyInput.value.trim();
      if (isProcessing || pcmBuffer.length === 0 || !apiKey) {
        if (!apiKey) setStatus('error', 'API Keyを入力してください');
        return;
      }

      isProcessing = true;
      const chunksToProcess = [...pcmBuffer];
      const lenToProcess = totalLength;
      pcmBuffer = [];
      totalLength = 0;

      try {
        setStatus('processing', 'Translating via Whisper...');
        const wavBlob = pcmToWavBlob(chunksToProcess, lenToProcess);
        const formData = new FormData();
        formData.append('file', wavBlob, 'audio.wav');
        formData.append('model', 'whisper-1');

        const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${apiKey}` },
          body: formData
        });

        if (!response.ok) throw new Error(`API Error: ${response.statusText}`);
        const data = await response.json();

        if (data.text) {
          accumulatedText += (accumulatedText ? ' ' : '') + data.text;
          finalEl.textContent = accumulatedText + "\n";
        }
        
        currentContent = accumulatedText ? accumulatedText.slice(-240) : 'Listening...';
        scheduleGlassesRender();
        setStatus('listening', currentMode === 1 ? 'Auto Active' : 'PTT Ready');
      } catch (err) {
        setStatus('error', err.message);
      } finally {
        isProcessing = false;
      }
    }

    function scheduleGlassesRender() {
      if (renderTimer !== null || !bridge) return;
      renderTimer = window.setTimeout(async () => {
        renderTimer = null;
        if (currentContent === lastRender) return;
        lastRender = currentContent;
        await bridge.textContainerUpgrade(
          new TextContainerUpgrade({
            containerID: 1,
            containerName: 'transcript',
            content: currentContent,
          })
        );
      }, 120);
    }

    async function init() {
      try {
        bridge = await waitForEvenAppBridge();
        
        const transcript = new TextContainerProperty({
          xPosition: 0,
          yPosition: 0,
          width: 576,
          height: 288,
          borderWidth: 0,
          borderColor: 5,
          paddingLength: 4,
          containerID: 1,
          containerName: 'transcript',
          content: 'G2 Translator Ready',
          isEventCapture: 1,
        });

        await bridge.createStartUpPageContainer(
          new CreateStartUpPageContainer({ containerTotalNum: 1, textObject: [transcript] })
        );

        await bridge.audioControl(true);
        setStatus('listening', 'Mode 1: Auto Active');

        bridge.onEvenHubEvent(async event => {
          // マイクデータの受信
          const pcm = event.audioEvent?.audioPcm;
          if (pcm) {
            pcmBuffer.push(pcm);
            totalLength += pcm.length;
            // モード1かつ約4秒分のPCMが溜まったら自動送信
            if (currentMode === 1 && totalLength > 32000 * 4) {
              flushAndTranscribe();
            }
          }

          const sysType = event.sysEvent?.eventType;
          const textType = event.textEvent?.eventType;

          // ダブルタップで終了
          if (sysType === OsEventTypeList.DOUBLE_CLICK_EVENT || textType === OsEventTypeList.DOUBLE_CLICK_EVENT) {
            bridge.audioControl(false);
            bridge.shutDownPageContainer(1);
            return;
          }

          // シングルタップでモード切り替え / PTT送信
          if (sysType === OsEventTypeList.CLICK_EVENT || textType === OsEventTypeList.CLICK_EVENT) {
            if (currentMode === 1) {
              currentMode = 2;
              setModeDisplay(2);
              setStatus('paused', 'Mode 2: PTT Ready');
            } else {
              await flushAndTranscribe();
              currentMode = 1;
              setModeDisplay(1);
              setStatus('listening', 'Mode 1: Auto Active');
            }
          }
        });

      } catch (e) {
        setStatus('error', 'SDK接続失敗: ' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
