<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>EVEN G2 5-Mode HUD Full Assistant (SDK Ver.)</title>
  <style>
    body {
      background-color: #111;
      color: #00FF00;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .glass-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #333;
      padding-right: 20px;
    }
    .mode-tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      width: 576px;
    }
    .mode-tab {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #00AA00;
      color: #00FF00;
      padding: 6px 2px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    .mode-tab.active {
      background: #00FF00;
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }
    #glass-display {
      width: 576px;
      height: 288px;
      background-color: #000;
      border: 3px solid #00FF00;
      border-radius: 8px;
      box-sizing: border-box;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .hud-mode-screen {
      display: none;
      height: 100%;
      flex-direction: column;
    }
    .hud-mode-screen.active {
      display: flex;
    }
    .control-panel {
      width: 380px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: #ccc;
      font-size: 14px;
    }
    .control-panel h2 { color: #00FF00; font-size: 18px; margin: 0 0 5px 0; }
    input, textarea, select, button {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    button { background: #00aa00; color: #fff; font-weight: bold; cursor: pointer; border: none; padding: 10px; }
    button:hover { background: #00dd00; color: #000; }
    .status { font-size: 12px; color: #888; }
  </style>
</head>
<body>

  <div class="glass-container">
    <div class="mode-tab-bar">
      <div id="tab1" class="mode-tab active" onclick="switchMode(1)">1: 短文・旅行</div>
      <div id="tab2" class="mode-tab" onclick="switchMode(2)">2: 相手音声</div>
      <div id="tab3" class="mode-tab" onclick="switchMode(3)">3: AI回答</div>
      <div id="tab4" class="mode-tab" onclick="switchMode(4)">4: フレーズ集</div>
      <div id="tab5" class="mode-tab" onclick="switchMode(5)">5: 自声翻訳</div>
    </div>

    <div id="glass-display">
      <div id="mode1Screen" class="hud-mode-screen active">
        <div style="color:#FF5555; font-size:11px; font-weight:bold;">相手の発言</div>
        <div id="m1-partner" style="color:#FF4444; font-size:15px; font-weight:bold; margin-bottom:8px;">Where is the nearest station?</div>
        <div style="color:#00AA00; font-size:11px; font-weight:bold; border-top:1px dashed #005500; padding-top:4px;">マイアンサー</div>
        <div id="m1-en" style="color:#00FF00; font-size:16px; font-weight:bold;">It's a 5-minute walk from here.</div>
        <div id="m1-ja" style="color:#009900; font-size:11px;">ここから徒歩5分です。</div>
      </div>
    </div>
  </div>

  <div class="control-panel">
    <h2>G2 HUD コントローラー</h2>
    <div class="input-group">
      <label>OpenAI API Key:</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
    </div>
    <div class="input-group">
      <label>テスト送信テキスト:</label>
      <textarea id="userInput" rows="3">Where is the nearest station?</textarea>
    </div>
    <button onclick="sendTextToG2()">グラスへ送信テスト</button>
    <div id="status" class="status">SDK接続待機中...</div>
  </div>

  <!-- 公式SDKのモジュール読み込み -->
  <script type="module">
    import {
      waitForEvenAppBridge,
      TextContainerProperty,
      CreateStartUpPageContainer,
      TextContainerUpgrade,
      OsEventTypeList
    } from 'https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk/+esm';

    let bridge = null;

    async function initG2() {
      try {
        status.innerText = "G2ブリッジ接続中...";
        bridge = await waitForEvenAppBridge();
        
        // 初期コンテナの作成
        const mainText = new TextContainerProperty({
          xPosition: 0,
          yPosition: 0,
          width: 576,
          height: 288,
          borderWidth: 0,
          borderColor: 5,
          paddingLength: 4,
          containerID: 1,
          containerName: 'hud_main',
          content: 'Where is the nearest station?\n(最寄りの駅はどこですか？)',
          isEventCapture: 1,
        });

        await bridge.createStartUpPageContainer(
          new CreateStartUpPageContainer({
            containerTotalNum: 1,
            textObject: [mainText],
          })
        );

        document.getElementById('status').innerText = "G2 SDK 接続完了！";

        // イベントリスナー（リング操作など）
        bridge.onEvenHubEvent(event => {
          console.log("Event received:", event);
        });

      } catch (e) {
        document.getElementById('status').innerText = "SDK接続エラー: " + e.message;
      }
    }

    window.sendTextToG2 = async function() {
      if (!bridge) {
        alert("ブリッジがまだ接続されていません");
        return;
      }
      const val = document.getElementById('userInput').value;
      try {
        await bridge.textContainerUpgrade(
          new TextContainerUpgrade({
            containerID: 1,
            containerName: 'hud_main',
            content: val,
          })
        );
        document.getElementById('status').innerText = "グラスへ送信しました！";
      } catch (e) {
        document.getElementById('status').innerText = "送信エラー: " + e.message;
      }
    };

    initG2();
  </script>
</body>
</html>
