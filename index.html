<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>EVEN G2 5-Mode HUD Full Assistant</title>
  <style>
    body {
      background-color: #111;
      color: #00FF00;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .glass-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #333;
      padding-right: 20px;
    }
    .mode-tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      width: 576px;
    }
    .mode-tab {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #00AA00;
      color: #00FF00;
      padding: 6px 2px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    .mode-tab.active {
      background: #00FF00;
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }
    #glass-display {
      width: 576px;
      height: 288px;
      background-color: #000;
      border: 3px solid #00FF00;
      border-radius: 8px;
      box-sizing: border-box;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .hud-mode-screen {
      display: none;
      height: 100%;
      flex-direction: column;
    }
    .hud-mode-screen.active {
      display: flex;
    }
    .control-panel {
      width: 400px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #ccc;
      font-size: 13px;
      overflow-y: auto;
    }
    .control-panel h2 { color: #00FF00; font-size: 16px; margin: 0 0 5px 0; }
    input, textarea, select, button {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    button { background: #00aa00; color: #fff; font-weight: bold; cursor: pointer; border: none; padding: 8px; }
    button:hover { background: #00dd00; color: #000; }
    .status { font-size: 11px; color: #888; }
  </style>
</head>
<body>

  <!-- 左側：ブラウザUI（操作パネル & プレビュー） -->
  <div class="glass-container">
    <div class="mode-tab-bar">
      <div id="tab1" class="mode-tab active" onclick="switchMode(1)">1: 短文・旅行</div>
      <div id="tab2" class="mode-tab" onclick="switchMode(2)">2: 相手音声</div>
      <div id="tab3" class="mode-tab" onclick="switchMode(3)">3: AI回答</div>
      <div id="tab4" class="mode-tab" onclick="switchMode(4)">4: フレーズ集</div>
      <div id="tab5" class="mode-tab" onclick="switchMode(5)">5: 自声翻訳</div>
    </div>

    <!-- グラス表示再現エリア -->
    <div id="glass-display">
      <!-- モード1: 短文・旅行 -->
      <div id="mode1Screen" class="hud-mode-screen active">
        <div style="color:#FF5555; font-size:11px; font-weight:bold;">相手の発言</div>
        <div id="m1-partner" style="color:#FF4444; font-size:15px; font-weight:bold; margin-bottom:2px;">Where is the nearest station?</div>
        <div id="m1-partner-ja" style="color:#ff8888; font-size:11px; margin-bottom:4px;">一番近い駅はどこですか？</div>
        <div style="border-top:1px dashed #005500; margin:2px 0;"></div>
        <div id="m1-en" style="color:#00FF00; font-size:15px; font-weight:bold;">It's a 5-minute walk from here.</div>
        <div id="m1-kana" style="color:#00aa00; font-size:11px;">イツツア ファイブミニッツ ウォーク フロム ヒア。</div>
        <div id="m1-ja" style="color:#009900; font-size:11px;">ここから徒歩5分です。</div>
      </div>
      <!-- モード2: 相手音声 -->
      <div id="mode2Screen" class="hud-mode-screen">
        <div style="color:#FF5555; font-size:11px;">[相手音声 全面]</div>
        <div id="m2-en" style="color:#FF4444; font-size:15px; font-weight:bold; margin-top:6px;">Waiting for speech...</div>
        <div id="m2-kana" style="color:#aa0000; font-size:11px;">-</div>
        <div id="m2-ja" style="color:#009900; font-size:12px; margin-top:4px;">-</div>
      </div>
      <!-- モード3: AI回答 -->
      <div id="mode3Screen" class="hud-mode-screen">
        <div style="display:flex; justify-content:space-between; font-size:11px; color:#888;">
          <span>AI回答アシスト</span>
          <span id="page-badge-3">1/1</span>
        </div>
        <div id="m3-en" style="color:#00FF00; font-size:14px; font-weight:bold; margin-top:4px;">-</div>
        <div id="m3-kana" style="color:#00aa00; font-size:11px;">-</div>
        <div id="m3-ja" style="color:#888; font-size:11px; margin-top:4px;">-</div>
      </div>
      <!-- モード4: フレーズ集 -->
      <div id="mode4Screen" class="hud-mode-screen">
        <div style="color:#00FF00; font-size:11px; font-weight:bold;">フレーズ集</div>
        <div id="m4-category" style="color:#888; font-size:10px;">Category</div>
        <div id="m4-en" style="color:#fff; font-size:14px; font-weight:bold; margin-top:4px;">-</div>
        <div id="m4-kana" style="color:#00aa00; font-size:11px;">-</div>
        <div id="m4-ja" style="color:#009900; font-size:11px;">-</div>
      </div>
      <!-- モード5: 自声翻訳 -->
      <div id="mode5Screen" class="hud-mode-screen">
        <div style="color:#00FF00; font-size:11px;">[自声翻訳]</div>
        <div id="m5-source" style="color:#fff; font-size:12px; margin-top:4px;">Speak into mic...</div>
        <div id="m5-translated" style="color:#FF4444; font-size:14px; font-weight:bold; margin-top:4px;">-</div>
        <div id="m5-kana" style="color:#ff8888; font-size:11px;">-</div>
      </div>
    </div>
  </div>

  <!-- 右側：コントロールパネル -->
  <div class="control-panel">
    <h2>G2 HUD コントローラー</h2>
    <div>
      <label>OpenAI API Key:</label>
      <input type="password" id="apiKey" placeholder="sk-..." style="width:100%; box-sizing:border-box;" />
    </div>
    <div>
      <label>入力テキスト (AI用 / 送信用):</label>
      <textarea id="promptInput" rows="2" style="width:100%; box-sizing:border-box;">おすすめの観光スポットを教えて</textarea>
    </div>
    <button onclick="requestAI()">AI回答生成 & グラス転送</button>
    <div style="border-top:1px solid #333; margin:5px 0;"></div>
    <div>
      <label>マイク音声認識 (モード5用):</label>
      <button onclick="startVoiceRecognition()" style="background:#0055aa; width:100%;">🎤 音声認識スタート</button>
    </div>
    <div id="status" class="status">SDK接続待機中...</div>
  </div>

  <!-- 公式SDK & アプリロジック -->
  <script type="module">
    import {
      waitForEvenAppBridge,
      TextContainerProperty,
      CreateStartUpPageContainer,
      TextContainerUpgrade,
      OsEventTypeList
    } from 'https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk/+esm';

    let bridge = null;
    let currentMode = 1;

    async function initG2() {
      try {
        document.getElementById('status').innerText = "G2ブリッジ接続中...";
        bridge = await waitForEvenAppBridge();
        
        const initialText = 
          "相手の発言:\n" +
          "Where is the nearest station?\n" +
          "(一番近い駅はどこですか？)\n" +
          "-------------------\n" +
          "It's a 5-minute walk from here.\n" +
          "イツツア ファイブミニッツ ウォーク...\n" +
          "ここから徒歩5分です。";

        const mainText = new TextContainerProperty({
          xPosition: 0,
          yPosition: 0,
          width: 576,
          height: 288,
          borderWidth: 0,
          borderColor: 5,
          paddingLength: 4,
          containerID: 1,
          containerName: 'hud_main',
          content: initialText,
          isEventCapture: 1,
        });

        await bridge.createStartUpPageContainer(
          new CreateStartUpPageContainer({
            containerTotalNum: 1,
            textObject: [mainText],
          })
        );

        document.getElementById('status').innerText = "G2 SDK 接続完了！";

        bridge.onEvenHubEvent(event => {
          console.log("Event:", event);
        });

      } catch (e) {
        document.getElementById('status').innerText = "SDK接続エラー: " + e.message;
      }
    }

    async function sendToG2Display(text) {
      if (!bridge) return;
      try {
        await bridge.textContainerUpgrade(
          new TextContainerUpgrade({
            containerID: 1,
            containerName: 'hud_main',
            content: text,
          })
        );
      } catch (e) {
        console.error("Display update failed:", e);
      }
    }

    window.switchMode = function(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab' + mode).classList.add('active');

      document.querySelectorAll('.hud-mode-screen').forEach(s => s.classList.remove('active'));
      document.getElementById('mode' + mode + 'Screen').classList.add('active');

      if (mode === 1) {
        const t = 
          "相手の発言:\n" +
          "Where is the nearest station?\n" +
          "(一番近い駅はどこですか？)\n" +
          "-------------------\n" +
          "It's a 5-minute walk from here.\n" +
          "イツツア ファイブミニッツ ウォーク...\n" +
          "ここから徒歩5分です。";
        sendToG2Display(t);
      } else if (mode === 2) {
        sendToG2Display("[相手音声 全面]\nWaiting for speech...\n-\n-");
      } else if (mode === 3) {
        sendToG2Display("[AI回答アシスト]\nスタンバイ中\n-\n-");
      } else if (mode === 4) {
        sendToG2Display("[フレーズ集]\nSelect a phrase\n-\n-");
      } else if (mode === 5) {
        sendToG2Display("[自声翻訳]\n🎤 待機中\n-\n-");
      }
    };

    window.requestAI = async function() {
      const apiKey = document.getElementById('apiKey').value;
      const prompt = document.getElementById('promptInput').value;
      if (!apiKey) {
        alert("APIキーを入力してください");
        return;
      }
      document.getElementById('status').innerText = "AI回答生成中...";
      
      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [{ role: 'user', content: prompt + " を英語で。出力はJSON形式で {en: 英語, kana: カタカナ読み, ja: 和訳} のみで返して" }]
          })
        });
        const data = await response.json();
        const rawContent = data.choices[0].message.content;
        
        let resJson = { en: prompt, kana: "よみかた", ja: rawContent };
        try {
          const cleanJson = rawContent.replace(/```json/g, '').replace(/```/g, '').trim();
          resJson = JSON.parse(cleanJson);
        } catch(err) {
          resJson.ja = rawContent;
        }

        document.getElementById('m3-en').innerText = resJson.en;
        document.getElementById('m3-kana').innerText = resJson.kana || '';
        document.getElementById('m3-ja').innerText = resJson.ja;
        
        switchMode(3);

        const glassText = `[AI回答]\n${resJson.en}\n(${resJson.kana || ''})\n---\n${resJson.ja}`;
        sendToG2Display(glassText);

        document.getElementById('status').innerText = "完了！";
      } catch (e) {
        document.getElementById('status').innerText = "エラー: " + e.message;
      }
    };

    window.startVoiceRecognition = function() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("このブラウザは音声認識に対応していません");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      document.getElementById('status').innerText = "🎤 聞き取り中...";
      
      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('m5-source').innerText = text;
        document.getElementById('m5-translated').innerText = "Translating...";
        switchMode(5);
        sendToG2Display(`[自声翻訳]\n入力: ${text}\n翻訳中...`);
        document.getElementById('status').innerText = "認識完了";
      };
      recognition.start();
    };

    initG2();
  </script>
</body>
</html>
