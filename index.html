<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>EVEN G2 Translator App (v3.6 Async Render)</title>
  <style>
    body {
      background-color: #111;
      color: #00FF00;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .glass-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #333;
      padding-right: 20px;
    }
    .mode-tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      width: 576px;
    }
    .mode-tab {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #00AA00;
      color: #00FF00;
      padding: 6px 2px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    .mode-tab.active {
      background: #00FF00;
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }
    #glass-display {
      width: 576px;
      height: 288px;
      background-color: #000;
      border: 3px solid #00FF00;
      border-radius: 8px;
      box-sizing: border-box;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .hud-mode-screen {
      display: none;
      height: 100%;
      flex-direction: column;
    }
    .hud-mode-screen.active {
      display: flex;
    }
    .text-scroll-area {
      flex: 1;
      overflow-y: auto;
      margin-top: 4px;
      padding-right: 4px;
    }
    .text-scroll-area::-webkit-scrollbar {
      width: 6px;
    }
    .text-scroll-area::-webkit-scrollbar-thumb {
      background: #00AA00;
      border-radius: 3px;
    }
    .control-panel {
      width: 400px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #ccc;
      font-size: 13px;
      overflow-y: auto;
    }
    .control-panel h2 { color: #00FF00; font-size: 16px; margin: 0 0 5px 0; display: flex; align-items: center; justify-content: space-between; }
    .version-badge {
      background: #00FF00;
      color: #000;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }
    input, button {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    button { background: #00aa00; color: #fff; font-weight: bold; cursor: pointer; border: none; padding: 8px; }
    button:hover { background: #00dd00; color: #000; }
    .nav-btn {
      background: #333;
      border: 1px solid #00FF00;
      color: #00FF00;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .nav-btn:hover { background: #00FF00; color: #000; }
    .status { font-size: 11px; color: #888; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body tabindex="0">

  <div class="glass-container">
    <div class="mode-tab-bar">
      <div id="tab1" class="mode-tab active" onclick="switchMode(1)">1: 連続即時描画</div>
      <div id="tab2" class="mode-tab" onclick="switchMode(2)">2: PTT (押して送信)</div>
    </div>

    <div id="glass-display">
      <div id="mode1Screen" class="hud-mode-screen active">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="color:#00FF00; font-size:10px; font-weight:bold;">即時描画ストリーミング (↑/↓で履歴)</div>
          <div>
            <button class="nav-btn" onclick="navigateHistory('up')">▲ 前へ</button>
            <button class="nav-btn" onclick="navigateHistory('down')">▼ 次へ</button>
          </div>
        </div>
        <div id="m1-status" style="color:#888; font-size:11px; margin-top:2px;">音声入力待機中...</div>
        <div class="text-scroll-area">
          <div id="m1-text" style="color:#fff; font-size:12px; font-weight:bold; white-space:pre-wrap;">-</div>
        </div>
      </div>

      <div id="mode2Screen" class="hud-mode-screen">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="color:#00BFFF; font-size:10px; font-weight:bold;">PTT 翻訳 (↑/↓で履歴)</div>
          <div>
            <button class="nav-btn" onclick="navigateHistory('up')">▲ 前へ</button>
            <button class="nav-btn" onclick="navigateHistory('down')">▼ 次へ</button>
          </div>
        </div>
        <div id="m2-status" style="color:#888; font-size:11px; margin-top:2px;">ボタンで音声送信</div>
        <div class="text-scroll-area">
          <div id="m2-text" style="color:#fff; font-size:12px; font-weight:bold; white-space:pre-wrap;">-</div>
        </div>
      </div>
    </div>
  </div>

  <div class="control-panel">
    <h2>
      <span>G2 音声翻訳＆返答アシスト</span>
      <span class="version-badge" id="versionBadge">v3.6 (即時描画対応)</span>
    </h2>
    <div>
      <label>Deepgram API Key (文字起こし):</label>
      <input type="password" id="deepgramKey" placeholder="Deepgram Key" style="width:100%; box-sizing:border-box;" />
    </div>
    <div>
      <label>DeepL API Key (翻訳):</label>
      <input type="password" id="deeplKey" placeholder="DeepL Key (:fx 含む)" style="width:100%; box-sizing:border-box;" />
    </div>
    <div>
      <label>OpenAI API Key (返答ヒント用・任意):</label>
      <input type="password" id="apiKey" placeholder="sk-..." style="width:100%; box-sizing:border-box;" />
    </div>
    
    <div>
      <label>マイク感度閾値 (音量閾値): <span id="thresholdVal">200</span></label>
      <input type="range" id="noiseThreshold" min="50" max="2000" value="200" style="width:100%;" oninput="document.getElementById('thresholdVal').innerText = this.value" />
    </div>

    <div>
      <label>無音判定タイマー (秒): <span id="silenceSecVal">0.3</span>秒</label>
      <input type="range" id="silenceSec" min="0.1" max="1.5" step="0.05" value="0.3" style="width:100%;" oninput="document.getElementById('silenceSecVal').innerText = this.value" />
      <div style="font-size:10px; color:#888;">※小刻みな即時描画のため 0.3秒 を推奨</div>
    </div>

    <div style="border-top:1px solid #333; margin:5px 0;"></div>
    <button onclick="forceSendPTT()" style="background:#0088cc;">🎤 PTT 手動送信（画面2用）</button>
    <button onclick="clearHistory()" style="background:#cc3333; margin-top:5px;">🗑️ 履歴をクリア</button>
    
    <div style="border-top:1px solid #333; margin:5px 0;"></div>
    <div style="font-weight:bold; color:#00FF00;">【ログ・ステータス】</div>
    <div id="status" class="status">SDK接続待機中...</div>
  </div>

  <script type="module">
    import {
      waitForEvenAppBridge,
      TextContainerProperty,
      CreateStartUpPageContainer,
      TextContainerUpgrade,
      OsEventTypeList
    } from 'https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk/+esm';

    const APP_VERSION = "v3.6 (即時描画対応)";
    const WORKER_URL = "https://blue-night-af7c.leoa1000xbd.workers.dev/";

    let bridge = null;
    let currentMode = 1;

    let activePcmChunks = [];
    let activeTotalBytes = 0;
    
    let preRingBuffer = [];
    const MAX_PRE_BUFFER = 5;

    let isProcessing = false;
    let silenceTimer = null;

    let currentEnSession = [];
    let currentJaSession = [];
    let sessionLastTime = 0;

    let historyList = [];
    let historyIndex = -1;

    function getDisplayText() {
      if (historyList.length === 0) {
        return currentMode === 1 
          ? "音声入力待機中...\n（相手の発言を検知すると自動表示されます）" 
          : "タップ操作で音声送信\n（ボタンを押して会話を開始）";
      }
      const item = historyList[historyIndex];
      const navInfo = `[${historyIndex + 1}/${historyList.length}] -------------------\n`;
      return navInfo + item;
    }

    function normalizePcm(pcmData) {
      if (!pcmData) return null;
      if (typeof pcmData === 'string') {
        const binary = atob(pcmData);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }
      if (pcmData instanceof Uint8Array) return pcmData;
      if (pcmData instanceof ArrayBuffer) return new Uint8Array(pcmData);
      if (Array.isArray(pcmData)) return new Uint8Array(pcmData);
      if (ArrayBuffer.isView(pcmData)) return new Uint8Array(pcmData.buffer, pcmData.byteOffset, pcmData.byteLength);
      return null;
    }

    function calculateRMS(uint8Array) {
      if (!uint8Array || uint8Array.length < 2) return 0;
      const dataView = new DataView(uint8Array.buffer, uint8Array.byteOffset, uint8Array.byteLength);
      let sum = 0;
      const samples = Math.floor(uint8Array.byteLength / 2);
      for (let i = 0; i < samples; i++) {
        const sample = dataView.getInt16(i * 2, true);
        sum += sample * sample;
      }
      return Math.sqrt(sum / samples);
    }

    function createWavBlob(chunks, dataSize) {
      const sampleRate = 16000;
      const numChannels = 1;
      const bitsPerSample = 16;
      
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, 'WAVE');

      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint16(32, numChannels * (bitsPerSample / 8), true);
      view.setUint16(34, bitsPerSample, true);

      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (const chunk of chunks) {
        new Uint8Array(buffer, offset, chunk.byteLength).set(chunk);
        offset += chunk.byteLength;
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    function isNoiseOrFiller(text) {
      if (!text) return true;
      const clean = text.trim().toLowerCase().replace(/[^a-z]/g, '');
      const fillers = ['thankyou', 'thanks', 'you', 'mb', 'bye', 'am', 'so'];
      return clean.length <= 1 || fillers.includes(clean);
    }

    async function transcribeWithDeepgram(wavBlob) {
      const deepgramKey = document.getElementById('deepgramKey').value.trim();
      if (!deepgramKey) throw new Error("Deepgram API Keyを入力してください");

      const url = 'https://api.deepgram.com/v1/listen?model=nova-2&language=en&smart_format=true&punctuate=true';
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Authorization': `Token ${deepgramKey}`,
          'Content-Type': 'audio/wav'
        },
        body: wavBlob
      });

      if (!response.ok) {
        const errJson = await response.json().catch(() => ({}));
        throw new Error(errJson.reason || `Deepgram Error (${response.status})`);
      }

      const data = await response.json();
      return (data.results?.channels[0]?.alternatives[0]?.transcript || '').trim();
    }

    async function translateText(text) {
      const deeplKey = document.getElementById('deeplKey').value.trim();
      
      if (deeplKey) {
        try {
          const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: text,
              target_lang: 'JA',
              auth_key: deeplKey
            })
          });

          if (response.ok) {
            const data = await response.json();
            if (data.translations && data.translations[0]) {
              return data.translations[0].text;
            }
          }
        } catch (e) {
          console.warn("Workers DeepL Failed:", e);
        }
      }
      return "（翻訳取得エラー）";
    }

    // バックグラウンドでOpenAIヒントを生成して画面更新する非同期関数
    async function generateOpenAiHintAsync(targetIndex, fullEnText, fullJaText) {
      const openAiKey = document.getElementById('apiKey').value.trim();
      if (!openAiKey) return;

      try {
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${openAiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            temperature: 0.2,
            max_tokens: 150,
            messages: [
              {
                role: 'system',
                content: `英語の発言に対し、短く返答するヒントを3行で出力してください。\n(短い英語)\n(カタカナフリガナ)\n(日本語訳)`
              },
              { role: 'user', content: fullEnText }
            ]
          })
        });

        if (res.ok) {
          const data = await res.json();
          const hintText = data.choices[0]?.message?.content?.trim() || "";
          
          // 該当インデックスの表示内容をヒント付きで上書き更新
          if (historyList[targetIndex]) {
            historyList[targetIndex] = `【相手】\n${fullEnText}\n${fullJaText}\n-------------------\n【返答ヒント】\n${hintText}`;
            await updateDisplays();
          }
        }
      } catch (e) {
        console.error("Async OpenAI Error:", e);
      }
    }

    async function processQueue() {
      if (isProcessing) return;
      if (activeTotalBytes < 1200) return;

      isProcessing = true;
      const chunksToProcess = [...activePcmChunks];
      const bytesToProcess = activeTotalBytes;
      
      activePcmChunks = [];
      activeTotalBytes = 0;

      try {
        setStatus(`解析・更新中...`);
        const wavBlob = createWavBlob(chunksToProcess, bytesToProcess);
        let enText = await transcribeWithDeepgram(wavBlob);

        if (!isNoiseOrFiller(enText)) {
          const jaTranslation = await translateText(enText);

          const now = Date.now();
          if (now - sessionLastTime > 8000 || currentEnSession.length === 0) {
            currentEnSession = [enText];
            currentJaSession = [jaTranslation];
          } else {
            currentEnSession.push(enText);
            currentJaSession.push(jaTranslation);
          }
          sessionLastTime = now;

          const fullEn = currentEnSession.join(' ');
          const fullJa = currentJaSession.join(' ');

          const openAiKey = document.getElementById('apiKey').value.trim();
          const initialHintLabel = openAiKey ? "（準備中...）" : "（OpenAI Key未設定）";

          // 1. DeepLの翻訳結果までを最優先で「即時描画」
          let currentContent = `【相手】\n${fullEn}\n${fullJa}\n-------------------\n【返答ヒント】\n${initialHintLabel}`;

          if (now - sessionLastTime > 8000 || historyList.length === 0) {
            historyList.push(currentContent);
          } else {
            historyList[historyList.length - 1] = currentContent;
          }
          historyIndex = historyList.length - 1;

          // 一刻も早くグラス描画を更新
          await updateDisplays();
          setStatus('待機中');

          // 2. OpenAIの返答ヒントはバックグラウンド非同期処理に切り離す
          if (openAiKey) {
            generateOpenAiHintAsync(historyIndex, fullEn, fullJa);
          }

        } else {
          setStatus(`待機中`);
        }
      } catch (e) {
        console.error(e);
        setStatus('エラー: ' + e.message);
      } finally {
        isProcessing = false;
        if (activeTotalBytes >= 1200) {
          processQueue();
        }
      }
    }

    function handleAudioData(normalized) {
      const rms = calculateRMS(normalized);
      const threshold = parseFloat(document.getElementById('noiseThreshold').value) || 200;

      if (rms >= threshold) {
        if (activePcmChunks.length === 0 && preRingBuffer.length > 0) {
          for (const preChunk of preRingBuffer) {
            activePcmChunks.push(preChunk);
            activeTotalBytes += preChunk.length;
          }
          preRingBuffer = [];
        }

        activePcmChunks.push(normalized);
        activeTotalBytes += normalized.length;

        if (currentMode === 1) {
          setStatus(`録音中...`);

          if (silenceTimer) clearTimeout(silenceTimer);
          
          const silenceMs = parseFloat(document.getElementById('silenceSec').value) * 1000 || 300;
          silenceTimer = setTimeout(() => {
            if (currentMode === 1) {
              processQueue();
            }
          }, silenceMs);
        }
      } else {
        if (activePcmChunks.length === 0) {
          preRingBuffer.push(normalized);
          if (preRingBuffer.length > MAX_PRE_BUFFER) {
            preRingBuffer.shift();
          }
        }
      }
    }

    async function updateDisplays() {
      const displayText = getDisplayText();
      document.getElementById('m1-text').innerText = displayText;
      document.getElementById('m2-text').innerText = displayText;
      await sendToG2Display(displayText);
    }

    window.navigateHistory = async function(direction) {
      if (historyList.length === 0) return;
      if (direction === 'up' && historyIndex > 0) {
        historyIndex--;
        await updateDisplays();
      } else if (direction === 'down' && historyIndex < historyList.length - 1) {
        historyIndex++;
        await updateDisplays();
      }
    };

    window.clearHistory = async function() {
      historyList = [];
      historyIndex = -1;
      currentEnSession = [];
      currentJaSession = [];
      activePcmChunks = [];
      activeTotalBytes = 0;
      preRingBuffer = [];
      await updateDisplays();
      setStatus('履歴クリア');
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        window.navigateHistory('up');
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        window.navigateHistory('down');
      }
    });

    async function initG2() {
      try {
        setStatus(`接続中... [${APP_VERSION}]`);
        bridge = await waitForEvenAppBridge();
        
        const mainText = new TextContainerProperty({
          xPosition: 0,
          yPosition: 0,
          width: 576,
          height: 288,
          borderWidth: 0,
          borderColor: 5,
          paddingLength: 4,
          containerID: 1,
          containerName: 'hud_main',
          content: getDisplayText(),
          isEventCapture: 1,
        });

        await bridge.createStartUpPageContainer(
          new CreateStartUpPageContainer({
            containerTotalNum: 1,
            textObject: [mainText],
          })
        );

        await bridge.audioControl(true);
        setStatus(`G2 SDK 接続完了 (${APP_VERSION}) / マイクON`);

        bridge.onEvenHubEvent(async event => {
          const rawPcm = event.audioEvent?.audioPcm;
          if (rawPcm) {
            const normalized = normalizePcm(rawPcm);
            if (normalized && normalized.length > 0) {
              handleAudioData(normalized);
            }
          }

          const sysType = event.sysEvent?.eventType;
          const textType = event.textEvent?.eventType;

          if (sysType === OsEventTypeList.CLICK_EVENT || textType === OsEventTypeList.CLICK_EVENT) {
            if (currentMode === 2) {
              processQueue();
            }
          }

          const evt = sysType || textType;
          if (evt === OsEventTypeList.UP_EVENT || evt === OsEventTypeList.SCROLL_UP_EVENT || evt === OsEventTypeList.FLICK_UP_EVENT) {
            window.navigateHistory('up');
          }
          if (evt === OsEventTypeList.DOWN_EVENT || evt === OsEventTypeList.SCROLL_DOWN_EVENT || evt === OsEventTypeList.FLICK_DOWN_EVENT) {
            window.navigateHistory('down');
          }
        });

      } catch (e) {
        setStatus("接続エラー: " + e.message);
      }
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    async function sendToG2Display(text) {
      if (!bridge) return;
      try {
        await bridge.textContainerUpgrade(
          new TextContainerUpgrade({
            containerID: 1,
            containerName: 'hud_main',
            content: text,
          })
        );
      } catch (e) {
        console.error("Display update failed:", e);
      }
    }

    function updateUIOnly(mode) {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab' + mode);
      if (activeTab) activeTab.classList.add('active');

      document.querySelectorAll('.hud-mode-screen').forEach(s => s.classList.remove('active'));
      const activeScreen = document.getElementById('mode' + mode + 'Screen');
      if (activeScreen) activeScreen.classList.add('active');
    }

    window.switchMode = function(mode) {
      currentMode = mode;
      activePcmChunks = [];
      activeTotalBytes = 0;
      preRingBuffer = [];
      isProcessing = false;
      if (silenceTimer) clearTimeout(silenceTimer);
      updateUIOnly(currentMode);
      updateDisplays();
    };

    window.forceSendPTT = function() {
      if (currentMode !== 2) {
        window.switchMode(2);
      }
      processQueue();
    };

    initG2();
  </script>
</body>
</html>
